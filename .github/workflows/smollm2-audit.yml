name: Audit SmolLM2 135M reference

on:
  push:
    branches: [research/smollm2-135m-reference]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hub client
        run: python -m pip install huggingface_hub==0.24.7

      - name: Inspect exact checkpoint without loading model execution code
        run: |
          python - <<'PY'
          import hashlib
          import json
          import struct
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download

          repo = "HuggingFaceTB/SmolLM2-135M"
          api = HfApi()
          info = api.model_info(repo, files_metadata=True)
          revision = info.sha
          print("revision=", revision)

          paths = {}
          for name in ["config.json", "generation_config.json", "tokenizer.json", "tokenizer_config.json", "model.safetensors"]:
              paths[name] = Path(hf_hub_download(repo_id=repo, filename=name, revision=revision))

          model_path = paths["model.safetensors"]
          digest = hashlib.sha256(model_path.read_bytes()).hexdigest()
          print("model_sha256=", digest)
          print("model_bytes=", model_path.stat().st_size)

          with model_path.open("rb") as handle:
              header_len = struct.unpack("<Q", handle.read(8))[0]
              header = json.loads(handle.read(header_len))
          tensors = {name: meta for name, meta in header.items() if name != "__metadata__"}
          print("tensor_count=", len(tensors))
          dtypes = sorted({meta["dtype"] for meta in tensors.values()})
          print("dtypes=", dtypes)
          print("has_lm_head=", "lm_head.weight" in tensors)
          print("has_embedding=", "model.embed_tokens.weight" in tensors)
          print("embedding=", tensors.get("model.embed_tokens.weight"))
          print("q0=", tensors.get("model.layers.0.self_attn.q_proj.weight"))
          print("k0=", tensors.get("model.layers.0.self_attn.k_proj.weight"))
          print("v0=", tensors.get("model.layers.0.self_attn.v_proj.weight"))
          print("o0=", tensors.get("model.layers.0.self_attn.o_proj.weight"))

          config = json.loads(paths["config.json"].read_text())
          wanted = [
              "architectures", "model_type", "hidden_size", "intermediate_size",
              "num_hidden_layers", "num_attention_heads", "num_key_value_heads",
              "max_position_embeddings", "rms_norm_eps", "rope_theta", "rope_scaling",
              "rope_interleaved", "hidden_act", "attention_bias", "tie_word_embeddings",
              "torch_dtype", "vocab_size", "bos_token_id", "eos_token_id",
          ]
          print("config=", json.dumps({key: config.get(key) for key in wanted}, sort_keys=True))

          assert config["architectures"] == ["LlamaForCausalLM"]
          assert config["model_type"] == "llama"
          assert config["hidden_size"] == 576
          assert config["intermediate_size"] == 1536
          assert config["num_hidden_layers"] == 30
          assert config["num_attention_heads"] == 9
          assert config["num_key_value_heads"] == 3
          assert config["num_attention_heads"] % config["num_key_value_heads"] == 0
          assert config["hidden_size"] % config["num_attention_heads"] == 0
          assert config["hidden_size"] // config["num_attention_heads"] == 64
          assert config["hidden_act"] == "silu"
          assert config["attention_bias"] is False
          assert config["tie_word_embeddings"] is True
          assert config["torch_dtype"] == "bfloat16"
          assert config["rope_scaling"] is None
          assert config.get("rope_interleaved") is False
          assert dtypes == ["BF16"]
          assert "model.embed_tokens.weight" in tensors
          assert "lm_head.weight" not in tensors
          assert tensors["model.embed_tokens.weight"]["shape"] == [49152, 576]
          assert tensors["model.layers.0.self_attn.q_proj.weight"]["shape"] == [576, 576]
          assert tensors["model.layers.0.self_attn.k_proj.weight"]["shape"] == [192, 576]
          assert tensors["model.layers.0.self_attn.v_proj.weight"]["shape"] == [192, 576]
          assert tensors["model.layers.0.self_attn.o_proj.weight"]["shape"] == [576, 576]
          print("SmolLM2 checkpoint audit passed")
          PY
