name: Refresh Cargo lock PR119

on:
  push:
    branches:
      - feat/exact-weight-allocation-accounting

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exact-weight-allocation-accounting
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfile from workspace manifests
        run: cargo check -p nnis-cli
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: synchronize Cargo lockfile after PR 118"
          git push origin HEAD:feat/exact-weight-allocation-accounting
