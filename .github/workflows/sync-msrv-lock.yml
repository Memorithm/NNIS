name: Sync MSRV lockfile

on:
  push:
    branches: [feature/nnis-generate-cli]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Memorithm/NVIDIA-Native-Inference-Stack'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feature/nnis-generate-cli

      - name: Install Rust 1.77
        run: rustup toolchain install 1.77.0 --profile minimal

      - name: Regenerate and verify lockfile at MSRV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/nnis-bench/src/lib.rs')
          text = path.read_text()
          old = 'size_of::<f32>()'
          new = 'core::mem::size_of::<f32>()'
          if old not in text and new not in text:
              raise SystemExit('expected nnis-bench size_of expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm Cargo.lock
          cargo +1.77.0 generate-lockfile
          cargo +1.77.0 update -p unicode-segmentation --precise 1.12.0
          cargo +1.77.0 update -p monostate --precise 0.1.14
          cargo +1.77.0 update -p rayon --precise 1.10.0
          cargo +1.77.0 update -p rayon-core --precise 1.12.1
          cargo +1.77.0 check --workspace --all-targets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/nnis-bench/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m 'build: enforce Rust 1.77 dependency and test compatibility'
            git push origin HEAD:feature/nnis-generate-cli
          fi
