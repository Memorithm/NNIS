# Temporary branch-local patch helper; removed before PR.
name: Temporary KVLab v4 KV byte accounting guard

on:
  push:
    branches:
      - fix/kvlab-v4-logical-kv-byte-accounting

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/kvlab-v4-logical-kv-byte-accounting
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Patch backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("crates/nnis-cli/src/bin/nnis-kvlab-backend-v4.rs")
          s = p.read_text()
          if "exact_checkpoint_kv_bytes_per_token" not in s:
              marker = "fn sha256_file(path: &std::path::Path) -> Result<String, String> {"
              helper = '''fn exact_checkpoint_kv_bytes_per_token(
              spec: &ExactDecoderCheckpointSpec,
          ) -> Result<u64, String> {
              if spec.num_attention_heads == 0 || spec.hidden_size % spec.num_attention_heads != 0 {
                  return Err(format!(
                      "exact checkpoint {} has invalid attention geometry for KV accounting",
                      spec.name
                  ));
              }
              let head_dim = spec.hidden_size / spec.num_attention_heads;
              [
                  spec.num_hidden_layers as u64,
                  spec.num_key_value_heads as u64,
                  head_dim as u64,
                  2_u64,
                  std::mem::size_of::<f32>() as u64,
              ]
              .into_iter()
              .try_fold(1_u64, |product, factor| {
                  product.checked_mul(factor).ok_or_else(|| {
                      format!("exact checkpoint {} KV byte accounting overflows u64", spec.name)
                  })
              })
          }

          '''
              assert marker in s
              s = s.replace(marker, helper + marker, 1)

              execute_marker = '''    let checkpoint_spec = exact_checkpoint_spec(args)?;
              validate_local_checkpoint_artifact(args, checkpoint_spec)?;

              let device = Device::get(args.device_ordinal).map_err(|error| {'''
              execute_replacement = '''    let checkpoint_spec = exact_checkpoint_spec(args)?;
              validate_local_checkpoint_artifact(args, checkpoint_spec)?;
              let expected_bytes_per_token = exact_checkpoint_kv_bytes_per_token(checkpoint_spec)?;
              if request.bytes_per_token != expected_bytes_per_token {
                  return Err(format!(
                      "request bytes_per_token {} does not match NNIS f32 KV cache geometry for {}: expected {}",
                      request.bytes_per_token, checkpoint_spec.name, expected_bytes_per_token
                  ));
              }

              let device = Device::get(args.device_ordinal).map_err(|error| {'''
              assert execute_marker in s
              s = s.replace(execute_marker, execute_replacement, 1)

              test_marker = '''    #[test]
              fn exact_checkpoint_identity_requires_registered_source_and_revision() {'''
              test_insert = '''    #[test]
              fn exact_checkpoint_kv_byte_accounting_matches_f32_runtime_geometry() {
                  assert_eq!(
                      exact_checkpoint_kv_bytes_per_token(&SMOLLM2_135M_BF16).unwrap(),
                      46_080
                  );
                  assert_eq!(
                      exact_checkpoint_kv_bytes_per_token(&TINYLLAMA_1P1B_CHAT_BF16).unwrap(),
                      45_056
                  );
              }

              #[test]
              fn exact_checkpoint_identity_requires_registered_source_and_revision() {'''
              assert test_marker in s
              s = s.replace(test_marker, test_insert, 1)
              p.write_text(s)
          PY
      - name: Format
        run: |
          rustup default stable
          cargo fmt --all
      - name: Test backend
        run: cargo test -p nnis-cli --bin nnis-kvlab-backend-v4
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add crates/nnis-cli/src/bin/nnis-kvlab-backend-v4.rs
          git commit -m "fix(kvlab): verify logical KV bytes per token"
          git push origin HEAD:fix/kvlab-v4-logical-kv-byte-accounting
