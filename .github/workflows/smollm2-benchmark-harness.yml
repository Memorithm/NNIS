name: SmolLM2 benchmark harness

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "crates/nnis-model/src/**"
      - "crates/nnis-bench/Cargo.toml"
      - "crates/nnis-bench/examples/smollm2_e2e.rs"
      - "crates/nnis-bench/examples/smollm2_lm_head_weight_representation.rs"
      - "crates/nnis-bench/examples/compare_smollm2_reports.rs"
      - "crates/nnis-bench/examples/silu_multiply_fusion.rs"
      - "crates/nnis-bench/examples/cached_attention_parallel_value.rs"
      - "crates/nnis-bench/examples/smollm2_f16_attention_parallel_score_matrix.rs"
      - "crates/nnis-bench/examples/smollm2_f16_attention_parallel_score_qualification.rs"
      - "tools/bench_smollm2_transformers.py"
      - "tools/run_w1_lm_head_bf16_sweep.py"
      - "tools/run_w1_e2e_abba.py"
      - "tools/run_r2_silu_fusion_e2e_abba.py"
      - "tools/run_r2_attention_parallel_value_e2e_abba.py"
      - "tools/run_f16_fused_mlp_e2e_abba.py"
      - "tools/requirements-smollm2-benchmark-gpu.txt"
      - "docs/SMOLLM2_BENCHMARK.md"
      - "docs/W1_LM_HEAD_BF16_SWEEP.md"
      - "docs/W1_E2E_ABBA.md"
      - "docs/R2_SILU_MULTIPLY_FUSION.md"
      - "docs/R2_SILU_MULTIPLY_FUSION_E2E.md"
      - "docs/R2_CACHED_ATTENTION_PARALLEL_VALUE.md"
      - "docs/R2_CACHED_ATTENTION_PARALLEL_VALUE_E2E.md"
      - ".github/workflows/smollm2-benchmark-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Check NNIS benchmark examples
        run: |
          cargo check --locked -p nnis-bench --example smollm2_e2e
          cargo check --locked -p nnis-bench --example smollm2_lm_head_weight_representation
          cargo check --locked -p nnis-bench --example compare_smollm2_reports
          cargo check --locked -p nnis-bench --example silu_multiply_fusion
          cargo check --locked -p nnis-bench --example cached_attention_parallel_value
          cargo check --locked -p nnis-bench --example smollm2_f16_attention_parallel_score_matrix
          cargo check --locked -p nnis-bench --example smollm2_f16_attention_parallel_score_qualification

      - name: Clippy NNIS benchmark examples
        run: |
          cargo clippy --locked -p nnis-bench --example smollm2_e2e -- -D warnings
          cargo clippy --locked -p nnis-bench --example smollm2_lm_head_weight_representation -- -D warnings
          cargo clippy --locked -p nnis-bench --example compare_smollm2_reports -- -D warnings
          cargo clippy --locked -p nnis-bench --example silu_multiply_fusion -- -D warnings
          cargo clippy --locked -p nnis-bench --example cached_attention_parallel_value -- -D warnings
          cargo clippy --locked -p nnis-bench --example smollm2_f16_attention_parallel_score_matrix -- -D warnings
          cargo clippy --locked -p nnis-bench --example smollm2_f16_attention_parallel_score_qualification -- -D warnings

      - name: Validate benchmark Python harnesses
        run: |
          python3 -m py_compile tools/bench_smollm2_transformers.py
          python3 -m py_compile tools/run_w1_lm_head_bf16_sweep.py
          python3 -m py_compile tools/run_w1_e2e_abba.py
          python3 -m py_compile tools/run_r2_silu_fusion_e2e_abba.py
          python3 -m py_compile tools/run_r2_attention_parallel_value_e2e_abba.py
          python3 -m py_compile tools/run_f16_fused_mlp_e2e_abba.py
          python3 tools/bench_smollm2_transformers.py --help >/dev/null
          python3 tools/run_w1_lm_head_bf16_sweep.py --help >/dev/null
          python3 tools/run_w1_e2e_abba.py --help >/dev/null
          python3 tools/run_r2_silu_fusion_e2e_abba.py --help >/dev/null
          python3 tools/run_r2_attention_parallel_value_e2e_abba.py --help >/dev/null
          python3 tools/run_f16_fused_mlp_e2e_abba.py --help >/dev/null
          python3 tools/run_f16_fused_mlp_e2e_abba.py --self-test
          grep -q '^transformers==4.40.1$' tools/requirements-smollm2-benchmark-gpu.txt
          grep -q '^safetensors==0.4.5$' tools/requirements-smollm2-benchmark-gpu.txt
          grep -q '^huggingface_hub==0.24.7$' tools/requirements-smollm2-benchmark-gpu.txt
