name: Branch NNML1 parity push code

on:
  push:
    branches:
      - feat/nnml1-multi-model-parity-evidence-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/nnml1-multi-model-parity-evidence-v1
          fetch-depth: 0

      - name: Reapply validated integration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/branch-nnml1-multi-model-parity-patch.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(r"json.push('\n');", r"json.push('\\n');")
          exec(compile(script, '<validated-parity-patch>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate code before push
        run: |
          python3 tools/validate_nnml1_multi_model_parity_evidence.py --self-test
          python3 -m py_compile \
            tools/validate_nnml1_multi_model_parity_evidence.py \
            tools/run_tinyllama_massive_campaign.py
          rustup component add rustfmt
          cargo fmt --all
          cargo check --locked -p nnis-model --example compare_smollm2_135m

      - name: Commit code only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/validate_nnml1_multi_model_parity_evidence.py \
            tools/run_tinyllama_massive_campaign.py \
            crates/nnis-model/examples/compare_smollm2_135m.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(nnml1): integrate multi-model parity producers"
          git push origin HEAD:feat/nnml1-multi-model-parity-evidence-v1
