name: Apply F16 accounting core

on:
  push:
    branches:
      - feat/f16-weight-allocation-accounting

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f16-weight-allocation-accounting
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply shared accounting integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          weights = Path('crates/nnis-model/src/weights.rs')
          text = weights.read_text()
          text = text.replace(
              'struct WeightAllocationObservation {\n    logical_name: String,\n    allocation_key: u64,\n    dtype: WeightAllocationDTypeV1,\n    elements: u64,\n    bytes: u64,\n}',
              'pub(crate) struct WeightAllocationObservation {\n    pub(crate) logical_name: String,\n    pub(crate) allocation_key: u64,\n    pub(crate) dtype: WeightAllocationDTypeV1,\n    pub(crate) elements: u64,\n    pub(crate) bytes: u64,\n}',
              1,
          )
          text = text.replace(
              'fn summarize_weight_allocations(\n',
              'pub(crate) fn summarize_weight_allocations(\n',
              1,
          )
          weights.write_text(text)

          f16 = Path('crates/nnis-model/src/f16_reference_runtime.rs')
          text = f16.read_text()
          text = text.replace(
              'use crate::runtime::build_rope_cache;\n',
              'use crate::runtime::build_rope_cache;\nuse crate::weights::{summarize_weight_allocations, WeightAllocationObservation};\n',
              1,
          )
          text = text.replace(
              '    F32RuntimeKernels, GenerationConfig, MatrixWeight, ModelConfig, ModelWeights, WeightDType,\n',
              '    F32RuntimeKernels, GenerationConfig, MatrixWeight, ModelConfig, ModelWeights,\n    WeightAllocationDTypeV1, WeightAllocationSummaryV1, WeightDType,\n',
              1,
          )
          impl_marker = 'impl F16ModelWeights {\n    fn from_f32(\n'
          methods = (
              'impl F16ModelWeights {\n'
              '    fn weight_allocation_summary_v1(&self) -> Result<WeightAllocationSummaryV1> {\n'
              '        let mut observations = Vec::new();\n'
              '        self.for_each_buffer(|name, buffer| {\n'
              '            if buffer.len() == 0 || buffer.device_ptr() == 0 {\n'
              '                return Err(NnisError::invalid_input(format!(\n'
              '                    "F16 weight {name} has no live device allocation to account"\n'
              '                )));\n'
              '            }\n'
              '            observations.push(WeightAllocationObservation {\n'
              '                logical_name: name.to_string(),\n'
              '                allocation_key: buffer.device_ptr(),\n'
              '                dtype: WeightAllocationDTypeV1::F16,\n'
              '                elements: u64::try_from(buffer.len()).map_err(|_| {\n'
              '                    NnisError::invalid_input(format!(\n'
              '                        "F16 weight {name} element count exceeds u64"\n'
              '                    ))\n'
              '                })?,\n'
              '                bytes: u64::try_from(buffer.size_bytes()).map_err(|_| {\n'
              '                    NnisError::invalid_input(format!(\n'
              '                        "F16 weight {name} byte size exceeds u64"\n'
              '                    ))\n'
              '                })?,\n'
              '            });\n'
              '            Ok(())\n'
              '        })?;\n'
              '        summarize_weight_allocations(observations)\n'
              '    }\n\n'
              '    fn for_each_buffer(\n'
              '        &self,\n'
              '        mut visit: impl FnMut(&str, &DeviceBuffer<u16>) -> Result<()>,\n'
              '    ) -> Result<()> {\n'
              '        visit("token_embedding", self.token_embedding.as_ref())?;\n'
              '        for (index, layer) in self.layers.iter().enumerate() {\n'
              '            visit(\n'
              '                &format!("layers.{index}.input_norm"),\n'
              '                layer.input_norm.as_ref(),\n'
              '            )?;\n'
              '            visit(&format!("layers.{index}.q_proj"), layer.q_proj.as_ref())?;\n'
              '            visit(&format!("layers.{index}.k_proj"), layer.k_proj.as_ref())?;\n'
              '            visit(&format!("layers.{index}.v_proj"), layer.v_proj.as_ref())?;\n'
              '            visit(&format!("layers.{index}.o_proj"), layer.o_proj.as_ref())?;\n'
              '            visit(\n'
              '                &format!("layers.{index}.post_attention_norm"),\n'
              '                layer.post_attention_norm.as_ref(),\n'
              '            )?;\n'
              '            visit(\n'
              '                &format!("layers.{index}.gate_proj"),\n'
              '                layer.gate_proj.as_ref(),\n'
              '            )?;\n'
              '            visit(&format!("layers.{index}.up_proj"), layer.up_proj.as_ref())?;\n'
              '            visit(\n'
              '                &format!("layers.{index}.down_proj"),\n'
              '                layer.down_proj.as_ref(),\n'
              '            )?;\n'
              '        }\n'
              '        visit("final_norm", self.final_norm.as_ref())?;\n'
              '        visit("lm_head", self.lm_head.as_ref())\n'
              '    }\n\n'
              '    fn from_f32(\n'
          )
          if 'fn weight_allocation_summary_v1(&self)' not in text:
              if impl_marker not in text:
                  raise SystemExit('F16ModelWeights insertion point not found')
              text = text.replace(impl_marker, methods, 1)
          config_marker = '    pub fn config(&self) -> &ModelConfig {\n        &self.config\n    }\n\n'
          public_method = (
              config_marker
              + '    /// Exact bytes of live CUDA allocations owned by the resident F16 weight graph.\n'
              + '    /// This is allocation ownership accounting, not physical page residency or peak conversion memory.\n'
              + '    pub fn weight_allocation_summary_v1(&self) -> Result<WeightAllocationSummaryV1> {\n'
              + '        self.weights.weight_allocation_summary_v1()\n'
              + '    }\n\n'
          )
          if 'pub fn weight_allocation_summary_v1(&self)' not in text:
              if config_marker not in text:
                  raise SystemExit('F16ReferenceModel config insertion point not found')
              text = text.replace(config_marker, public_method, 1)
          f16.write_text(text)
          PY
          cargo fmt --all
          cargo check --locked -p nnis-model --all-targets
      - name: Commit core if valid
        shell: bash
        run: |
          set -euo pipefail
          git add crates/nnis-model/src/weights.rs crates/nnis-model/src/f16_reference_runtime.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(model): account resident F16 weight allocations"
          git push origin HEAD:feat/f16-weight-allocation-accounting
