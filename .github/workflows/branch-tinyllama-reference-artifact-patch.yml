name: Branch TinyLlama reference artifact patch

on:
  push:
    branches:
      - feat/nnml1-tinyllama-reference-artifact-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/nnml1-tinyllama-reference-artifact-v1
          fetch-depth: 0

      - name: Apply integration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          fixture_path = Path("tools/tinyllama_1p1b_chat_fixture.py")
          fixture = fixture_path.read_text(encoding="utf-8")
          marker = 'identity_file = args.output / IDENTITY_FILENAME'
          if marker not in fixture:
              fixture = replace_once(
                  fixture,
                  "import math\nimport shutil\nfrom pathlib import Path\n\nimport torch\n",
                  '''import math\nimport os\nimport shutil\nfrom pathlib import Path\n\nfrom tokenizer_reference_identity import build_identity\nfrom validate_tinyllama_reference_artifact import (\n    CHECKPOINT_SPEC_NAME,\n    CHECKPOINT_SPEC_VERSION,\n    IDENTITY_FILENAME,\n    REFERENCE_ENV,\n    REFERENCE_EXECUTION_POLICY,\n    REFERENCE_ORACLE_SEMANTICS,\n    REFERENCE_RUNTIME,\n    SUITE_KIND,\n    validate_fixture,\n)\n\nfor _name, _value in REFERENCE_ENV.items():\n    os.environ[_name] = _value\n\nimport torch\n''',
                  "fixture imports",
              )
              fixture = replace_once(
                  fixture,
                  'PROMPT_FAMILIES = {\n',
                  '''def configure_reference_runtime() -> None:\n    torch.manual_seed(0)\n    torch.use_deterministic_algorithms(True)\n    torch.set_num_threads(1)\n    torch.set_num_interop_threads(1)\n    if not torch.are_deterministic_algorithms_enabled():\n        raise RuntimeError("trusted reference requires deterministic torch algorithms")\n    if torch.get_num_threads() != 1 or torch.get_num_interop_threads() != 1:\n        raise RuntimeError(\n            "trusted reference requires exactly one intra-op and one inter-op CPU thread"\n        )\n\n\nPROMPT_FAMILIES = {\n''',
                  "fixture runtime policy",
              )
              fixture = replace_once(
                  fixture,
                  '        "kind": "nnis-trained-llama-reference-suite-v1",\n',
                  '        "kind": SUITE_KIND,\n',
                  "fixture suite kind",
              )
              fixture = replace_once(
                  fixture,
                  '        "expected_config": converted_config,\n        "case_policy": {\n',
                  '        "expected_config": converted_config,\n        "reference_execution_policy": dict(REFERENCE_EXECUTION_POLICY),\n        "case_policy": {\n',
                  "fixture reference execution policy",
              )
              fixture = replace_once(
                  fixture,
                  '            "oracle": "Transformers CPU F32 greedy generation from the exact pinned checkpoint widened to F32",\n',
                  '            "oracle": REFERENCE_ORACLE_SEMANTICS,\n',
                  "fixture oracle semantics",
              )
              fixture = replace_once(
                  fixture,
                  'def main() -> None:\n    parser = argparse.ArgumentParser(\n',
                  'def main() -> None:\n    configure_reference_runtime()\n    parser = argparse.ArgumentParser(\n',
                  "fixture configure runtime call",
              )
              fixture = replace_once(
                  fixture,
                  '    tokenizer_digest = sha256(tokenizer_file)\n\n    model_dir = args.output / "model"\n',
                  '''    tokenizer_digest = sha256(tokenizer_file)\n    identity = build_identity(\n        checkpoint_spec_name=CHECKPOINT_SPEC_NAME,\n        checkpoint_spec_version=CHECKPOINT_SPEC_VERSION,\n        source_repo=REPO_ID,\n        source_revision=REVISION,\n        source_model_sha256=MODEL_SHA256,\n        tokenizer_path=tokenizer_file,\n        reference_kind=SUITE_KIND,\n        reference_runtime=REFERENCE_RUNTIME,\n        reference_runtime_version=TRANSFORMERS_VERSION,\n        source_weight_dtype="bfloat16",\n        execution_weight_dtype="f32",\n        oracle_semantics=REFERENCE_ORACLE_SEMANTICS,\n    )\n    identity_file = args.output / IDENTITY_FILENAME\n    identity_file.write_text(json.dumps(identity, indent=2) + "\\n", encoding="utf-8")\n\n    model_dir = args.output / "model"\n''',
                  "fixture persisted identity",
              )
              fixture = replace_once(
                  fixture,
                  '    build_reference_suite(checkpoint, suite_file, converted_config, tokenizer_digest)\n\n    print(f"checkpoint={REPO_ID}@{REVISION}")\n',
                  '''    build_reference_suite(checkpoint, suite_file, converted_config, tokenizer_digest)\n    validate_fixture(args.output)\n\n    print(f"checkpoint={REPO_ID}@{REVISION}")\n''',
                  "fixture self validation",
              )
              fixture = replace_once(
                  fixture,
                  '    print(f"tokenizer_sha256={tokenizer_digest}")\n    print(f"transformers={transformers.__version__}")\n',
                  '    print(f"tokenizer_sha256={tokenizer_digest}")\n    print(f"identity_file={identity_file}")\n    print(f"transformers={transformers.__version__}")\n',
                  "fixture identity output",
              )
              fixture_path.write_text(fixture, encoding="utf-8")

          launcher_path = Path("tools/run_tinyllama_massive_campaign.py")
          launcher = launcher_path.read_text(encoding="utf-8")
          launcher_marker = "from validate_tinyllama_reference_artifact import ArtifactError"
          if launcher_marker not in launcher:
              launcher = replace_once(
                  launcher,
                  'from tokenizer_reference_identity import IdentityError, build_identity, validate_documents\n\nBENCHMARK_KIND = "trained-llama-f16-massive-abba-v1"\nSUITE_KIND = "nnis-trained-llama-reference-suite-v1"\nSOURCE_REPO = "TinyLlama/TinyLlama-1.1B-Chat-v1.0"\nSOURCE_REVISION = "d9128824c0c80111be21424e68086f52413fb413"\nSOURCE_MODEL_SHA256 = "6e6001da2106d4757498752a021df6c2bdc332c650aae4bae6b0c004dcf14933"\nCHECKPOINT_SPEC_NAME = "tinyllama-1.1b-chat-v1.0-bf16"\nCHECKPOINT_SPEC_VERSION = 1\nREFERENCE_TRANSFORMERS_VERSION = "4.43.3"\nREFERENCE_ORACLE_SEMANTICS = (\n    "Transformers CPU F32 greedy generation from the exact pinned checkpoint widened to F32"\n)\nDEFAULT_CANDIDATES',
                  '''from validate_tinyllama_reference_artifact import (\n    ArtifactError,\n    SOURCE_MODEL_SHA256,\n    SOURCE_REPO,\n    SOURCE_REVISION,\n    validate_fixture,\n)\n\nBENCHMARK_KIND = "trained-llama-f16-massive-abba-v1"\nDEFAULT_CANDIDATES''',
                  "launcher imports and constants",
              )
              start = launcher.index("def validate_existing_fixture(fixture: Path) -> bool:\n")
              end = launcher.index("\n\ndef ensure_fixture(", start)
              launcher = (
                  launcher[:start]
                  + '''def validate_existing_fixture(fixture: Path) -> bool:\n    try:\n        validate_fixture(fixture)\n    except ArtifactError:\n        return False\n    return True\n'''
                  + launcher[end:]
              )
              launcher_path.write_text(launcher, encoding="utf-8")
          PY

      - name: Validate patched Python
        run: |
          python3 tools/tokenizer_reference_identity.py --self-test
          python3 tools/validate_tinyllama_reference_artifact.py --self-test
          python3 -m py_compile \
            tools/tokenizer_reference_identity.py \
            tools/validate_tinyllama_reference_artifact.py \
            tools/tinyllama_1p1b_chat_fixture.py \
            tools/run_tinyllama_massive_campaign.py

      - name: Commit integration patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tinyllama_1p1b_chat_fixture.py tools/run_tinyllama_massive_campaign.py
          git commit -m "feat(nnml1): persist TinyLlama reference identity"
          git push origin HEAD:feat/nnml1-tinyllama-reference-artifact-v1
