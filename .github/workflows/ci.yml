name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.77 toolchain
        run: |
          rustup toolchain install 1.77.0 --profile minimal --component rustfmt,clippy
          rustup default 1.77.0

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests without GPU requirement
        run: cargo test --workspace --all-targets
