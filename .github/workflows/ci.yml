name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate external reference evidence
        run: >-
          python3 tools/validate_external_reference_evidence.py --self-test
          evidence/r1_tensorrt_edge_llm_v0_10_0_smollm2_thor.json

      - name: Validate NNIS F16 campaign evidence
        run: >-
          python3 tools/validate_nnis_f16_campaign_evidence.py --self-test
          evidence/r1_nnis_f16_smollm2_thor.json

      - name: Install stable Rust components
        run: rustup component add rustfmt clippy

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: cargo check
        if: always()
        run: cargo check --workspace --all-targets

      - name: clippy
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests without GPU requirement
        if: always()
        run: cargo test --workspace --all-targets

  msrv:
    name: Rust 1.77 check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install declared MSRV
        run: rustup toolchain install 1.77.0 --profile minimal

      - name: cargo check at MSRV
        run: cargo +1.77.0 check --workspace --all-targets
