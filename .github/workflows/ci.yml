name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rust-quality:
    name: Rust quality (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust components
        run: rustup component add rustfmt clippy

      - name: Normalize decoder branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/model-runtime-decoder'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock crates/nnis-model
            git commit -m 'style(model): apply rustfmt and sync lockfile'
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: cargo check
        if: always()
        run: cargo check --workspace --all-targets

      - name: clippy
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests without GPU requirement
        if: always()
        run: cargo test --workspace --all-targets
