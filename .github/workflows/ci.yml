name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate external reference evidence
        run: >-
          python3 tools/validate_external_reference_evidence.py --self-test
          evidence/r1_tensorrt_edge_llm_v0_10_0_smollm2_thor.json

      - name: Validate NNIS F16 campaign evidence
        run: >-
          python3 tools/validate_nnis_f16_campaign_evidence.py --self-test
          evidence/r1_nnis_f16_smollm2_thor.json

      - name: Validate direct Edge vs NNIS F16 evidence
        run: >-
          python3 tools/validate_r1_direct_edge_vs_nnis_f16.py --self-test
          evidence/r1_direct_edge_vs_nnis_f16_smollm2_thor.json

      - name: Validate fused MLP promotion evidence
        run: >-
          python3 tools/validate_f16_fused_mlp_promotion_evidence.py --self-test
          evidence/r3_f16_fused_mlp_smollm2_thor.json

      - name: Validate NNML0 real-checkpoint evidence contract
        run: python3 tools/validate_nnml0_real_safetensors_evidence.py --self-test

      - name: Validate NNML1 identity, parity and P0 bundle contracts
        run: |
          python3 tools/tokenizer_reference_identity.py --self-test
          python3 tools/validate_tinyllama_reference_artifact.py --self-test
          python3 tools/validate_nnml1_multi_model_parity_evidence.py --self-test
          python3 tools/nnis_hub_nnml1_parity_validate.py --self-test
          python3 tools/run_p0_physical_qualification_bundle.py --self-test
          python3 -m py_compile \
            tools/tokenizer_reference_identity.py \
            tools/validate_tinyllama_reference_artifact.py \
            tools/validate_nnml1_multi_model_parity_evidence.py \
            tools/nnis_hub_nnml1_parity_validate.py \
            tools/run_p0_physical_qualification_bundle.py \
            tools/smollm2_135m_fixture.py \
            tools/tinyllama_1p1b_chat_fixture.py \
            tools/run_tinyllama_massive_campaign.py

      - name: Validate local-HF generation process contract
        run: |
          python3 tools/nnis_hub_hf_generate.py --self-test
          python3 -m unittest tools/test_nnis_hub_hf_generate.py -v
          python3 -m py_compile tools/nnis_hub_hf_generate.py tools/test_nnis_hub_hf_generate.py

      - name: Validate license provenance audit tooling
        run: |
          python3 tools/audit_license_provenance.py --self-test
          python3 tools/audit_license_provenance.py --root . --output /tmp/nnis-license-provenance.json
          python3 -m py_compile tools/audit_license_provenance.py

      - name: Install stable Rust components
        run: rustup component add rustfmt clippy

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: cargo check
        if: always()
        run: cargo check --locked --workspace --all-targets

      - name: Verify portable core dependency boundary
        if: always()
        run: bash scripts/check-portable-core.sh

      - name: Verify portable CPU dependency boundary
        if: always()
        run: bash scripts/check-portable-cpu.sh

      - name: clippy
        if: always()
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: tests without GPU requirement
        if: always()
        run: cargo test --locked --workspace --all-targets

  msrv:
    name: Rust 1.77 check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install declared MSRV
        run: rustup toolchain install 1.77.0 --profile minimal

      - name: cargo check at MSRV
        run: cargo +1.77.0 check --locked --workspace --all-targets


  pvp-wgpu:
    name: PVP WGPU parity (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WGPU_BACKEND: vulkan
      NNIS_REQUIRE_WGPU_PVP: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install software Vulkan device
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary

      - name: Execute NNIS PVP CPU-WGPU parity
        run: cargo +stable test --locked -p nnis-wgpu --test pvp_parity -- --nocapture
