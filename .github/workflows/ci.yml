name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rust-quality:
    name: Rust quality (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust components
        run: rustup component add rustfmt clippy

      - name: Normalize decoder runtime branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/model-runtime-decoder'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/nnis-model/src/runtime_kernels.rs')
          text = path.read_text()
          text = text.replace('-1.0 * 0.5 - 2.0 * 0.25', '-0.5 - 2.0 * 0.25')
          text = text.replace('2.0 * 0.5 + -1.0 * 0.25', '2.0 * 0.5 - 0.25')
          path.write_text(text)
          PY
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/nnis-model
            git commit -m 'style(model): normalize decoder runtime sources'
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: cargo check
        if: always()
        run: cargo check --workspace --all-targets

      - name: clippy
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests without GPU requirement
        if: always()
        run: cargo test --workspace --all-targets
