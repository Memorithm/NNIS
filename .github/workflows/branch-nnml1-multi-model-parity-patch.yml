name: Branch NNML1 multi-model parity patch

on:
  push:
    branches:
      - feat/nnml1-multi-model-parity-evidence-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/nnml1-multi-model-parity-evidence-v1
          fetch-depth: 0

      - name: Apply parity integration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          validator_path = Path("tools/validate_nnml1_multi_model_parity_evidence.py")
          validator = validator_path.read_text(encoding="utf-8")
          if 'parser.add_argument("--compose", type=Path)' not in validator:
              validator = replace_once(
                  validator,
                  '    parser.add_argument("--self-test", action="store_true")\n    args = parser.parse_args()\n    if args.self_test:\n        self_test()\n        print("NNML1 multi-model parity evidence self-test passed")\n    for path in args.paths:\n',
                  '    parser.add_argument("--self-test", action="store_true")\n    parser.add_argument("--compose", type=Path)\n    args = parser.parse_args()\n    if args.self_test:\n        self_test()\n        print("NNML1 multi-model parity evidence self-test passed")\n    if args.compose is not None:\n        records = [_load_json(path) for path in args.paths]\n        suite = build_suite(records)\n        args.compose.parent.mkdir(parents=True, exist_ok=True)\n        args.compose.write_text(json.dumps(suite, indent=2) + "\\n", encoding="utf-8")\n        print(f"composed={args.compose}")\n        return\n    for path in args.paths:\n',
                  "validator compose CLI",
              )
              validator_path.write_text(validator, encoding="utf-8")

          launcher_path = Path("tools/run_tinyllama_massive_campaign.py")
          launcher = launcher_path.read_text(encoding="utf-8")
          if "build_record" not in launcher:
              launcher = replace_once(
                  launcher,
                  'from validate_tinyllama_reference_artifact import (\n    ArtifactError,\n    SOURCE_MODEL_SHA256,\n    SOURCE_REPO,\n    SOURCE_REVISION,\n    validate_fixture,\n)\n',
                  'from validate_nnml1_multi_model_parity_evidence import (\n    GENERATION_TRAJECTORY,\n    build_record,\n)\nfrom validate_tinyllama_reference_artifact import (\n    ArtifactError,\n    CHECKPOINT_SPEC_NAME,\n    REFERENCE_RUNTIME,\n    REFERENCE_TRANSFORMERS_VERSION,\n    SOURCE_MODEL_SHA256,\n    SOURCE_REPO,\n    SOURCE_REVISION,\n    validate_fixture,\n)\n',
                  "launcher parity imports",
              )
              launcher = replace_once(
                  launcher,
                  '\n\ndef campaign_path(run_dir: Path, repeat: int) -> Path:\n',
                  '''\n\ndef collect_semantic_validation(campaigns: list[dict[str, Any]]) -> dict[str, Any]:\n    expected_observations = 0\n    observations = 0\n    successful_observations = 0\n    exact_greedy_observations = 0\n    for report in campaigns:\n        candidates = report.get("candidates")\n        rounds_per_candidate = report.get("rounds_per_candidate")\n        case_count = report.get("case_count")\n        if (\n            not isinstance(candidates, list)\n            or not candidates\n            or isinstance(rounds_per_candidate, bool)\n            or not isinstance(rounds_per_candidate, int)\n            or rounds_per_candidate <= 0\n            or isinstance(case_count, bool)\n            or not isinstance(case_count, int)\n            or case_count <= 0\n        ):\n            raise RuntimeError("campaign semantic dimensions are invalid")\n        expected_observations += len(candidates) * rounds_per_candidate * 4 * case_count\n        candidate_reports = report.get("candidate_reports")\n        if not isinstance(candidate_reports, list) or len(candidate_reports) != len(candidates):\n            raise RuntimeError("campaign candidate_reports do not cover candidates")\n        for candidate_report in candidate_reports:\n            rounds = candidate_report.get("rounds")\n            if not isinstance(rounds, list) or len(rounds) != rounds_per_candidate:\n                raise RuntimeError("campaign rounds do not match rounds_per_candidate")\n            for round_report in rounds:\n                blocks = round_report.get("blocks")\n                if not isinstance(blocks, list) or len(blocks) != 4:\n                    raise RuntimeError("campaign ABBA round must contain exactly four blocks")\n                for block in blocks:\n                    cases = block.get("cases")\n                    if not isinstance(cases, list) or len(cases) != case_count:\n                        raise RuntimeError("campaign block does not cover every reference case")\n                    for case in cases:\n                        if not isinstance(case, dict):\n                            raise RuntimeError("campaign case measurement must be an object")\n                        observations += 1\n                        if case.get("success") is True:\n                            successful_observations += 1\n                        generated_ids = case.get("generated_ids")\n                        decode_steps = case.get("decode_steps")\n                        exact = (\n                            case.get("success") is True\n                            and case.get("exact_oracle_greedy") is True\n                            and isinstance(generated_ids, list)\n                            and isinstance(decode_steps, int)\n                            and not isinstance(decode_steps, bool)\n                            and len(generated_ids) == decode_steps\n                        )\n                        if exact:\n                            exact_greedy_observations += 1\n    all_exact = (\n        observations > 0\n        and observations == expected_observations\n        and successful_observations == observations\n        and exact_greedy_observations == observations\n    )\n    return {\n        "expected_observations": expected_observations,\n        "observations": observations,\n        "successful_observations": successful_observations,\n        "exact_greedy_observations": exact_greedy_observations,\n        "all_exact_oracle_greedy": all_exact,\n    }\n\n\ndef campaign_path(run_dir: Path, repeat: int) -> Path:\n''',
                  "launcher semantic collector",
              )
              launcher = replace_once(
                  launcher,
                  '    all_campaigns_complete = all(report.get("campaign_complete") is True for report in campaigns)\n\n    cells = collect_case_observations(campaigns)\n',
                  '    all_campaigns_complete = all(report.get("campaign_complete") is True for report in campaigns)\n    semantic_validation = collect_semantic_validation(campaigns)\n\n    cells = collect_case_observations(campaigns)\n',
                  "launcher semantic summary call",
              )
              launcher = replace_once(
                  launcher,
                  '        and exact_git_commit_equal\n        and all_campaigns_complete\n    )\n',
                  '        and exact_git_commit_equal\n        and all_campaigns_complete\n        and semantic_validation["all_exact_oracle_greedy"]\n    )\n',
                  "launcher consensus semantic gate",
              )
              launcher = replace_once(
                  launcher,
                  '        "all_campaigns_complete": all_campaigns_complete,\n        "consensus_valid": consensus_valid,\n',
                  '        "all_campaigns_complete": all_campaigns_complete,\n        "semantic_validation": semantic_validation,\n        "consensus_valid": consensus_valid,\n',
                  "launcher consensus semantic field",
              )
              launcher = replace_once(
                  launcher,
                  '    fixture = ensure_fixture(root, work_dir, args.cache_dir, args.force_fixture)\n    binary = build_benchmark(root)\n',
                  '    fixture = ensure_fixture(root, work_dir, args.cache_dir, args.force_fixture)\n    fixture_identity = validate_fixture(fixture)\n    binary = build_benchmark(root)\n',
                  "launcher fixture identity",
              )
              launcher = replace_once(
                  launcher,
                  '    summary_path = run_dir / "SUMMARY.md"\n    write_markdown_summary(consensus, summary_path)\n\n    print(f"fixture={fixture}")\n',
                  '''    summary_path = run_dir / "SUMMARY.md"\n    write_markdown_summary(consensus, summary_path)\n\n    parity_path: Path | None = None\n    if consensus["consensus_valid"]:\n        semantic = consensus["semantic_validation"]\n        parity_record = build_record(\n            checkpoint_spec_name=CHECKPOINT_SPEC_NAME,\n            source_repo=SOURCE_REPO,\n            source_revision=SOURCE_REVISION,\n            source_model_sha256=SOURCE_MODEL_SHA256,\n            tokenizer_sha256=fixture_identity["tokenizer_sha256"],\n            reference_runtime=REFERENCE_RUNTIME,\n            reference_runtime_version=REFERENCE_TRANSFORMERS_VERSION,\n            execution_git_commit=head,\n            execution_backend="nnis-f16-cuda-massive-abba",\n            parity_level=GENERATION_TRAJECTORY,\n            case_count=fixture_identity["case_count"],\n            observations=semantic["observations"],\n            exact_greedy_observations=semantic["exact_greedy_observations"],\n            source_evidence_kind="nnis-tinyllama-trained-massive-f16-consensus-v1",\n            source_evidence_artifact=consensus_path.name,\n        )\n        parity_path = run_dir / "parity_record.json"\n        parity_path.write_text(json.dumps(parity_record, indent=2) + "\\n", encoding="utf-8")\n\n    print(f"fixture={fixture}")\n''',
                  "launcher parity record",
              )
              launcher = replace_once(
                  launcher,
                  '    print(f"summary={summary_path}")\n    print(f"campaigns_completed={len(campaigns)}/{args.repeats}")\n',
                  '    print(f"summary={summary_path}")\n    if parity_path is not None:\n        print(f"parity_record={parity_path}")\n    print(f"campaigns_completed={len(campaigns)}/{args.repeats}")\n',
                  "launcher parity output",
              )
              launcher_path.write_text(launcher, encoding="utf-8")

          rust_path = Path("crates/nnis-model/examples/compare_smollm2_135m.rs")
          rust = rust_path.read_text(encoding="utf-8")
          if "NNML1_PARITY_RECORD_KIND" not in rust:
              rust = replace_once(rust, "use serde::Deserialize;\n", "use serde::{Deserialize, Serialize};\n", "rust serde import")
              rust = replace_once(
                  rust,
                  "use std::path::{Path, PathBuf};\n",
                  "use std::path::{Path, PathBuf};\nuse std::process::Command;\n",
                  "rust Command import",
              )
              rust = replace_once(
                  rust,
                  'const SOURCE_MODEL_SHA256: &str =\n    "80521b40281d6ce74e35c9282c22539e75aa0ac8578892b2a59955ef78d55da1";\n',
                  'const SOURCE_MODEL_SHA256: &str =\n    "80521b40281d6ce74e35c9282c22539e75aa0ac8578892b2a59955ef78d55da1";\nconst CHECKPOINT_SPEC_NAME: &str = "smollm2-135m-bf16";\nconst CHECKPOINT_SPEC_VERSION: u32 = 1;\nconst NNML1_PARITY_RECORD_KIND: &str = "nnis-nnml1-reference-parity-record-v1";\n',
                  "rust parity constants",
              )
              rust = replace_once(
                  rust,
                  '    source_model_sha256: String,\n    transformers_version: String,\n',
                  '    source_model_sha256: String,\n    tokenizer_sha256: String,\n    transformers_version: String,\n',
                  "rust tokenizer manifest field",
              )
              rust = replace_once(
                  rust,
                  '    logit_policy: LogitPolicy,\n}\n\n#[derive(Debug)]\nstruct ErrorMetrics {\n',
                  '    logit_policy: LogitPolicy,\n    evidence_json: Option<PathBuf>,\n}\n\n#[derive(Debug, Clone, Serialize)]\nstruct ErrorMetrics {\n',
                  "rust arguments and metrics derive",
              )
              rust = replace_once(
                  rust,
                  '''struct ErrorMetrics {\n    max_abs: f32,\n    max_rel: f32,\n    rms: f64,\n    worst_index: usize,\n    failures: usize,\n    non_finite: usize,\n}\n\n''',
                  '''struct ErrorMetrics {\n    max_abs: f32,\n    max_rel: f32,\n    rms: f64,\n    worst_index: usize,\n    failures: usize,\n    non_finite: usize,\n}\n\n#[derive(Debug, Serialize)]\nstruct SemanticEvidence {\n    case_count: usize,\n    observations: usize,\n    exact_greedy_observations: usize,\n    exact_greedy_all: bool,\n}\n\n#[derive(Debug, Serialize)]\nstruct LogitEvidence {\n    atol: f32,\n    rtol: f32,\n    stages: usize,\n    failures: usize,\n    non_finite: usize,\n    max_abs: f32,\n    max_rms: f64,\n    strict_tolerance_asserted: bool,\n}\n\n#[derive(Debug, Serialize)]\nstruct SourceEvidence {\n    kind: &'static str,\n    artifact: String,\n}\n\n#[derive(Debug, Serialize)]\nstruct ParityRecord {\n    schema_version: u32,\n    kind: &'static str,\n    checkpoint_spec_name: &'static str,\n    checkpoint_spec_version: u32,\n    source_repo: String,\n    source_revision: String,\n    source_model_sha256: String,\n    tokenizer_sha256: String,\n    reference_runtime: &'static str,\n    reference_runtime_version: String,\n    execution_git_commit: String,\n    execution_git_dirty: bool,\n    execution_backend: &'static str,\n    parity_level: &'static str,\n    semantic: SemanticEvidence,\n    logits: Option<LogitEvidence>,\n    source_evidence: SourceEvidence,\n    promotion_authorized: bool,\n    claim_boundary: &'static str,\n}\n\n''',
                  "rust parity structs",
              )
              rust = replace_once(
                  rust,
                  '    let mut logit_policy = LogitPolicy::Strict;\n',
                  '    let mut logit_policy = LogitPolicy::Strict;\n    let mut evidence_json = None;\n',
                  "rust evidence arg init",
              )
              rust = replace_once(
                  rust,
                  '            "--logit-policy" => {\n                logit_policy = LogitPolicy::parse(\n                    &args\n                        .next()\n                        .ok_or("--logit-policy requires strict or report")?,\n                )?;\n            }\n            "--help" | "-h" => {\n',
                  '            "--logit-policy" => {\n                logit_policy = LogitPolicy::parse(\n                    &args\n                        .next()\n                        .ok_or("--logit-policy requires strict or report")?,\n                )?;\n            }\n            "--evidence-json" => {\n                evidence_json = Some(PathBuf::from(\n                    args.next().ok_or("--evidence-json requires a path")?,\n                ));\n            }\n            "--help" | "-h" => {\n',
                  "rust evidence argument parse",
              )
              rust = replace_once(
                  rust,
                  '"usage: compare_smollm2_135m --model DIR --reference DIR [--atol F32] [--rtol F32] [--logit-policy strict|report]"\n',
                  '"usage: compare_smollm2_135m --model DIR --reference DIR [--atol F32] [--rtol F32] [--logit-policy strict|report] [--evidence-json PATH]"\n',
                  "rust usage",
              )
              rust = replace_once(
                  rust,
                  '        logit_policy,\n    })\n',
                  '        logit_policy,\n        evidence_json,\n    })\n',
                  "rust arguments return",
              )
              rust = replace_once(
                  rust,
                  '    if manifest.transformers_version != "4.40.1"\n        || manifest.source_weight_dtype != "bfloat16"\n        || manifest.execution_weight_dtype != "f32"\n        || manifest.dtype != "f32"\n',
                  '    if manifest.transformers_version != "4.40.1"\n        || manifest.source_weight_dtype != "bfloat16"\n        || manifest.execution_weight_dtype != "f32"\n        || manifest.dtype != "f32"\n',
                  "rust numeric identity anchor",
              )
              rust = replace_once(
                  rust,
                  '    if manifest.logit_files.len() != manifest.decode_steps + 1 {\n',
                  '    if manifest.tokenizer_sha256.len() != 64\n        || !manifest\n            .tokenizer_sha256\n            .bytes()\n            .all(|byte| byte.is_ascii_digit() || (b\'a\'..=b\'f\').contains(&byte))\n    {\n        return Err(NnisError::invalid_input(\n            "reference tokenizer_sha256 is not a lowercase 64-hex digest",\n        ));\n    }\n    if manifest.logit_files.len() != manifest.decode_steps + 1 {\n',
                  "rust tokenizer identity validate",
              )
              rust = replace_once(
                  rust,
                  ') -> Result<()> {\n    let metrics = compare(actual, expected, atol, rtol);\n',
                  ') -> Result<ErrorMetrics> {\n    let metrics = compare(actual, expected, atol, rtol);\n',
                  "rust metrics return signature",
              )
              rust = replace_once(
                  rust,
                  '    Ok(())\n}\n\nfn require_greedy',
                  '    Ok(metrics)\n}\n\nfn require_greedy',
                  "rust metrics return value",
              )
              rust = replace_once(
                  rust,
                  'fn run(arguments: Arguments) -> Result<()> {\n',
                  '''fn git_output(arguments: &[&str]) -> Result<String> {\n    let output = Command::new("git")\n        .args(arguments)\n        .output()\n        .map_err(|error| NnisError::io("run git for evidence identity", error))?;\n    if !output.status.success() {\n        return Err(NnisError::invalid_input(format!(\n            "git command failed while binding evidence identity: {:?}",\n            arguments\n        )));\n    }\n    String::from_utf8(output.stdout)\n        .map(|value| value.trim().to_string())\n        .map_err(|error| NnisError::invalid_input(format!("git output was not UTF-8: {error}")))\n}\n\nfn repository_identity() -> Result<(String, bool)> {\n    let head = git_output(&["rev-parse", "HEAD"])?;\n    if head.len() != 40\n        || !head\n            .bytes()\n            .all(|byte| byte.is_ascii_digit() || (b'a'..=b'f').contains(&byte))\n    {\n        return Err(NnisError::invalid_input(format!(\n            "git HEAD is not a lowercase 40-hex commit: {head:?}"\n        )));\n    }\n    let status = git_output(&["status", "--porcelain", "--untracked-files=no"])?;\n    Ok((head, !status.is_empty()))\n}\n\nfn write_parity_evidence(\n    path: &Path,\n    arguments: &Arguments,\n    reference: &ReferenceManifest,\n    stage_metrics: &[ErrorMetrics],\n) -> Result<()> {\n    let (git_commit, dirty) = repository_identity()?;\n    if dirty {\n        return Err(NnisError::invalid_input(\n            "tracked worktree is dirty; refusing to emit qualifying parity evidence",\n        ));\n    }\n    let failures = stage_metrics.iter().map(|metrics| metrics.failures).sum();\n    let non_finite = stage_metrics.iter().map(|metrics| metrics.non_finite).sum();\n    let max_abs = stage_metrics\n        .iter()\n        .map(|metrics| metrics.max_abs)\n        .fold(0.0_f32, f32::max);\n    let max_rms = stage_metrics\n        .iter()\n        .map(|metrics| metrics.rms)\n        .fold(0.0_f64, f64::max);\n    let strict = arguments.logit_policy == LogitPolicy::Strict;\n    let record = ParityRecord {\n        schema_version: 1,\n        kind: NNML1_PARITY_RECORD_KIND,\n        checkpoint_spec_name: CHECKPOINT_SPEC_NAME,\n        checkpoint_spec_version: CHECKPOINT_SPEC_VERSION,\n        source_repo: reference.source_repo.clone(),\n        source_revision: reference.source_revision.clone(),\n        source_model_sha256: reference.source_model_sha256.clone(),\n        tokenizer_sha256: reference.tokenizer_sha256.clone(),\n        reference_runtime: "transformers",\n        reference_runtime_version: reference.transformers_version.clone(),\n        execution_git_commit: git_commit,\n        execution_git_dirty: false,\n        execution_backend: "nnis-model-cuda",\n        parity_level: if strict {\n            "logit_and_generation"\n        } else {\n            "generation_trajectory"\n        },\n        semantic: SemanticEvidence {\n            case_count: 1,\n            observations: 1,\n            exact_greedy_observations: 1,\n            exact_greedy_all: true,\n        },\n        logits: if strict {\n            Some(LogitEvidence {\n                atol: arguments.atol,\n                rtol: arguments.rtol,\n                stages: stage_metrics.len(),\n                failures,\n                non_finite,\n                max_abs,\n                max_rms,\n                strict_tolerance_asserted: true,\n            })\n        } else {\n            None\n        },\n        source_evidence: SourceEvidence {\n            kind: "smollm2-direct-logit-comparison-v1",\n            artifact: arguments\n                .reference_dir\n                .join("reference.json")\n                .display()\n                .to_string(),\n        },\n        promotion_authorized: false,\n        claim_boundary: "exact-checkpoint reference parity evidence only; this record does not establish general model-family support, serving performance, or automatic runtime promotion",\n    };\n    if let Some(parent) = path.parent() {\n        if !parent.as_os_str().is_empty() {\n            fs::create_dir_all(parent)\n                .map_err(|error| NnisError::io("create parity evidence directory", error))?;\n        }\n    }\n    let mut json = serde_json::to_string_pretty(&record)\n        .map_err(|error| NnisError::invalid_input(format!("serialize parity evidence: {error}")))?;\n    json.push('\n');\n    fs::write(path, json).map_err(|error| NnisError::io("write parity evidence", error))?;\n    Ok(())\n}\n\nfn run(arguments: Arguments) -> Result<()> {\n''',
                  "rust evidence helpers",
              )
              rust = replace_once(
                  rust,
                  '    let mut actual_logits = session.prefill(&reference.input_ids)?;\n',
                  '    let mut stage_metrics = Vec::with_capacity(reference.decode_steps + 1);\n    let mut actual_logits = session.prefill(&reference.input_ids)?;\n',
                  "rust stage metrics init",
              )
              rust = replace_once(
                  rust,
                  '    report_and_require(\n        "prefill",\n        &actual_logits,\n        &expected_prefill,\n        arguments.atol,\n        arguments.rtol,\n        arguments.logit_policy,\n    )?;\n',
                  '    stage_metrics.push(report_and_require(\n        "prefill",\n        &actual_logits,\n        &expected_prefill,\n        arguments.atol,\n        arguments.rtol,\n        arguments.logit_policy,\n    )?);\n',
                  "rust prefill metrics",
              )
              rust = replace_once(
                  rust,
                  '        report_and_require(\n            &format!("decode[{step}]"),\n            &actual_logits,\n            &expected,\n            arguments.atol,\n            arguments.rtol,\n            arguments.logit_policy,\n        )?;\n',
                  '        stage_metrics.push(report_and_require(\n            &format!("decode[{step}]"),\n            &actual_logits,\n            &expected,\n            arguments.atol,\n            arguments.rtol,\n            arguments.logit_policy,\n        )?);\n',
                  "rust decode metrics",
              )
              rust = replace_once(
                  rust,
                  '    println!("greedy_ids={generated:?}");\n    match arguments.logit_policy {\n',
                  '    println!("greedy_ids={generated:?}");\n    if let Some(path) = arguments.evidence_json.as_deref() {\n        write_parity_evidence(path, &arguments, &reference, &stage_metrics)?;\n        println!("parity_evidence={}", path.display());\n    }\n    match arguments.logit_policy {\n',
                  "rust evidence write",
              )
              rust_path.write_text(rust, encoding="utf-8")

          ci_path = Path(".github/workflows/ci.yml")
          ci = ci_path.read_text(encoding="utf-8")
          if "validate_nnml1_multi_model_parity_evidence.py" not in ci:
              ci = replace_once(
                  ci,
                  '      - name: Validate tokenizer/reference identity contract\n        run: |\n          python3 tools/tokenizer_reference_identity.py --self-test\n          python3 tools/validate_tinyllama_reference_artifact.py --self-test\n          python3 -m py_compile \\\n            tools/tokenizer_reference_identity.py \\\n            tools/validate_tinyllama_reference_artifact.py \\\n            tools/smollm2_135m_fixture.py \\\n            tools/tinyllama_1p1b_chat_fixture.py \\\n            tools/run_tinyllama_massive_campaign.py\n',
                  '      - name: Validate NNML1 identity and parity contracts\n        run: |\n          python3 tools/tokenizer_reference_identity.py --self-test\n          python3 tools/validate_tinyllama_reference_artifact.py --self-test\n          python3 tools/validate_nnml1_multi_model_parity_evidence.py --self-test\n          python3 -m py_compile \\\n            tools/tokenizer_reference_identity.py \\\n            tools/validate_tinyllama_reference_artifact.py \\\n            tools/validate_nnml1_multi_model_parity_evidence.py \\\n            tools/smollm2_135m_fixture.py \\\n            tools/tinyllama_1p1b_chat_fixture.py \\\n            tools/run_tinyllama_massive_campaign.py\n',
                  "CI parity validation",
              )
              ci_path.write_text(ci, encoding="utf-8")
          PY

      - name: Run CPU contract validation
        run: |
          python3 tools/tokenizer_reference_identity.py --self-test
          python3 tools/validate_tinyllama_reference_artifact.py --self-test
          python3 tools/validate_nnml1_multi_model_parity_evidence.py --self-test
          python3 -m py_compile \
            tools/validate_nnml1_multi_model_parity_evidence.py \
            tools/run_tinyllama_massive_campaign.py

      - name: Format and compile SmolLM2 comparator
        run: |
          rustup component add rustfmt
          cargo fmt --all
          cargo check --locked -p nnis-model --example compare_smollm2_135m

      - name: Commit integration patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            tools/validate_nnml1_multi_model_parity_evidence.py \
            tools/run_tinyllama_massive_campaign.py \
            crates/nnis-model/examples/compare_smollm2_135m.rs
          git commit -m "feat(nnml1): integrate multi-model parity producers"
          git push origin HEAD:feat/nnml1-multi-model-parity-evidence-v1
