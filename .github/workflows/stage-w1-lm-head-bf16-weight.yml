name: Stage W1 LM-head BF16 weight candidate
on:
  push:
    branches: [perf/w1-lm-head-bf16-weight-candidate]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/w1-lm-head-bf16-weight-candidate
          fetch-depth: 0
      - name: Add mixed-representation candidate
        run: |
          cat > crates/nnis-kernels/src/mixed_weight_gemv.rs <<'RS'
          //! Batch-one projection with f32 activations and packed-bf16 weights.
          //!
          //! This is a representation experiment primitive, not a claim that the
          //! whole decoder is BF16. Each packed weight is widened exactly to f32,
          //! then accumulated with the same increasing-K explicit-FMA order as
          //! [`crate::F32Gemv::project_kn`]. The output remains f32.

          use nnis_jit::{
              CompileOptions, JitCompiler, Kernel, KernelArgs, KernelLaunch, LaunchConfig, Module,
          };
          use nnis_rt::{Context, DeviceBuffer, NnisError, Result, Stream};
          use std::sync::Arc;

          const SOURCE: &str = r#"
          __device__ __forceinline__ float nnis_bf16_bits_to_f32(unsigned short bits) {
              return __uint_as_float(((unsigned int)bits) << 16);
          }

          extern "C" __global__ void nnis_project_kn_f32_bf16_weight(
              const float* input,
              const unsigned short* weight,
              float* output,
              unsigned long long k,
              unsigned long long n
          ) {
              const unsigned long long col =
                  (unsigned long long)blockIdx.x * blockDim.x + threadIdx.x;
              if (col >= n) return;

              float value = 0.0f;
              for (unsigned long long row = 0; row < k; ++row) {
                  const float w = nnis_bf16_bits_to_f32(weight[row * n + col]);
                  value = fmaf(input[row], w, value);
              }
              output[col] = value;
          }
          "#;

          const DEFAULT_BLOCK_SIZE: u32 = 64;

          /// Context-bound `[1,K] × [K,N] -> [1,N]` projection using f32
          /// activations, packed-bf16 weights and f32 accumulation/output.
          #[derive(Debug)]
          pub struct F32Bf16Gemv {
              project_kn: Kernel,
              block_size: u32,
          }

          impl F32Bf16Gemv {
              pub fn load(context: &Arc<Context>, compiler: &JitCompiler) -> Result<Self> {
                  Self::load_with_block_size(context, compiler, DEFAULT_BLOCK_SIZE)
              }

              pub fn load_with_block_size(
                  context: &Arc<Context>,
                  compiler: &JitCompiler,
                  block_size: u32,
              ) -> Result<Self> {
                  if block_size == 0 || !block_size.is_power_of_two() {
                      return Err(NnisError::invalid_input(format!(
                          "f32-bf16 project block size {block_size} is not a non-zero power of two"
                      )));
                  }
                  let code = compiler.compile_cubin(SOURCE, &CompileOptions::for_device(context))?;
                  let module = Module::load(context, &code)?;
                  let project_kn = module.get_function("nnis_project_kn_f32_bf16_weight")?;
                  let attributes = project_kn.attributes()?;
                  if block_size > attributes.max_threads_per_block {
                      return Err(NnisError::invalid_input(format!(
                          "f32-bf16 project block size {block_size} exceeds function limit {}",
                          attributes.max_threads_per_block
                      )));
                  }
                  Ok(Self {
                      project_kn,
                      block_size,
                  })
              }

              pub fn block_size(&self) -> u32 {
                  self.block_size
              }

              pub fn project_kn(
                  &self,
                  stream: &Stream,
                  input: &DeviceBuffer<f32>,
                  weight: &DeviceBuffer<u16>,
                  output: &DeviceBuffer<f32>,
                  k: usize,
                  n: usize,
              ) -> Result<()> {
                  // SAFETY: all borrows remain live until synchronization below.
                  let enqueue_result =
                      unsafe { self.enqueue_project_kn(stream, input, weight, output, k, n) };
                  match enqueue_result {
                      Ok(()) => stream.synchronize(),
                      Err(error) => {
                          let _ = stream.synchronize();
                          Err(error)
                      }
                  }
              }

              /// Enqueue the mixed-representation projection without synchronizing.
              ///
              /// # Safety
              ///
              /// All buffers, the stream and this kernel must remain alive and
              /// otherwise untouched until the stream completes.
              pub unsafe fn enqueue_project_kn(
                  &self,
                  stream: &Stream,
                  input: &DeviceBuffer<f32>,
                  weight: &DeviceBuffer<u16>,
                  output: &DeviceBuffer<f32>,
                  k: usize,
                  n: usize,
              ) -> Result<()> {
                  self.validate_execution(stream, input, weight, output, k, n)?;
                  if n == 0 {
                      return Ok(());
                  }
                  if k == 0 {
                      // SAFETY: the output lifetime obligation is documented above.
                      return unsafe { output.zero_async(stream) };
                  }
                  let k_arg = u64::try_from(k)
                      .map_err(|_| NnisError::invalid_input("f32-bf16 project K exceeds u64::MAX"))?;
                  let n_arg = u64::try_from(n)
                      .map_err(|_| NnisError::invalid_input("f32-bf16 project N exceeds u64::MAX"))?;
                  let config = LaunchConfig::for_num_elements(n, self.block_size)?;
                  let mut arguments = KernelArgs::with_capacity(5, 3);
                  arguments
                      .push_buffer(input)
                      .push_buffer(weight)
                      .push_buffer(output)
                      .push(k_arg)
                      .push(n_arg);
                  let launch = KernelLaunch::new(&self.project_kn, stream, config);
                  // SAFETY: argument order/widths match the CUDA kernel; the caller
                  // owns the remaining asynchronous lifetime obligation.
                  unsafe { launch.launch(&mut arguments) }
              }

              fn validate_execution(
                  &self,
                  stream: &Stream,
                  input: &DeviceBuffer<f32>,
                  weight: &DeviceBuffer<u16>,
                  output: &DeviceBuffer<f32>,
                  k: usize,
                  n: usize,
              ) -> Result<()> {
                  let expected_weight = k.checked_mul(n).ok_or_else(|| {
                      NnisError::invalid_input("f32-bf16 project shape overflows usize")
                  })?;
                  if input.len() != k {
                      return Err(NnisError::invalid_input(format!(
                          "f32-bf16 project input has {} elements; shape requires {k}",
                          input.len()
                      )));
                  }
                  if weight.len() != expected_weight {
                      return Err(NnisError::invalid_input(format!(
                          "f32-bf16 project weight has {} elements; shape ({k}, {n}) requires {expected_weight}",
                          weight.len()
                      )));
                  }
                  if output.len() != n {
                      return Err(NnisError::invalid_input(format!(
                          "f32-bf16 project output has {} elements; shape requires {n}",
                          output.len()
                      )));
                  }
                  let context = self.project_kn.context();
                  if !Arc::ptr_eq(context, stream.ctx())
                      || !Arc::ptr_eq(context, input.ctx())
                      || !Arc::ptr_eq(context, weight.ctx())
                      || !Arc::ptr_eq(context, output.ctx())
                  {
                      return Err(NnisError::invalid_input(
                          "f32-bf16 project stream, buffers and kernel must share one context",
                      ));
                  }
                  Ok(())
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use crate::F32Gemv;
              use nnis_rt::gpu_context;

              fn exact_bf16_value(index: usize) -> f32 {
                  ((index * 17 % 41) as f32 - 20.0) * 0.125
              }

              #[test]
              fn mixed_project_matches_f32_project_for_exact_bf16_weights() {
                  let Some(context) = gpu_context() else {
                      eprintln!("skipped: no CUDA device");
                      return;
                  };
                  let k = 17usize;
                  let n = 23usize;
                  let input_host = (0..k)
                      .map(|index| ((index * 11 % 29) as f32 - 14.0) * 0.0625)
                      .collect::<Vec<_>>();
                  let weight_f32 = (0..k * n).map(exact_bf16_value).collect::<Vec<_>>();
                  let weight_bf16 = weight_f32
                      .iter()
                      .map(|value| {
                          let bits = value.to_bits();
                          assert_eq!(bits & 0xffff, 0);
                          (bits >> 16) as u16
                      })
                      .collect::<Vec<_>>();
                  let compiler = JitCompiler::new();
                  let reference = F32Gemv::load_with_block_size(&context, &compiler, 64).unwrap();
                  let candidate = F32Bf16Gemv::load_with_block_size(&context, &compiler, 64).unwrap();
                  let stream = Stream::new(&context).unwrap();
                  let input = DeviceBuffer::from_host(&context, &stream, &input_host).unwrap();
                  let f32_weight = DeviceBuffer::from_host(&context, &stream, &weight_f32).unwrap();
                  let bf16_weight = DeviceBuffer::from_host(&context, &stream, &weight_bf16).unwrap();
                  let f32_output = DeviceBuffer::<f32>::new(&context, n).unwrap();
                  let bf16_output = DeviceBuffer::<f32>::new(&context, n).unwrap();
                  reference
                      .project_kn(&stream, &input, &f32_weight, &f32_output, k, n)
                      .unwrap();
                  candidate
                      .project_kn(&stream, &input, &bf16_weight, &bf16_output, k, n)
                      .unwrap();
                  let expected = f32_output.to_vec(&stream).unwrap();
                  let actual = bf16_output.to_vec(&stream).unwrap();
                  assert_eq!(actual.len(), expected.len());
                  for (index, (&actual, &expected)) in actual.iter().zip(&expected).enumerate() {
                      assert_eq!(
                          actual.to_bits(),
                          expected.to_bits(),
                          "mismatch at output {index}: actual={actual}, expected={expected}"
                      );
                  }
              }
          }
          RS

          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/nnis-kernels/src/lib.rs')
          s = p.read_text()
          if 'mod mixed_weight_gemv;' not in s:
              s = s.replace('mod layernorm;\n', 'mod layernorm;\nmod mixed_weight_gemv;\n', 1)
          if 'pub use mixed_weight_gemv::F32Bf16Gemv;' not in s:
              s = s.replace('pub use layernorm::{F32LayerNorm, F32LayerNormWorkspace};\n', 'pub use layernorm::{F32LayerNorm, F32LayerNormWorkspace};\npub use mixed_weight_gemv::F32Bf16Gemv;\n', 1)
          p.write_text(s)
          PY

          cat > crates/nnis-bench/examples/smollm2_lm_head_weight_representation.rs <<'RS'
          use nnis_bench::{benchmark_gpu, BenchConfig, BenchmarkCase, BenchmarkReport};
          use nnis_jit::JitCompiler;
          use nnis_kernels::{F32Bf16Gemv, F32Gemv};
          use nnis_rt::{Context, Device, DeviceBuffer, NnisError, Result, Stream};
          use serde::{Deserialize, Serialize};
          use std::env;
          use std::fs;
          use std::path::{Component, Path, PathBuf};
          use std::sync::Arc;

          const SOURCE_REPO: &str = "HuggingFaceTB/SmolLM2-135M";
          const SOURCE_REVISION: &str = "93efa2f097d58c2a74874c7e644dbc9b0cee75a2";
          const SOURCE_MODEL_SHA256: &str =
              "80521b40281d6ce74e35c9282c22539e75aa0ac8578892b2a59955ef78d55da1";
          const HIDDEN: usize = 576;
          const VOCAB: usize = 49_152;
          const REFERENCE_BLOCK_SIZE: u32 = 64;

          #[derive(Debug)]
          struct Arguments {
              model_dir: PathBuf,
              device: i32,
              config: BenchConfig,
              candidate_block_size: u32,
          }

          #[derive(Debug, Deserialize)]
          struct Provenance {
              source_repo: String,
              source_revision: String,
              source_model_sha256: String,
              source_weight_dtype: String,
              execution_weight_dtype: String,
          }

          #[derive(Debug, Deserialize)]
          struct Manifest {
              tensors: Vec<TensorEntry>,
          }

          #[derive(Debug, Deserialize)]
          struct TensorEntry {
              name: String,
              dtype: String,
              shape: Vec<usize>,
              file: String,
          }

          #[derive(Debug, Serialize)]
          struct RepresentationReport {
              source_checkpoint_dtype: &'static str,
              baseline_device_dtype: &'static str,
              candidate_device_dtype: &'static str,
              lm_head_elements: usize,
              baseline_storage_bytes: usize,
              candidate_storage_bytes: usize,
              storage_bytes_saved: usize,
              candidate_over_baseline_storage_ratio: f64,
              exact_bf16_roundtrip_from_fixture_f32: bool,
              candidate_changes_representation: bool,
          }

          #[derive(Debug, Serialize)]
          struct BenchmarkConfigReport {
              reference_block_size: u32,
              candidate_block_size: u32,
              warmups: usize,
              iterations: usize,
          }

          #[derive(Debug, Serialize)]
          struct IsolatedReport {
              latency_speedup_reference_over_candidate: f64,
              latency_ms_saved_per_lm_head_projection: f64,
          }

          #[derive(Debug, Serialize)]
          struct Report {
              schema_version: u32,
              experiment: &'static str,
              source_repo: &'static str,
              source_revision: &'static str,
              source_model_sha256: &'static str,
              benchmark_config: BenchmarkConfigReport,
              representation: RepresentationReport,
              bitwise_equivalent_all_logits: bool,
              reference: BenchmarkReport,
              candidate: BenchmarkReport,
              isolated: IsolatedReport,
              limitations: Vec<&'static str>,
          }

          fn parse_env_usize(name: &str, default: usize) -> std::result::Result<usize, String> {
              match env::var(name) {
                  Ok(value) => value
                      .parse::<usize>()
                      .map_err(|error| format!("invalid {name}={value:?}: {error}")),
                  Err(env::VarError::NotPresent) => Ok(default),
                  Err(error) => Err(format!("failed reading {name}: {error}")),
              }
          }

          fn parse_env_u32(name: &str, default: u32) -> std::result::Result<u32, String> {
              match env::var(name) {
                  Ok(value) => value
                      .parse::<u32>()
                      .map_err(|error| format!("invalid {name}={value:?}: {error}")),
                  Err(env::VarError::NotPresent) => Ok(default),
                  Err(error) => Err(format!("failed reading {name}: {error}")),
              }
          }

          fn parse_arguments() -> std::result::Result<Arguments, String> {
              let mut args = env::args().skip(1);
              let mut model_dir = None;
              let mut device = 0_i32;
              while let Some(argument) = args.next() {
                  match argument.as_str() {
                      "--model" => {
                          model_dir = Some(PathBuf::from(
                              args.next().ok_or("--model requires a directory")?,
                          ));
                      }
                      "--device" => {
                          device = args
                              .next()
                              .ok_or("--device requires an ordinal")?
                              .parse::<i32>()
                              .map_err(|error| format!("invalid --device: {error}"))?;
                      }
                      "--help" | "-h" => {
                          return Err("usage: smollm2_lm_head_weight_representation --model DIR [--device N]".to_string());
                      }
                      other => return Err(format!("unknown argument {other:?}")),
                  }
              }
              if device < 0 {
                  return Err("--device must be non-negative".to_string());
              }
              let warmups = parse_env_usize("NNIS_PROFILE_WARMUPS", 20)?;
              let iterations = parse_env_usize("NNIS_PROFILE_ITERATIONS", 100)?;
              let candidate_block_size = parse_env_u32("NNIS_BF16_WEIGHT_BLOCK_SIZE", 64)?;
              Ok(Arguments {
                  model_dir: model_dir.ok_or("missing --model DIR")?,
                  device,
                  config: BenchConfig::new(warmups, iterations),
                  candidate_block_size,
              })
          }

          fn validate_provenance(model_dir: &Path) -> Result<()> {
              let bytes = fs::read(model_dir.join("provenance.json"))
                  .map_err(|error| NnisError::io("read SmolLM2 provenance", error))?;
              let provenance: Provenance = serde_json::from_slice(&bytes).map_err(|error| {
                  NnisError::invalid_input(format!("invalid SmolLM2 provenance JSON: {error}"))
              })?;
              if provenance.source_repo != SOURCE_REPO
                  || provenance.source_revision != SOURCE_REVISION
                  || provenance.source_model_sha256 != SOURCE_MODEL_SHA256
                  || provenance.source_weight_dtype != "bfloat16"
                  || provenance.execution_weight_dtype != "f32"
              {
                  return Err(NnisError::invalid_input(
                      "model provenance is not the pinned widened-f32 SmolLM2 fixture",
                  ));
              }
              Ok(())
          }

          fn resolve_relative(model_dir: &Path, file: &str) -> Result<PathBuf> {
              let relative = Path::new(file);
              if file.is_empty()
                  || relative.is_absolute()
                  || relative.components().any(|component| {
                      !matches!(component, Component::Normal(_) | Component::CurDir)
                  })
              {
                  return Err(NnisError::invalid_input(format!(
                      "LM-head tensor path {file:?} is not a safe relative path"
                  )));
              }
              Ok(model_dir.join(relative))
          }

          fn read_lm_head(model_dir: &Path) -> Result<(Vec<f32>, Vec<u16>)> {
              let manifest_bytes = fs::read(model_dir.join("model.json"))
                  .map_err(|error| NnisError::io("read SmolLM2 model manifest", error))?;
              let manifest: Manifest = serde_json::from_slice(&manifest_bytes).map_err(|error| {
                  NnisError::invalid_input(format!("invalid model manifest JSON: {error}"))
              })?;
              let entry = manifest
                  .tensors
                  .iter()
                  .find(|entry| entry.name == "lm_head")
                  .ok_or_else(|| NnisError::invalid_input("model manifest is missing lm_head"))?;
              if entry.dtype != "f32" || entry.shape != [HIDDEN, VOCAB] {
                  return Err(NnisError::invalid_input(format!(
                      "unexpected lm_head manifest contract: dtype={} shape={:?}",
                      entry.dtype, entry.shape
                  )));
              }
              let bytes = fs::read(resolve_relative(model_dir, &entry.file)?)
                  .map_err(|error| NnisError::io("read SmolLM2 lm_head", error))?;
              let elements = HIDDEN
                  .checked_mul(VOCAB)
                  .ok_or_else(|| NnisError::invalid_input("LM-head shape overflows usize"))?;
              let expected_bytes = elements
                  .checked_mul(4)
                  .ok_or_else(|| NnisError::invalid_input("LM-head byte size overflows usize"))?;
              if bytes.len() != expected_bytes {
                  return Err(NnisError::invalid_input(format!(
                      "LM-head file has {} bytes; expected {expected_bytes}",
                      bytes.len()
                  )));
              }
              let mut f32_values = Vec::with_capacity(elements);
              let mut bf16_bits = Vec::with_capacity(elements);
              for (index, chunk) in bytes.chunks_exact(4).enumerate() {
                  let bits = u32::from_le_bytes([chunk[0], chunk[1], chunk[2], chunk[3]]);
                  if bits & 0xffff != 0 {
                      return Err(NnisError::invalid_input(format!(
                          "fixture lm_head value {index} is not an exact widened BF16 value"
                      )));
                  }
                  f32_values.push(f32::from_bits(bits));
                  bf16_bits.push((bits >> 16) as u16);
              }
              Ok((f32_values, bf16_bits))
          }

          fn deterministic_input() -> Vec<f32> {
              (0..HIDDEN)
                  .map(|index| ((index * 37 % 127) as f32 - 63.0) * 0.015625)
                  .collect()
          }

          fn run(arguments: Arguments) -> Result<Report> {
              arguments.config.validate()?;
              validate_provenance(&arguments.model_dir)?;
              let (weight_f32_host, weight_bf16_host) = read_lm_head(&arguments.model_dir)?;
              let input_host = deterministic_input();
              let device = Device::get(arguments.device)?;
              let context = Context::new(&device)?;
              let context = Arc::new(context);
              let stream = Stream::new(&context)?;
              let compiler = JitCompiler::new();
              let reference_kernel =
                  F32Gemv::load_with_block_size(&context, &compiler, REFERENCE_BLOCK_SIZE)?;
              let candidate_kernel = F32Bf16Gemv::load_with_block_size(
                  &context,
                  &compiler,
                  arguments.candidate_block_size,
              )?;
              let input = DeviceBuffer::from_host(&context, &stream, &input_host)?;
              let weight_f32 = DeviceBuffer::from_host(&context, &stream, &weight_f32_host)?;
              let weight_bf16 = DeviceBuffer::from_host(&context, &stream, &weight_bf16_host)?;
              let reference_output = DeviceBuffer::<f32>::new(&context, VOCAB)?;
              let candidate_output = DeviceBuffer::<f32>::new(&context, VOCAB)?;

              reference_kernel.project_kn(
                  &stream,
                  &input,
                  &weight_f32,
                  &reference_output,
                  HIDDEN,
                  VOCAB,
              )?;
              candidate_kernel.project_kn(
                  &stream,
                  &input,
                  &weight_bf16,
                  &candidate_output,
                  HIDDEN,
                  VOCAB,
              )?;
              let reference_host = reference_output.to_vec(&stream)?;
              let candidate_host = candidate_output.to_vec(&stream)?;
              for (index, (&candidate, &reference)) in
                  candidate_host.iter().zip(&reference_host).enumerate()
              {
                  if candidate.to_bits() != reference.to_bits() {
                      return Err(NnisError::invalid_input(format!(
                          "W1 bitwise gate failed at logit {index}: candidate={candidate} reference={reference}"
                      )));
                  }
              }

              let reference = benchmark_gpu(
                  &context,
                  &stream,
                  BenchmarkCase::new("smollm2_lm_head_f32_gemv64", "f32"),
                  arguments.config,
                  || {
                      // SAFETY: benchmark_gpu synchronizes each measured launch and
                      // all captured buffers outlive the benchmark.
                      unsafe {
                          reference_kernel.enqueue_project_kn(
                              &stream,
                              &input,
                              &weight_f32,
                              &reference_output,
                              HIDDEN,
                              VOCAB,
                          )
                      }
                  },
              )?;
              let candidate = benchmark_gpu(
                  &context,
                  &stream,
                  BenchmarkCase::new("smollm2_lm_head_f32_activation_bf16_weight", "f32xbf16->f32"),
                  arguments.config,
                  || {
                      // SAFETY: benchmark_gpu synchronizes each measured launch and
                      // all captured buffers outlive the benchmark.
                      unsafe {
                          candidate_kernel.enqueue_project_kn(
                              &stream,
                              &input,
                              &weight_bf16,
                              &candidate_output,
                              HIDDEN,
                              VOCAB,
                          )
                      }
                  },
              )?;

              let reference_after = reference_output.to_vec(&stream)?;
              let candidate_after = candidate_output.to_vec(&stream)?;
              for (index, (&candidate, &reference)) in
                  candidate_after.iter().zip(&reference_after).enumerate()
              {
                  if candidate.to_bits() != reference.to_bits() {
                      return Err(NnisError::invalid_input(format!(
                          "W1 post-timing bitwise gate failed at logit {index}"
                      )));
                  }
              }

              let reference_ms = reference.statistics.median_ms;
              let candidate_ms = candidate.statistics.median_ms;
              let elements = HIDDEN * VOCAB;
              let baseline_storage_bytes = elements * std::mem::size_of::<f32>();
              let candidate_storage_bytes = elements * std::mem::size_of::<u16>();
              Ok(Report {
                  schema_version: 1,
                  experiment: "W1-smollm2-lm-head-f32-vs-bf16-weight-representation",
                  source_repo: SOURCE_REPO,
                  source_revision: SOURCE_REVISION,
                  source_model_sha256: SOURCE_MODEL_SHA256,
                  benchmark_config: BenchmarkConfigReport {
                      reference_block_size: REFERENCE_BLOCK_SIZE,
                      candidate_block_size: arguments.candidate_block_size,
                      warmups: arguments.config.warmup_iterations,
                      iterations: arguments.config.iterations,
                  },
                  representation: RepresentationReport {
                      source_checkpoint_dtype: "bfloat16",
                      baseline_device_dtype: "f32",
                      candidate_device_dtype: "bfloat16",
                      lm_head_elements: elements,
                      baseline_storage_bytes,
                      candidate_storage_bytes,
                      storage_bytes_saved: baseline_storage_bytes - candidate_storage_bytes,
                      candidate_over_baseline_storage_ratio: candidate_storage_bytes as f64
                          / baseline_storage_bytes as f64,
                      exact_bf16_roundtrip_from_fixture_f32: true,
                      candidate_changes_representation: true,
                  },
                  bitwise_equivalent_all_logits: true,
                  isolated: IsolatedReport {
                      latency_speedup_reference_over_candidate: reference_ms / candidate_ms,
                      latency_ms_saved_per_lm_head_projection: reference_ms - candidate_ms,
                  },
                  reference,
                  candidate,
                  limitations: vec![
                      "candidate-only: nnis-model runtime and model format remain unchanged",
                      "CUDA-event timings exclude host launch/submission overhead",
                      "only the tied LM-head copy is represented as BF16 in this experiment",
                      "end-to-end promotion requires a separate fingerprint-compatible AB/ABBA gate",
                  ],
              })
          }

          fn main() {
              let arguments = match parse_arguments() {
                  Ok(arguments) => arguments,
                  Err(error) => {
                      eprintln!("{error}");
                      std::process::exit(2);
                  }
              };
              match run(arguments) {
                  Ok(report) => match serde_json::to_string_pretty(&report) {
                      Ok(json) => println!("{json}"),
                      Err(error) => {
                          eprintln!("failed to serialize W1 report: {error}");
                          std::process::exit(1);
                      }
                  },
                  Err(error) => {
                      eprintln!("W1 LM-head representation benchmark failed: {error}");
                      std::process::exit(1);
                  }
              }
          }
          RS
      - name: Validate W1 candidate
        run: |
          cargo fmt --all
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p nnis-kernels --lib
          cargo check --locked -p nnis-bench --example smollm2_lm_head_weight_representation
      - name: Commit product changes only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/stage-w1-lm-head-bf16-weight.yml
          git add crates/nnis-kernels/src/mixed_weight_gemv.rs crates/nnis-kernels/src/lib.rs crates/nnis-bench/examples/smollm2_lm_head_weight_representation.rs
          git commit -m "experiment(weights): add LM-head BF16 representation candidate"
          git push origin HEAD:perf/w1-lm-head-bf16-weight-candidate
