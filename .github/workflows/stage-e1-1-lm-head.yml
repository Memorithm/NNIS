name: Stage E1.1 LM-head-only plan
on:
  push:
    branches: [perf/e1-1-lm-head-only]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/e1-1-lm-head-only
          fetch-depth: 0
      - name: Narrow E1 plan to LM-head only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/nnis-model/src/projection_plan.rs')
          s = p.read_text()
          s = s.replace(
              'pub const fn thor_e1_smollm2() -> Self {\n        Self {\n            q_o: F32ProjectionKernel::Gemv { block_size: 512 },\n            k_v: F32ProjectionKernel::Gemm,\n            gate_up: F32ProjectionKernel::Gemv { block_size: 128 },\n            down: F32ProjectionKernel::Gemm,\n            lm_head: F32ProjectionKernel::Gemv { block_size: 64 },\n        }\n    }',
              'pub const fn thor_e1_1_smollm2_lm_head() -> Self {\n        Self {\n            q_o: F32ProjectionKernel::Gemm,\n            k_v: F32ProjectionKernel::Gemm,\n            gate_up: F32ProjectionKernel::Gemm,\n            down: F32ProjectionKernel::Gemm,\n            lm_head: F32ProjectionKernel::Gemv { block_size: 64 },\n        }\n    }',
              1,
          )
          s = s.replace(
              '/// E1 plan selected from the physical Thor MAXN candidate sweep.\n    ///\n    /// This is evidence-scoped to the qualified SmolLM2 f32 experiment and is\n    /// not claimed to be universally optimal on Thor or other models.',
              '/// E1.1 plan: only the LM-head uses the physically qualified GEMV64 candidate.\n    ///\n    /// This narrows the rejected E1 hybrid plan to the single projection family\n    /// with the strongest isolated speedup while keeping all layer projections\n    /// on the historical GEMM path. It remains evidence-scoped to SmolLM2 f32\n    /// on Thor and is not claimed to be universally optimal.',
              1,
          )
          s = s.replace(
              'fn thor_e1_plan_matches_physical_sweep_promotion() {\n        let plan = F32ProjectionPlan::thor_e1_smollm2();\n        assert_eq!(plan.q_o, F32ProjectionKernel::Gemv { block_size: 512 });\n        assert_eq!(plan.k_v, F32ProjectionKernel::Gemm);\n        assert_eq!(plan.gate_up, F32ProjectionKernel::Gemv { block_size: 128 });\n        assert_eq!(plan.down, F32ProjectionKernel::Gemm);\n        assert_eq!(plan.lm_head, F32ProjectionKernel::Gemv { block_size: 64 });\n        plan.validate().unwrap();\n    }',
              'fn thor_e1_1_plan_changes_only_lm_head() {\n        let plan = F32ProjectionPlan::thor_e1_1_smollm2_lm_head();\n        assert_eq!(plan.q_o, F32ProjectionKernel::Gemm);\n        assert_eq!(plan.k_v, F32ProjectionKernel::Gemm);\n        assert_eq!(plan.gate_up, F32ProjectionKernel::Gemm);\n        assert_eq!(plan.down, F32ProjectionKernel::Gemm);\n        assert_eq!(plan.lm_head, F32ProjectionKernel::Gemv { block_size: 64 });\n        plan.validate().unwrap();\n    }',
              1,
          )
          if 'thor_e1_smollm2' in s:
              raise SystemExit('old E1 plan symbol still present')
          p.write_text(s)

          p = Path('crates/nnis-bench/examples/smollm2_e2e.rs')
          s = p.read_text()
          s = s.replace(
              '.ok_or("--projection-plan requires baseline-gemm or thor-e1-smollm2")?',
              '.ok_or("--projection-plan requires baseline-gemm or thor-e1-1-lm-head")?',
          )
          s = s.replace(
              '"thor-e1-smollm2" => F32ProjectionPlan::thor_e1_smollm2(),',
              '"thor-e1-1-lm-head" => F32ProjectionPlan::thor_e1_1_smollm2_lm_head(),',
          )
          s = s.replace(
              '[--projection-plan baseline-gemm|thor-e1-smollm2]',
              '[--projection-plan baseline-gemm|thor-e1-1-lm-head]',
          )
          if 'thor-e1-smollm2' in s or 'thor_e1_smollm2' in s:
              raise SystemExit('old E1 CLI/symbol still present')
          p.write_text(s)
          PY
      - name: Validate E1.1
        run: |
          cargo fmt --all
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p nnis-model --lib
          cargo check --locked -p nnis-bench --example smollm2_e2e
      - name: Commit clean E1.1 source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/stage-e1-1-lm-head.yml
          git add crates/nnis-model/src/projection_plan.rs crates/nnis-bench/examples/smollm2_e2e.rs
          git commit -m "perf(model): stage E1.1 LM-head-only projection plan"
          git push origin HEAD:perf/e1-1-lm-head-only
