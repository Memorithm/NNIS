name: Stage benchmark environment fingerprint
on:
  push:
    branches: [bench/environment-fingerprint-v1]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench/environment-fingerprint-v1
          fetch-depth: 0
      - name: Apply product patch
        run: python3 tools/stage_environment_fingerprint.py
      - name: Validate fingerprint and comparator
        run: |
          cargo fmt --all
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p nnis-bench --lib
          cargo check --locked -p nnis-bench --example compare_smollm2_reports
      - name: Commit product changes only
        run: |
          git rm .github/workflows/stage-environment-fingerprint.yml tools/stage_environment_fingerprint.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/nnis-bench/src/lib.rs crates/nnis-bench/examples/compare_smollm2_reports.rs
          git commit -m "bench: add fail-closed environment fingerprints"
          git push origin HEAD:bench/environment-fingerprint-v1
