name: Stage E1 hybrid projection plan
on:
  push:
    branches: [perf/e1-hybrid-projection-plan]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/e1-hybrid-projection-plan
          fetch-depth: 0
      - name: Add explicit projection plan and opt-in runtime dispatch
        run: |
          cat > crates/nnis-model/src/projection_plan.rs <<'RS'
          use nnis_rt::{NnisError, Result};
          use serde::{Deserialize, Serialize};

          /// Physical kernel selected for one f32 `[1,K] × [K,N]` projection family.
          ///
          /// This describes execution only. It does not change logical model weights or
          /// their f32 representation; representation elasticity is a separate plan axis.
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(tag = "kernel", rename_all = "snake_case")]
          pub enum F32ProjectionKernel {
              Gemm,
              Gemv { block_size: u32 },
          }

          impl F32ProjectionKernel {
              pub fn validate(self) -> Result<()> {
                  if let Self::Gemv { block_size } = self {
                      if block_size == 0 || !block_size.is_power_of_two() {
                          return Err(NnisError::invalid_input(format!(
                              "projection GEMV block size {block_size} is not a non-zero power of two"
                          )));
                      }
                  }
                  Ok(())
              }
          }

          /// Per-shape f32 decoder projection plan.
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
          pub struct F32ProjectionPlan {
              pub q_o: F32ProjectionKernel,
              pub k_v: F32ProjectionKernel,
              pub gate_up: F32ProjectionKernel,
              pub down: F32ProjectionKernel,
              pub lm_head: F32ProjectionKernel,
          }

          impl F32ProjectionPlan {
              /// Historical NNIS behavior: every projection uses the general f32 GEMM.
              #[must_use]
              pub const fn baseline_gemm() -> Self {
                  Self {
                      q_o: F32ProjectionKernel::Gemm,
                      k_v: F32ProjectionKernel::Gemm,
                      gate_up: F32ProjectionKernel::Gemm,
                      down: F32ProjectionKernel::Gemm,
                      lm_head: F32ProjectionKernel::Gemm,
                  }
              }

              /// E1 plan selected from the physical Thor MAXN candidate sweep.
              ///
              /// This is evidence-scoped to the qualified SmolLM2 f32 experiment and is
              /// not claimed to be universally optimal on Thor or other models.
              #[must_use]
              pub const fn thor_e1_smollm2() -> Self {
                  Self {
                      q_o: F32ProjectionKernel::Gemv { block_size: 512 },
                      k_v: F32ProjectionKernel::Gemm,
                      gate_up: F32ProjectionKernel::Gemv { block_size: 128 },
                      down: F32ProjectionKernel::Gemm,
                      lm_head: F32ProjectionKernel::Gemv { block_size: 64 },
                  }
              }

              pub fn validate(self) -> Result<()> {
                  for choice in [self.q_o, self.k_v, self.gate_up, self.down, self.lm_head] {
                      choice.validate()?;
                  }
                  Ok(())
              }
          }

          impl Default for F32ProjectionPlan {
              fn default() -> Self {
                  Self::baseline_gemm()
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn baseline_preserves_all_gemm_execution() {
                  let plan = F32ProjectionPlan::baseline_gemm();
                  assert_eq!(plan.q_o, F32ProjectionKernel::Gemm);
                  assert_eq!(plan.k_v, F32ProjectionKernel::Gemm);
                  assert_eq!(plan.gate_up, F32ProjectionKernel::Gemm);
                  assert_eq!(plan.down, F32ProjectionKernel::Gemm);
                  assert_eq!(plan.lm_head, F32ProjectionKernel::Gemm);
                  plan.validate().unwrap();
              }

              #[test]
              fn thor_e1_plan_matches_physical_sweep_promotion() {
                  let plan = F32ProjectionPlan::thor_e1_smollm2();
                  assert_eq!(plan.q_o, F32ProjectionKernel::Gemv { block_size: 512 });
                  assert_eq!(plan.k_v, F32ProjectionKernel::Gemm);
                  assert_eq!(plan.gate_up, F32ProjectionKernel::Gemv { block_size: 128 });
                  assert_eq!(plan.down, F32ProjectionKernel::Gemm);
                  assert_eq!(plan.lm_head, F32ProjectionKernel::Gemv { block_size: 64 });
                  plan.validate().unwrap();
              }

              #[test]
              fn invalid_gemv_width_is_fail_closed() {
                  assert!(F32ProjectionKernel::Gemv { block_size: 192 }
                      .validate()
                      .is_err());
              }
          }
          RS

          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/nnis-model/src/lib.rs')
          s = lib.read_text()
          if 'mod projection_plan;' not in s:
              s = s.replace('mod kernels;\n', 'mod kernels;\nmod projection_plan;\n', 1)
          if 'pub use projection_plan::' not in s:
              s = s.replace(
                  'pub use kernels::F32DecoderKernels;\n',
                  'pub use kernels::F32DecoderKernels;\npub use projection_plan::{F32ProjectionKernel, F32ProjectionPlan};\n',
                  1,
              )
          lib.write_text(s)

          p = Path('crates/nnis-model/src/runtime.rs')
          s = p.read_text()
          s = s.replace(
              '    load_model_directory, F32DecoderKernels, F32RuntimeKernels, GenerationConfig, ModelConfig,\n    ModelWeights, WeightDType,\n',
              '    load_model_directory, F32DecoderKernels, F32ProjectionKernel, F32ProjectionPlan,\n    F32RuntimeKernels, GenerationConfig, ModelConfig, ModelWeights, WeightDType,\n',
              1,
          )
          s = s.replace(
              'use nnis_kernels::{F32Elementwise, F32Gather, F32Gemm, F32TopK, F32TopKWorkspace};',
              'use nnis_kernels::{F32Elementwise, F32Gather, F32Gemm, F32Gemv, F32TopK, F32TopKWorkspace};',
              1,
          )
          if 'use std::collections::BTreeMap;' not in s:
              s = s.replace('use std::path::Path;\n', 'use std::collections::BTreeMap;\nuse std::path::Path;\n', 1)

          model_marker = '''/// Compiled, immutable decoder model. Sessions own all mutable execution state.\n#[derive(Debug)]\npub struct Model {'''
          helper = '''#[derive(Debug, Clone, Copy)]
          enum ProjectionFamily {
              QO,
              KV,
              GateUp,
              Down,
              LmHead,
          }

          #[derive(Debug)]
          struct ProjectionKernels {
              gemv_by_block_size: BTreeMap<u32, F32Gemv>,
          }

          impl ProjectionKernels {
              fn load(
                  context: &Arc<Context>,
                  compiler: &JitCompiler,
                  plan: F32ProjectionPlan,
              ) -> Result<Self> {
                  plan.validate()?;
                  let mut gemv_by_block_size = BTreeMap::new();
                  for choice in [plan.q_o, plan.k_v, plan.gate_up, plan.down, plan.lm_head] {
                      if let F32ProjectionKernel::Gemv { block_size } = choice {
                          if !gemv_by_block_size.contains_key(&block_size) {
                              let kernel = F32Gemv::load_with_block_size(context, compiler, block_size)?;
                              gemv_by_block_size.insert(block_size, kernel);
                          }
                      }
                  }
                  Ok(Self { gemv_by_block_size })
              }

              fn gemv(&self, block_size: u32) -> Result<&F32Gemv> {
                  self.gemv_by_block_size.get(&block_size).ok_or_else(|| {
                      NnisError::unsupported(format!(
                          "projection plan selected unavailable GEMV block size {block_size}"
                      ))
                  })
              }
          }

          ''' + model_marker
          if 'enum ProjectionFamily' not in s:
              if model_marker not in s:
                  raise SystemExit('model marker missing')
              s = s.replace(model_marker, helper, 1)

          s = s.replace(
              '    gemm: F32Gemm,\n    elementwise: F32Elementwise,',
              '    gemm: F32Gemm,\n    projection_plan: F32ProjectionPlan,\n    projection_kernels: ProjectionKernels,\n    elementwise: F32Elementwise,',
              1,
          )

          old_new = '''    pub fn new(config: ModelConfig, weights: ModelWeights, stream: &Stream) -> Result<Self> {
                  config.validate_execution_support()?;'''
          new_new = '''    pub fn new(config: ModelConfig, weights: ModelWeights, stream: &Stream) -> Result<Self> {
                  Self::new_with_projection_plan(config, weights, stream, F32ProjectionPlan::baseline_gemm())
              }

              pub fn new_with_projection_plan(
                  config: ModelConfig,
                  weights: ModelWeights,
                  stream: &Stream,
                  projection_plan: F32ProjectionPlan,
              ) -> Result<Self> {
                  projection_plan.validate()?;
                  config.validate_execution_support()?;'''
          if 'pub fn new_with_projection_plan' not in s:
              if old_new not in s:
                  raise SystemExit('constructor marker missing')
              s = s.replace(old_new, new_new, 1)

          s = s.replace(
              '        let gemm = F32Gemm::load(&context, &compiler)?;\n        let elementwise = F32Elementwise::load(&context, &compiler)?;',
              '        let gemm = F32Gemm::load(&context, &compiler)?;\n        let projection_kernels = ProjectionKernels::load(&context, &compiler, projection_plan)?;\n        let elementwise = F32Elementwise::load(&context, &compiler)?;',
              1,
          )
          s = s.replace(
              '            gather,\n            gemm,\n            elementwise,',
              '            gather,\n            gemm,\n            projection_plan,\n            projection_kernels,\n            elementwise,',
              1,
          )

          old_load = '''    pub fn load_directory(
                  context: &Arc<Context>,
                  stream: &Stream,
                  directory: impl AsRef<Path>,
              ) -> Result<Self> {
                  let (config, weights) = load_model_directory(context, stream, directory)?;
                  Self::new(config, weights, stream)
              }

              pub fn config(&self) -> &ModelConfig {
                  &self.config
              }
          '''
          new_load = '''    pub fn load_directory(
                  context: &Arc<Context>,
                  stream: &Stream,
                  directory: impl AsRef<Path>,
              ) -> Result<Self> {
                  let (config, weights) = load_model_directory(context, stream, directory)?;
                  Self::new(config, weights, stream)
              }

              pub fn load_directory_with_projection_plan(
                  context: &Arc<Context>,
                  stream: &Stream,
                  directory: impl AsRef<Path>,
                  projection_plan: F32ProjectionPlan,
              ) -> Result<Self> {
                  let (config, weights) = load_model_directory(context, stream, directory)?;
                  Self::new_with_projection_plan(config, weights, stream, projection_plan)
              }

              pub fn config(&self) -> &ModelConfig {
                  &self.config
              }

              #[must_use]
              pub const fn projection_plan(&self) -> F32ProjectionPlan {
                  self.projection_plan
              }

              fn projection_choice(&self, family: ProjectionFamily) -> F32ProjectionKernel {
                  match family {
                      ProjectionFamily::QO => self.projection_plan.q_o,
                      ProjectionFamily::KV => self.projection_plan.k_v,
                      ProjectionFamily::GateUp => self.projection_plan.gate_up,
                      ProjectionFamily::Down => self.projection_plan.down,
                      ProjectionFamily::LmHead => self.projection_plan.lm_head,
                  }
              }

              #[allow(clippy::too_many_arguments)]
              unsafe fn enqueue_projection(
                  &self,
                  stream: &Stream,
                  family: ProjectionFamily,
                  input: &DeviceBuffer<f32>,
                  weight: &DeviceBuffer<f32>,
                  output: &DeviceBuffer<f32>,
                  k: usize,
                  n: usize,
              ) -> Result<()> {
                  match self.projection_choice(family) {
                      F32ProjectionKernel::Gemm => {
                          // SAFETY: forwarded from the caller with the same buffer lifetime contract.
                          unsafe { self.gemm.enqueue_gemm(stream, input, weight, output, 1, n, k) }
                      }
                      F32ProjectionKernel::Gemv { block_size } => {
                          let gemv = self.projection_kernels.gemv(block_size)?;
                          // SAFETY: forwarded from the caller with the same buffer lifetime contract.
                          unsafe { gemv.enqueue_project_kn(stream, input, weight, output, k, n) }
                      }
                  }
              }
          '''
          if 'load_directory_with_projection_plan' not in s:
              if old_load not in s:
                  raise SystemExit('load/getter marker missing')
              s = s.replace(old_load, new_load, 1)

          replacements = [
              ('''                self.model.gemm.enqueue_gemm(
                              &self.stream,
                              &self.workspace.normed,
                              layer.q_proj.tensor().as_f32()?,
                              &self.workspace.q,
                              1,
                              config.hidden_size,
                              config.hidden_size,
                          )?;''',
               '''                self.model.enqueue_projection(
                              &self.stream,
                              ProjectionFamily::QO,
                              &self.workspace.normed,
                              layer.q_proj.tensor().as_f32()?,
                              &self.workspace.q,
                              config.hidden_size,
                              config.hidden_size,
                          )?;'''),
              ('''                self.model.gemm.enqueue_gemm(
                              &self.stream,
                              &self.workspace.normed,
                              layer.k_proj.tensor().as_f32()?,
                              &self.workspace.k,
                              1,
                              kv_width,
                              config.hidden_size,
                          )?;''',
               '''                self.model.enqueue_projection(
                              &self.stream,
                              ProjectionFamily::KV,
                              &self.workspace.normed,
                              layer.k_proj.tensor().as_f32()?,
                              &self.workspace.k,
                              config.hidden_size,
                              kv_width,
                          )?;'''),
              ('''                self.model.gemm.enqueue_gemm(
                              &self.stream,
                              &self.workspace.normed,
                              layer.v_proj.tensor().as_f32()?,
                              &self.workspace.v,
                              1,
                              kv_width,
                              config.hidden_size,
                          )?;''',
               '''                self.model.enqueue_projection(
                              &self.stream,
                              ProjectionFamily::KV,
                              &self.workspace.normed,
                              layer.v_proj.tensor().as_f32()?,
                              &self.workspace.v,
                              config.hidden_size,
                              kv_width,
                          )?;'''),
              ('''                self.model.gemm.enqueue_gemm(
                              &self.stream,
                              &self.workspace.attention,
                              layer.o_proj.tensor().as_f32()?,
                              &self.workspace.projected,
                              1,
                              config.hidden_size,
                              config.hidden_size,
                          )?;''',
               '''                self.model.enqueue_projection(
                              &self.stream,
                              ProjectionFamily::QO,
                              &self.workspace.attention,
                              layer.o_proj.tensor().as_f32()?,
                              &self.workspace.projected,
                              config.hidden_size,
                              config.hidden_size,
                          )?;'''),
              ('''                self.model.gemm.enqueue_gemm(
                              &self.stream,
                              &self.workspace.normed,
                              layer.gate_proj.tensor().as_f32()?,
                              &self.workspace.gate,
                              1,
                              config.intermediate_size,
                              config.hidden_size,
                          )?;''',
               '''                self.model.enqueue_projection(
                              &self.stream,
                              ProjectionFamily::GateUp,
                              &self.workspace.normed,
                              layer.gate_proj.tensor().as_f32()?,
                              &self.workspace.gate,
                              config.hidden_size,
                              config.intermediate_size,
                          )?;'''),
              ('''                self.model.gemm.enqueue_gemm(
                              &self.stream,
                              &self.workspace.normed,
                              layer.up_proj.tensor().as_f32()?,
                              &self.workspace.up,
                              1,
                              config.intermediate_size,
                              config.hidden_size,
                          )?;''',
               '''                self.model.enqueue_projection(
                              &self.stream,
                              ProjectionFamily::GateUp,
                              &self.workspace.normed,
                              layer.up_proj.tensor().as_f32()?,
                              &self.workspace.up,
                              config.hidden_size,
                              config.intermediate_size,
                          )?;'''),
              ('''                self.model.gemm.enqueue_gemm(
                              &self.stream,
                              &self.workspace.gated,
                              layer.down_proj.tensor().as_f32()?,
                              &self.workspace.mlp,
                              1,
                              config.hidden_size,
                              config.intermediate_size,
                          )?;''',
               '''                self.model.enqueue_projection(
                              &self.stream,
                              ProjectionFamily::Down,
                              &self.workspace.gated,
                              layer.down_proj.tensor().as_f32()?,
                              &self.workspace.mlp,
                              config.intermediate_size,
                              config.hidden_size,
                          )?;'''),
              ('''            self.model.gemm.enqueue_gemm(
                          &self.stream,
                          &self.workspace.normed,
                          self.model.weights.lm_head.tensor().as_f32()?,
                          &self.workspace.logits,
                          1,
                          config.vocab_size,
                          config.hidden_size,
                      )?;''',
               '''            self.model.enqueue_projection(
                          &self.stream,
                          ProjectionFamily::LmHead,
                          &self.workspace.normed,
                          self.model.weights.lm_head.tensor().as_f32()?,
                          &self.workspace.logits,
                          config.hidden_size,
                          config.vocab_size,
                      )?;'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('projection replacement marker missing:\n' + old[:120])
              s = s.replace(old, new, 1)

          p.write_text(s)

          b = Path('crates/nnis-bench/examples/smollm2_e2e.rs')
          s = b.read_text()
          s = s.replace(
              'use nnis_model::{GenerationConfig, Model};',
              'use nnis_model::{F32ProjectionPlan, GenerationConfig, Model};',
              1,
          )
          s = s.replace(
              '    config: BenchConfig,\n}',
              '    config: BenchConfig,\n    projection_plan: F32ProjectionPlan,\n}',
              1,
          )
          s = s.replace(
              '    qualified_greedy_prefix_checked: bool,\n}',
              '    qualified_greedy_prefix_checked: bool,\n    projection_plan: F32ProjectionPlan,\n}',
              1,
          )
          s = s.replace(
              '    let mut iterations = 5_usize;\n',
              '    let mut iterations = 5_usize;\n    let mut projection_plan = F32ProjectionPlan::baseline_gemm();\n',
              1,
          )
          parse_marker = '''            "--iterations" => {
                          iterations = parse_usize(
                              "--iterations",
                              args.next().ok_or("--iterations requires a value")?,
                          )?;
                      }
          '''
          parse_replacement = parse_marker + '''            "--projection-plan" => {
                          projection_plan = match args
                              .next()
                              .ok_or("--projection-plan requires baseline-gemm or thor-e1-smollm2")?
                              .as_str()
                          {
                              "baseline-gemm" => F32ProjectionPlan::baseline_gemm(),
                              "thor-e1-smollm2" => F32ProjectionPlan::thor_e1_smollm2(),
                              other => return Err(format!("unknown --projection-plan {other:?}")),
                          };
                      }
          '''
          if '"--projection-plan" =>' not in s:
              if parse_marker not in s:
                  raise SystemExit('benchmark parse marker missing')
              s = s.replace(parse_marker, parse_replacement, 1)
          s = s.replace(
              'usage: smollm2_e2e --model DIR [--device N] [--input-ids CSV] [--decode-steps N] [--warmups N] [--iterations N]',
              'usage: smollm2_e2e --model DIR [--device N] [--input-ids CSV] [--decode-steps N] [--warmups N] [--iterations N] [--projection-plan baseline-gemm|thor-e1-smollm2]',
              1,
          )
          s = s.replace(
              '        config: BenchConfig::new(warmups, iterations),\n    })',
              '        config: BenchConfig::new(warmups, iterations),\n        projection_plan,\n    })',
              1,
          )
          s = s.replace(
              '    let model = Model::load_directory(&context, &construction_stream, &arguments.model_dir)?;',
              '    let model = Model::load_directory_with_projection_plan(\n        &context,\n        &construction_stream,\n        &arguments.model_dir,\n        arguments.projection_plan,\n    )?;',
              1,
          )
          s = s.replace(
              '        qualified_greedy_prefix_checked,\n    })',
              '        qualified_greedy_prefix_checked,\n        projection_plan: model.projection_plan(),\n    })',
              1,
          )
          b.write_text(s)
          PY
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p nnis-model --lib
          cargo test --locked -p nnis-kernels --lib
          cargo check --locked -p nnis-bench --example smollm2_e2e
      - name: Commit E1 plan
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/nnis-model/src/projection_plan.rs crates/nnis-model/src/lib.rs crates/nnis-model/src/runtime.rs crates/nnis-bench/examples/smollm2_e2e.rs
          if git diff --cached --quiet; then
            echo "No E1 plan changes"
            exit 0
          fi
          git commit -m "perf(model): add opt-in E1 hybrid projection plan"
          git push origin HEAD:perf/e1-hybrid-projection-plan
