name: Temporary KVLab F32 loader repair
on:
  push:
    branches: [fix/kvlab-explicit-f32-materialization]
permissions:
  contents: write
concurrency:
  group: kvlab-f32-loader-repair
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Apply previously reviewed source patch
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          workflow = subprocess.check_output(['git','show','86c8367a9b6d27ae928cfaeeb4be3d6c8573ed55:.github/workflows/tmp-kvlab-f32-loader.yml'], text=True)
          script = workflow.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY\n',1)[0]
          exec(compile(textwrap.dedent(script), '<reviewed-f32-loader-patch>', 'exec'))
          PY
      - name: Reconcile workspace lockfile without upgrading registry dependencies
        run: |
          cargo +stable check -p nnis-model --lib
          python3 - <<'PY'
          import subprocess, tomllib
          from pathlib import Path
          before = tomllib.loads(subprocess.check_output(['git','show','HEAD:Cargo.lock'], text=True))
          after = tomllib.loads(Path('Cargo.lock').read_text())
          def registry(lock):
              return {(p['name'],p['version'],p['source']):p.get('checksum') for p in lock['package'] if 'source' in p}
          assert registry(before) == registry(after), 'registry dependency identities changed unexpectedly'
          print(subprocess.check_output(['git','diff','--','Cargo.lock'], text=True))
          PY
      - name: Format and locked validation
        run: |
          cargo +stable fmt --all
          cargo +stable clippy --locked -p nnis-model -p nnis-cli --all-targets -- -D warnings
          cargo +stable test --locked -p nnis-model --lib
          cargo +stable test --locked -p nnis-cli --bin nnis-kvlab-backend-v4
      - name: Commit reviewed source and reconciled lockfile
        run: |
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add Cargo.lock crates/nnis-model/src/safetensors_loader.rs crates/nnis-model/src/lib.rs crates/nnis-cli/src/bin/nnis-kvlab-backend-v4.rs docs/KVLAB-POSITION-BACKEND-V4.md
          git commit -m 'fix(kvlab): materialize BF16 checkpoints into actual F32 execution weights'
          git push origin HEAD:fix/kvlab-explicit-f32-materialization
