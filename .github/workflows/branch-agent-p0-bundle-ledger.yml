name: Branch agent P0 bundle ledger

on:
  push:
    branches:
      - agent/sovereignty-roadmap

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout roadmap branch
        uses: actions/checkout@v4
        with:
          ref: agent/sovereignty-roadmap
          fetch-depth: 0

      - name: Record merged P0 physical bundle without claiming evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_head = 'aed87db46b71e6726c6b528624a0d641e933e2e9'

          current_path = Path('.agent/CURRENT_EXECUTION_STATUS.yaml')
          text = current_path.read_text(encoding='utf-8')
          text = text.replace(
              '  main_head: e9746bbaed449a9373790d902adf76afd2369cf8',
              f'  main_head: {main_head}',
              1,
          )
          text = text.replace(
              '    status: merged_software_contract_physical_records_pending\n    pull_request: 112\n    merge_commit: e9746bbaed449a9373790d902adf76afd2369cf8',
              '    status: merged_software_contract_physical_bundle_ready_records_pending\n    pull_request: 112\n    merge_commit: e9746bbaed449a9373790d902adf76afd2369cf8\n    physical_bundle_pull_request: 113\n    physical_bundle_merge_commit: aed87db46b71e6726c6b528624a0d641e933e2e9\n    physical_bundle_launcher: tools/run_p0_physical_qualification_bundle.py',
              1,
          )
          marker = '      - synthetic_self_tests_are_not_physical_parity_evidence\n'
          addition = marker + '      - P0_bundle_requires_clean_HEAD_equal_fetched_origin_main_and_external_work_cache_paths\n      - P0_bundle_preserves_distinct_pinned_SmolLM2_and_TinyLlama_reference_environments\n      - P0_bundle_uses_one_first_visible_GPU_for_all_constituent_physical_gates\n      - P0_bundle_manifest_hashes_parity_records_and_their_reference_consensus_source_artifacts\n'
          if 'P0_bundle_requires_clean_HEAD_equal_fetched_origin_main_and_external_work_cache_paths' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('current ledger verified-property marker mismatch')
              text = text.replace(marker, addition, 1)
          text = text.replace(
              '    status: next_physical_gate\n    action: >-\n      run_the_pinned_SmolLM2_checkpoint_on_exact_main_e9746bba_and_generate_then_validate_schema_v2_capability_bound_evidence',
              '    status: physical_bundle_ready\n    action: >-\n      run_the_merged_P0_physical_bundle_on_exact_main_aed87db4_to_generate_and_validate_NNML0_plus_same_head_SmolLM2_and_TinyLlama_checkpoint_evidence',
              1,
          )
          text = text.replace(
              '    status: software_contract_completed_physical_records_pending\n    completed_pull_requests: [112]\n    action: >-\n      execute_SmolLM2_and_TinyLlama_real_reference_comparisons_on_the_same_exact_main_head_then_compose_and_validate_the_checkpoint_level_suite',
              '    status: physical_bundle_ready_records_pending\n    completed_pull_requests: [112, 113]\n    action: >-\n      execute_the_merged_P0_physical_bundle_on_the_same_exact_main_head_then_review_the_generated_SmolLM2_and_TinyLlama_records_and_composed_checkpoint_level_suite',
              1,
          )
          text = text.replace(
              '    status: physical_harness_reference_artifact_and_generation_parity_producer_ready\n    action: execute_the_pinned_massive_TinyLlama_campaign_without_cross_model_KA17_extrapolation',
              '    status: physical_bundle_ready_generation_parity_pending\n    action: execute_the_pinned_massive_TinyLlama_campaign_through_the_same_head_P0_bundle_without_cross_model_KA17_extrapolation',
              1,
          )
          current_path.write_text(text, encoding='utf-8')

          maturity_path = Path('.agent/ML_MATURITY_5_OF_5.yaml')
          maturity = maturity_path.read_text(encoding='utf-8')
          maturity = maturity.replace(
              '  main_head: e9746bbaed449a9373790d902adf76afd2369cf8',
              f'  main_head: {main_head}',
              1,
          )
          maturity = maturity.replace(
              '    status: active_multi_model_parity_software_contract_merged_physical_records_pending',
              '    status: active_multi_model_parity_software_contract_and_physical_bundle_merged_records_pending',
              1,
          )
          merged_marker = '      - pr_112_versioned_same_head_multi_checkpoint_parity_evidence_contract\n'
          if 'pr_113_same_head_P0_physical_qualification_bundle' not in maturity:
              if maturity.count(merged_marker) != 1:
                  raise SystemExit('maturity merged marker mismatch')
              maturity = maturity.replace(
                  merged_marker,
                  merged_marker + '      - pr_113_same_head_P0_physical_qualification_bundle\n',
                  1,
              )
          capability_marker = '      - synthetic_contract_self_tests_are_explicitly_not_physical_model_parity_evidence\n'
          if 'P0_physical_bundle_enforces_clean_promoted_main_and_single_visible_GPU_selection' not in maturity:
              if maturity.count(capability_marker) != 1:
                  raise SystemExit('maturity capability marker mismatch')
              maturity = maturity.replace(
                  capability_marker,
                  capability_marker + '      - P0_physical_bundle_enforces_clean_promoted_main_and_single_visible_GPU_selection\n      - P0_physical_bundle_preserves_separate_pinned_reference_environments_and_hashes_source_evidence_artifacts\n',
                  1,
              )
          next_marker = '    next:\n      - collect_same_head_real_SmolLM2_logit_and_generation_record_on_supported_CUDA_path\n'
          if next_marker in maturity:
              maturity = maturity.replace(
                  next_marker,
                  '    next:\n      - execute_merged_P0_physical_bundle_on_exact_main_aed87db4\n      - collect_same_head_real_SmolLM2_logit_and_generation_record_on_supported_CUDA_path\n',
                  1,
              )
          maturity = maturity.replace(
              '      parity_evidence_pr: 112\n',
              '      parity_evidence_pr: 112\n      p0_physical_bundle_pr: 113\n',
              1,
          )
          maturity_path.write_text(maturity, encoding='utf-8')
          PY

      - name: Sanity check ledger claims
        run: |
          grep -q 'physical_bundle_pull_request: 113' .agent/CURRENT_EXECUTION_STATUS.yaml
          grep -q 'physical_records_collected_on_current_main: false' .agent/CURRENT_EXECUTION_STATUS.yaml
          grep -q 'pr_113_same_head_P0_physical_qualification_bundle' .agent/ML_MATURITY_5_OF_5.yaml

      - name: Commit roadmap ledger update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/CURRENT_EXECUTION_STATUS.yaml .agent/ML_MATURITY_5_OF_5.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(agent): record P0 physical bundle readiness"
          git push origin HEAD:agent/sovereignty-roadmap
