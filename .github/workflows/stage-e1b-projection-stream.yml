name: Stage E1b projection stream cleanup
on:
  push:
    branches: [perf/e1-streaming-projection-diagnostic]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/e1-streaming-projection-diagnostic
          fetch-depth: 0
      - name: Clean diagnostic source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/nnis-bench/examples/smollm2_projection_stream.rs')
          s = p.read_text()
          marker = 'fn benchmark_sequence(\n'
          if '#[allow(clippy::too_many_arguments)]\nfn benchmark_sequence(' not in s:
              if marker not in s:
                  raise SystemExit('benchmark_sequence marker missing')
              s = s.replace(marker, '#[allow(clippy::too_many_arguments)]\n' + marker, 1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
      - name: Commit clean diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/stage-e1b-projection-stream.yml
          git add crates/nnis-bench/examples/smollm2_projection_stream.rs
          git commit -m "perf(bench): clean streaming projection diagnostic"
          git push origin HEAD:perf/e1-streaming-projection-diagnostic
