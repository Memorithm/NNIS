name: Temporary KVLab v4 checkpoint attestation patch

on:
  push:
    branches:
      - fix/kvlab-v4-exact-checkpoint-attestation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/kvlab-v4-exact-checkpoint-attestation
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Patch backend
        shell: python
        run: |
          from pathlib import Path

          p = Path("crates/nnis-cli/src/bin/nnis-kvlab-backend-v4.rs")
          s = p.read_text()
          if "fn exact_checkpoint_spec(args: &Args)" in s:
              raise SystemExit(0)

          old_import = 'use nnis_model::{load_model_from_safetensors, Model, SafetensorsLoadConfig};'
          new_import = '''use nnis_model::{
              load_model_from_safetensors, ExactDecoderCheckpointSpec, Model, SafetensorsLoadConfig,
              SMOLLM2_135M_BF16, TINYLLAMA_1P1B_CHAT_BF16,
          };'''
          assert old_import in s
          s = s.replace(old_import, new_import, 1)

          marker = '''struct Args {
              model_dir: PathBuf,
              model_id: String,
              model_revision: String,
              tokenizer_revision: String,
              runtime_backend: String,
              runtime_revision: String,
              device_ordinal: i32,
          }
          '''
          insert = marker + '''
          fn exact_checkpoint_spec(args: &Args) -> Result<&'static ExactDecoderCheckpointSpec, String> {
              for spec in [&SMOLLM2_135M_BF16, &TINYLLAMA_1P1B_CHAT_BF16] {
                  if args.model_id == spec.source_repo {
                      if args.model_revision != spec.source_revision {
                          return Err(format!(
                              "model revision {:?} does not match exact checkpoint {} revision {}",
                              args.model_revision, spec.name, spec.source_revision
                          ));
                      }
                      return Ok(spec);
                  }
              }
              Err(format!(
                  "model identity {}@{} has no exact NNIS checkpoint specification for KVLab v4 evidence",
                  args.model_id, args.model_revision
              ))
          }

          fn sha256_file(path: &std::path::Path) -> Result<String, String> {
              let mut file = std::fs::File::open(path)
                  .map_err(|error| format!("failed to open {} for SHA-256: {error}", path.display()))?;
              let mut digest = Sha256::new();
              let mut buffer = vec![0_u8; 1024 * 1024];
              loop {
                  let count = file
                      .read(&mut buffer)
                      .map_err(|error| format!("failed to read {} for SHA-256: {error}", path.display()))?;
                  if count == 0 {
                      break;
                  }
                  digest.update(&buffer[..count]);
              }
              Ok(format!("{:x}", digest.finalize()))
          }

          fn validate_local_checkpoint_artifact(
              args: &Args,
              spec: &ExactDecoderCheckpointSpec,
          ) -> Result<(), String> {
              let path = args.model_dir.join("model.safetensors");
              let actual = sha256_file(&path)?;
              if actual != spec.source_model_sha256 {
                  return Err(format!(
                      "local model.safetensors SHA-256 mismatch for {}: got {}, expected {}",
                      spec.name, actual, spec.source_model_sha256
                  ));
              }
              Ok(())
          }
          '''
          assert marker in s
          s = s.replace(marker, insert, 1)

          execute_marker = '''fn execute_request(args: &Args, request: &RequestV4) -> Result<(Vec<u8>, f64, f64), String> {
              let device = Device::get(args.device_ordinal).map_err(|error| {'''
          execute_replacement = '''fn execute_request(args: &Args, request: &RequestV4) -> Result<(Vec<u8>, f64, f64), String> {
              let checkpoint_spec = exact_checkpoint_spec(args)?;
              validate_local_checkpoint_artifact(args, checkpoint_spec)?;

              let device = Device::get(args.device_ordinal).map_err(|error| {'''
          assert execute_marker in s
          s = s.replace(execute_marker, execute_replacement, 1)

          model_marker = '    let model = Model::new(config, weights, &construction_stream)'
          model_replacement = '''    checkpoint_spec
              .validate_config(&config)
              .map_err(|error| {
                  format!(
                      "loaded model does not satisfy exact checkpoint {}: {error}",
                      checkpoint_spec.name
                  )
              })?;
              let model = Model::new(config, weights, &construction_stream)'''
          assert model_marker in s
          s = s.replace(model_marker, model_replacement, 1)

          test_marker = '''    #[test]
              fn request_accepts_repeated_model_tokens_and_position_identity() {'''
          test_insert = '''    #[test]
              fn exact_checkpoint_identity_requires_registered_source_and_revision() {
                  let mut configured = args();
                  configured.model_id = SMOLLM2_135M_BF16.source_repo.to_string();
                  configured.model_revision = SMOLLM2_135M_BF16.source_revision.to_string();
                  let spec = exact_checkpoint_spec(&configured).unwrap();
                  assert_eq!(spec.name, SMOLLM2_135M_BF16.name);

                  configured.model_revision = "deadbeef".to_string();
                  assert!(exact_checkpoint_spec(&configured).is_err());
                  assert!(exact_checkpoint_spec(&args()).is_err());
              }

              #[test]
              fn file_digest_is_streamed() {
                  let path = std::env::temp_dir().join(format!(
                      "nnis-kvlab-v4-sha-{}-{}.bin",
                      std::process::id(),
                      std::time::SystemTime::now()
                          .duration_since(std::time::UNIX_EPOCH)
                          .unwrap()
                          .as_nanos()
                  ));
                  std::fs::write(&path, b"abc").unwrap();
                  let digest = sha256_file(&path).unwrap();
                  let _ = std::fs::remove_file(&path);
                  assert_eq!(
                      digest,
                      "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
                  );
              }

              #[test]
              fn request_accepts_repeated_model_tokens_and_position_identity() {'''
          assert test_marker in s
          s = s.replace(test_marker, test_insert, 1)

          p.write_text(s)
      - name: Format
        run: |
          rustup default stable
          cargo fmt --all
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add crates/nnis-cli/src/bin/nnis-kvlab-backend-v4.rs
          git commit -m "fix(kvlab): attest exact checkpoint in v4 backend"
          git push origin HEAD:fix/kvlab-v4-exact-checkpoint-attestation
