name: Temporary DAL0 constructor hardening

on:
  push:
    branches: [feat/dal0-flat-view-binding]
    paths:
      - ".github/workflows/dal0-constructor-hardening.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dal0-flat-view-binding
          fetch-depth: 0
      - name: Harden constructor and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/nnis-model/src/da_luc_plan.rs')
          s = p.read_text()
          old = '''        value_group_size: usize,
    ) -> Self {
        let head_dim = config.head_dim();
        Self {
'''
          new = '''        value_group_size: usize,
    ) -> Result<Self> {
        config.validate_execution_support()?;
        let head_dim = config.head_dim();
        Ok(Self {
'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '''            physical_layout: NnisDalucCudaPhysicalLayout::Fdal3CompatibleWordPackedV1,
        }
    }

    pub fn validate(
'''
          new = '''            physical_layout: NnisDalucCudaPhysicalLayout::Fdal3CompatibleWordPackedV1,
        })
    }

    pub fn validate(
