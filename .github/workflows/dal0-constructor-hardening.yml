          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test -p nnis-model da_luc_plan --lib
          cargo clippy -p nnis-model --all-targets -- -D warnings
      - name: Commit validated patch and remove temporary workflow
        run: |
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git rm .github/workflows/dal0-constructor-hardening.yml
          git add crates/nnis-model/src/da_luc_plan.rs
