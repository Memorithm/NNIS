          new = '''            NnisDalucCodebookScope::PerKvHead,
            8,
        )
        .unwrap()
    }

    #[test]
    fn constructor_rejects_invalid_model_geometry_without_panicking() {
        let mut invalid = config();
        invalid.num_attention_heads = 0;
        assert!(NnisDalucCandidatePlan::fdal3_compatible_v1(
