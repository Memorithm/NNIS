name: Repair E1 projection factorial diagnostic
on:
  push:
    branches: [perf/e1-projection-factorial]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/e1-projection-factorial
          fetch-depth: 0
      - name: Add single-family E1 plans at plan scope
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/nnis-model/src/projection_plan.rs')
          s = p.read_text()
          marker = "    pub fn validate(self) -> Result<()> {\n        for choice in [self.q_o, self.k_v, self.gate_up, self.down, self.lm_head] {\n"
          insert = (
              "    /// Diagnostic E1 plan: only Q/O projections use the measured GEMV candidate.\n"
              "    #[must_use]\n"
              "    pub const fn thor_e1_qo_only() -> Self {\n"
              "        Self { q_o: F32ProjectionKernel::Gemv { block_size: 512 }, ..Self::baseline_gemm() }\n"
              "    }\n\n"
              "    /// Diagnostic E1 plan: only gate/up projections use the measured GEMV candidate.\n"
              "    #[must_use]\n"
              "    pub const fn thor_e1_gate_up_only() -> Self {\n"
              "        Self { gate_up: F32ProjectionKernel::Gemv { block_size: 128 }, ..Self::baseline_gemm() }\n"
              "    }\n\n"
              "    /// Diagnostic E1 plan: only the LM head uses the measured GEMV candidate.\n"
              "    #[must_use]\n"
              "    pub const fn thor_e1_lm_head_only() -> Self {\n"
              "        Self { lm_head: F32ProjectionKernel::Gemv { block_size: 64 }, ..Self::baseline_gemm() }\n"
              "    }\n\n"
          )
          if 'thor_e1_qo_only' not in s:
              if marker not in s:
                  raise SystemExit('F32ProjectionPlan validate marker missing')
              s = s.replace(marker, insert + marker, 1)

          test_marker = "    #[test]\n    fn invalid_gemv_width_is_fail_closed() {\n"
          test = (
              "    #[test]\n"
              "    fn single_family_diagnostics_change_only_one_family() {\n"
              "        let baseline = F32ProjectionPlan::baseline_gemm();\n"
              "        let qo = F32ProjectionPlan::thor_e1_qo_only();\n"
              "        assert_eq!(qo.q_o, F32ProjectionKernel::Gemv { block_size: 512 });\n"
              "        assert_eq!((qo.k_v, qo.gate_up, qo.down, qo.lm_head), (baseline.k_v, baseline.gate_up, baseline.down, baseline.lm_head));\n"
              "        let gate_up = F32ProjectionPlan::thor_e1_gate_up_only();\n"
              "        assert_eq!(gate_up.gate_up, F32ProjectionKernel::Gemv { block_size: 128 });\n"
              "        assert_eq!((gate_up.q_o, gate_up.k_v, gate_up.down, gate_up.lm_head), (baseline.q_o, baseline.k_v, baseline.down, baseline.lm_head));\n"
              "        let lm_head = F32ProjectionPlan::thor_e1_lm_head_only();\n"
              "        assert_eq!(lm_head.lm_head, F32ProjectionKernel::Gemv { block_size: 64 });\n"
              "        assert_eq!((lm_head.q_o, lm_head.k_v, lm_head.gate_up, lm_head.down), (baseline.q_o, baseline.k_v, baseline.gate_up, baseline.down));\n"
              "    }\n\n"
          )
          if 'single_family_diagnostics_change_only_one_family' not in s:
              if test_marker not in s:
                  raise SystemExit('diagnostic test marker missing')
              s = s.replace(test_marker, test + test_marker, 1)
          p.write_text(s)

          p = Path('crates/nnis-bench/examples/smollm2_e2e.rs')
          s = p.read_text()
          old = (
              '                    .ok_or("--projection-plan requires baseline-gemm or thor-e1-smollm2")?\n'
              '                    .as_str()\n'
              '                {\n'
              '                    "baseline-gemm" => F32ProjectionPlan::baseline_gemm(),\n'
              '                    "thor-e1-smollm2" => F32ProjectionPlan::thor_e1_smollm2(),\n'
              '                    other => return Err(format!("unknown --projection-plan {other:?}")),\n'
              '                };\n'
          )
          new = (
              '                    .ok_or("--projection-plan requires a known E1 diagnostic plan")?\n'
              '                    .as_str()\n'
              '                {\n'
              '                    "baseline-gemm" => F32ProjectionPlan::baseline_gemm(),\n'
              '                    "thor-e1-qo-only" => F32ProjectionPlan::thor_e1_qo_only(),\n'
              '                    "thor-e1-gate-up-only" => F32ProjectionPlan::thor_e1_gate_up_only(),\n'
              '                    "thor-e1-lm-head-only" => F32ProjectionPlan::thor_e1_lm_head_only(),\n'
              '                    "thor-e1-smollm2" => F32ProjectionPlan::thor_e1_smollm2(),\n'
              '                    other => return Err(format!("unknown --projection-plan {other:?}")),\n'
              '                };\n'
          )
          if old not in s:
              raise SystemExit('benchmark projection-plan parser marker missing')
          s = s.replace(old, new, 1)
          old_help = '[--projection-plan baseline-gemm|thor-e1-smollm2]'
          new_help = '[--projection-plan baseline-gemm|thor-e1-qo-only|thor-e1-gate-up-only|thor-e1-lm-head-only|thor-e1-smollm2]'
          if old_help not in s:
              raise SystemExit('benchmark help marker missing')
          p.write_text(s.replace(old_help, new_help, 1))
          PY
      - name: Validate factorial diagnostic
        run: |
          cargo fmt --all
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p nnis-model --lib
          cargo check --locked -p nnis-bench --example smollm2_e2e
      - name: Commit clean diagnostic source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/stage-e1-factorial.yml .github/workflows/stage-e1-factorial-fix.yml
          git add crates/nnis-model/src/projection_plan.rs crates/nnis-bench/examples/smollm2_e2e.rs
          git commit -m "perf(model): add E1 single-family diagnostic plans"
          git push origin HEAD:perf/e1-projection-factorial
