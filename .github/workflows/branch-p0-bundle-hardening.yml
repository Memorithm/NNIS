name: Branch P0 bundle hardening

on:
  push:
    branches:
      - feat/p0-physical-qualification-bundle-v1

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/p0-physical-qualification-bundle-v1
          fetch-depth: 0

      - name: Harden external paths and source artifact manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          launcher_path = Path('tools/run_p0_physical_qualification_bundle.py')
          text = launcher_path.read_text(encoding='utf-8')
          if 'def require_path_outside_repository(' not in text:
              old = '''def require_work_dir_outside_repository(root: Path, work_dir: Path) -> None:\n    if work_dir == root or work_dir.is_relative_to(root):\n        raise QualificationError(\n            f"--work-dir must be outside the repository so evidence does not dirty the checkout: {work_dir}"\n        )\n'''
              new = '''def require_path_outside_repository(root: Path, path: Path, label: str) -> None:\n    if path == root or path.is_relative_to(root):\n        raise QualificationError(\n            f"{label} must be outside the repository so qualification data does not dirty the checkout: {path}"\n        )\n'''
              if text.count(old) != 1:
                  raise SystemExit('expected work-dir guard exactly once')
              text = text.replace(old, new, 1)
              text = text.replace(
                  '    require_work_dir_outside_repository(root, work_dir)\n',
                  '    require_path_outside_repository(root, work_dir, "--work-dir")\n',
                  1,
              )
              old_cache = '''    cache_dir = args.cache_dir.expanduser().resolve() if args.cache_dir else None\n    if cache_dir is not None:\n        cache_dir.mkdir(parents=True, exist_ok=True)\n'''
              new_cache = '''    cache_dir = args.cache_dir.expanduser().resolve() if args.cache_dir else None\n    if cache_dir is not None:\n        require_path_outside_repository(root, cache_dir, "--cache-dir")\n        cache_dir.mkdir(parents=True, exist_ok=True)\n'''
              if text.count(old_cache) != 1:
                  raise SystemExit('expected cache block exactly once')
              text = text.replace(old_cache, new_cache, 1)
              old_paths = '''    smollm2_parity = work_dir / "smollm2-parity-record.json"\n    tinyllama_work = work_dir / "tinyllama"\n    tinyllama_run_dir = tinyllama_work / f"runs-{head[:12]}"\n    tinyllama_parity = tinyllama_run_dir / "parity_record.json"\n'''
              new_paths = '''    smollm2_parity = work_dir / "smollm2-parity-record.json"\n    smollm2_reference_manifest = smollm2_fixture / "reference" / "reference.json"\n    tinyllama_work = work_dir / "tinyllama"\n    tinyllama_run_dir = tinyllama_work / f"runs-{head[:12]}"\n    tinyllama_parity = tinyllama_run_dir / "parity_record.json"\n    tinyllama_consensus = tinyllama_run_dir / "consensus.json"\n'''
              if text.count(old_paths) != 1:
                  raise SystemExit('expected artifact path block exactly once')
              text = text.replace(old_paths, new_paths, 1)
              old_artifacts = '''            "nnml0_real_safetensors": artifact_entry(nnml0_evidence),\n            "smollm2_parity_record": artifact_entry(smollm2_parity),\n            "tinyllama_parity_record": artifact_entry(tinyllama_parity),\n            "nnml1_multi_model_parity_suite": artifact_entry(parity_suite),\n'''
              new_artifacts = '''            "nnml0_real_safetensors": artifact_entry(nnml0_evidence),\n            "smollm2_reference_manifest": artifact_entry(smollm2_reference_manifest),\n            "smollm2_parity_record": artifact_entry(smollm2_parity),\n            "tinyllama_consensus": artifact_entry(tinyllama_consensus),\n            "tinyllama_parity_record": artifact_entry(tinyllama_parity),\n            "nnml1_multi_model_parity_suite": artifact_entry(parity_suite),\n'''
              if text.count(old_artifacts) != 1:
                  raise SystemExit('expected manifest artifact block exactly once')
              text = text.replace(old_artifacts, new_artifacts, 1)
              text = text.replace(
                  '        require_work_dir_outside_repository(root, outside)\n',
                  '        require_path_outside_repository(root, outside, "--work-dir")\n',
                  1,
              )
              text = text.replace(
                  '            require_work_dir_outside_repository(root, root / "evidence")\n',
                  '            require_path_outside_repository(root, root / "evidence", "--work-dir")\n',
                  1,
              )
              marker = '''        else:\n            raise AssertionError("work directory inside repository unexpectedly passed")\n        artifact = outside / "artifact.json"\n'''
              replacement = '''        else:\n            raise AssertionError("work directory inside repository unexpectedly passed")\n        try:\n            require_path_outside_repository(root, root / "cache", "--cache-dir")\n        except QualificationError:\n            pass\n        else:\n            raise AssertionError("cache directory inside repository unexpectedly passed")\n        artifact = outside / "artifact.json"\n'''
              if text.count(marker) != 1:
                  raise SystemExit('expected self-test insertion marker exactly once')
              text = text.replace(marker, replacement, 1)
              launcher_path.write_text(text, encoding='utf-8')

          docs_path = Path('docs/P0_PHYSICAL_QUALIFICATION_BUNDLE_V1.md')
          docs = docs_path.read_text(encoding='utf-8')
          docs = docs.replace(
              'The evidence directory must be outside the repository. From a clean checkout of promoted `main`:',
              'The evidence directory and optional cache directory must both be outside the repository. From a clean checkout of promoted `main`:',
          )
          docs = docs.replace(
              'The bundle manifest records SHA-256 digests for these evidence artifacts. The individual validators remain authoritative for their semantics.',
              'The bundle manifest records SHA-256 digests for these evidence artifacts and for the SmolLM2 `reference.json` and TinyLlama `consensus.json` source-evidence files. The individual validators remain authoritative for their semantics.',
          )
          docs_path.write_text(docs, encoding='utf-8')
          PY

      - name: Validate launcher
        run: |
          python3 tools/run_p0_physical_qualification_bundle.py --self-test
          python3 -m py_compile tools/run_p0_physical_qualification_bundle.py

      - name: Commit hardened bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run_p0_physical_qualification_bundle.py docs/P0_PHYSICAL_QUALIFICATION_BUNDLE_V1.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(qualification): harden P0 evidence bundle paths"
          git push origin HEAD:feat/p0-physical-qualification-bundle-v1
