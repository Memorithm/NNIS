name: Stage E1 projection factorial diagnostic
on:
  push:
    branches: [perf/e1-projection-factorial]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/e1-projection-factorial
          fetch-depth: 0
      - name: Add single-family E1 plans
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/nnis-model/src/projection_plan.rs')
          s = p.read_text()
          marker = '''    pub fn validate(self) -> Result<()> {
'''
          insert = '''    /// Diagnostic E1 plan: only Q/O projections use the measured GEMV candidate.
    #[must_use]
    pub const fn thor_e1_qo_only() -> Self {
        Self {
            q_o: F32ProjectionKernel::Gemv { block_size: 512 },
            ..Self::baseline_gemm()
        }
    }

    /// Diagnostic E1 plan: only gate/up projections use the measured GEMV candidate.
    #[must_use]
    pub const fn thor_e1_gate_up_only() -> Self {
        Self {
            gate_up: F32ProjectionKernel::Gemv { block_size: 128 },
            ..Self::baseline_gemm()
        }
    }

    /// Diagnostic E1 plan: only the LM head uses the measured GEMV candidate.
    #[must_use]
    pub const fn thor_e1_lm_head_only() -> Self {
        Self {
            lm_head: F32ProjectionKernel::Gemv { block_size: 64 },
            ..Self::baseline_gemm()
        }
    }

'''
          if 'thor_e1_qo_only' not in s:
              if marker not in s:
                  raise SystemExit('projection-plan insertion marker missing')
              s = s.replace(marker, insert + marker, 1)
          test_marker = '''    #[test]
    fn invalid_gemv_width_is_fail_closed() {
'''
          test = '''    #[test]
    fn single_family_diagnostics_change_only_one_family() {
        let baseline = F32ProjectionPlan::baseline_gemm();

        let qo = F32ProjectionPlan::thor_e1_qo_only();
        assert_eq!(qo.q_o, F32ProjectionKernel::Gemv { block_size: 512 });
        assert_eq!(qo.k_v, baseline.k_v);
        assert_eq!(qo.gate_up, baseline.gate_up);
        assert_eq!(qo.down, baseline.down);
        assert_eq!(qo.lm_head, baseline.lm_head);

        let gate_up = F32ProjectionPlan::thor_e1_gate_up_only();
        assert_eq!(gate_up.q_o, baseline.q_o);
        assert_eq!(gate_up.k_v, baseline.k_v);
        assert_eq!(gate_up.gate_up, F32ProjectionKernel::Gemv { block_size: 128 });
        assert_eq!(gate_up.down, baseline.down);
        assert_eq!(gate_up.lm_head, baseline.lm_head);

        let lm_head = F32ProjectionPlan::thor_e1_lm_head_only();
        assert_eq!(lm_head.q_o, baseline.q_o);
        assert_eq!(lm_head.k_v, baseline.k_v);
        assert_eq!(lm_head.gate_up, baseline.gate_up);
        assert_eq!(lm_head.down, baseline.down);
        assert_eq!(lm_head.lm_head, F32ProjectionKernel::Gemv { block_size: 64 });
    }

'''
          if 'single_family_diagnostics_change_only_one_family' not in s:
              if test_marker not in s:
                  raise SystemExit('projection-plan test insertion marker missing')
              s = s.replace(test_marker, test + test_marker, 1)
          p.write_text(s)

          p = Path('crates/nnis-bench/examples/smollm2_e2e.rs')
          s = p.read_text()
          old = '''                    .ok_or("--projection-plan requires baseline-gemm or thor-e1-smollm2")?
                    .as_str()
                {
                    "baseline-gemm" => F32ProjectionPlan::baseline_gemm(),
                    "thor-e1-smollm2" => F32ProjectionPlan::thor_e1_smollm2(),
                    other => return Err(format!("unknown --projection-plan {other:?}")),
                };
'''
          new = '''                    .ok_or("--projection-plan requires a known E1 diagnostic plan")?
                    .as_str()
                {
                    "baseline-gemm" => F32ProjectionPlan::baseline_gemm(),
                    "thor-e1-qo-only" => F32ProjectionPlan::thor_e1_qo_only(),
                    "thor-e1-gate-up-only" => F32ProjectionPlan::thor_e1_gate_up_only(),
                    "thor-e1-lm-head-only" => F32ProjectionPlan::thor_e1_lm_head_only(),
                    "thor-e1-smollm2" => F32ProjectionPlan::thor_e1_smollm2(),
                    other => return Err(format!("unknown --projection-plan {other:?}")),
                };
'''
          if old not in s:
              raise SystemExit('benchmark projection-plan parser marker missing')
          s = s.replace(old, new, 1)
          s = s.replace(
              '[--projection-plan baseline-gemm|thor-e1-smollm2]',
              '[--projection-plan baseline-gemm|thor-e1-qo-only|thor-e1-gate-up-only|thor-e1-lm-head-only|thor-e1-smollm2]',
              1,
          )
          p.write_text(s)
          PY
      - name: Validate factorial diagnostic
        run: |
          cargo fmt --all
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p nnis-model --lib
          cargo check --locked -p nnis-bench --example smollm2_e2e
      - name: Commit clean diagnostic source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/stage-e1-factorial.yml
          git add crates/nnis-model/src/projection_plan.rs crates/nnis-bench/examples/smollm2_e2e.rs
          git commit -m "perf(model): add E1 single-family diagnostic plans"
          git push origin HEAD:perf/e1-projection-factorial
