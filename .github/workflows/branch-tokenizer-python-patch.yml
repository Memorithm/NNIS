name: Branch tokenizer Python patch

on:
  push:
    branches:
      - feat/nnml1-tokenizer-reference-identity-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/nnml1-tokenizer-reference-identity-v1
          fetch-depth: 0

      - name: Apply exact Python integration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          smol_path = Path("tools/smollm2_135m_fixture.py")
          smol = smol_path.read_text(encoding="utf-8")
          if 'print(f"tokenizer_sha256={tokenizer_digest}")' not in smol:
              smol = replace_once(smol, "def convert_weights(checkpoint: Path, output: Path) -> None:\n", "def convert_weights(checkpoint: Path, output: Path, tokenizer_sha256: str) -> None:\n", "SmolLM2 convert signature")
              smol = replace_once(smol, '        "execution_weight_dtype": "f32",\n        "tied_lm_head_materialized": True,\n', '        "execution_weight_dtype": "f32",\n        "tokenizer_sha256": tokenizer_sha256,\n        "tied_lm_head_materialized": True,\n', "SmolLM2 provenance tokenizer hash")
              smol = replace_once(smol, "def reference_logits(\n    checkpoint: Path,\n    output: Path,\n    prompt: str,\n    decode_steps: int,\n) -> None:\n", "def reference_logits(\n    checkpoint: Path,\n    output: Path,\n    prompt: str,\n    decode_steps: int,\n    tokenizer_sha256: str,\n) -> None:\n", "SmolLM2 reference signature")
              smol = replace_once(smol, '        "execution_weight_dtype": "f32",\n        "prompt": prompt,\n', '        "execution_weight_dtype": "f32",\n        "tokenizer_sha256": tokenizer_sha256,\n        "prompt": prompt,\n', "SmolLM2 reference tokenizer hash")
              smol = replace_once(smol, '    shutil.copy2(checkpoint / "tokenizer.json", tokenizer_file)\n    model_dir = args.output / "model"\n', '    shutil.copy2(checkpoint / "tokenizer.json", tokenizer_file)\n    tokenizer_digest = sha256(tokenizer_file)\n    model_dir = args.output / "model"\n', "SmolLM2 tokenizer digest")
              smol = replace_once(smol, "    convert_weights(checkpoint, model_dir)\n", "    convert_weights(checkpoint, model_dir, tokenizer_digest)\n", "SmolLM2 converter call")
              smol = replace_once(smol, "    reference_logits(checkpoint, reference_dir, args.prompt, args.decode_steps)\n", "    reference_logits(\n        checkpoint, reference_dir, args.prompt, args.decode_steps, tokenizer_digest\n    )\n", "SmolLM2 reference call")
              smol = replace_once(smol, '    print(f"transformers={transformers.__version__}")\n', '    print(f"transformers={transformers.__version__}")\n    print(f"tokenizer_sha256={tokenizer_digest}")\n', "SmolLM2 tokenizer output")
              smol_path.write_text(smol, encoding="utf-8")

          runner_path = Path("tools/run_tinyllama_massive_campaign.py")
          runner = runner_path.read_text(encoding="utf-8")
          if "from tokenizer_reference_identity import IdentityError" not in runner:
              runner = replace_once(runner, "from typing import Any\n", "from typing import Any\n\nfrom tokenizer_reference_identity import IdentityError, build_identity, validate_documents\n", "TinyLlama identity import")
              runner = replace_once(runner, 'SOURCE_MODEL_SHA256 = "6e6001da2106d4757498752a021df6c2bdc332c650aae4bae6b0c004dcf14933"\nDEFAULT_CANDIDATES', 'SOURCE_MODEL_SHA256 = "6e6001da2106d4757498752a021df6c2bdc332c650aae4bae6b0c004dcf14933"\nCHECKPOINT_SPEC_NAME = "tinyllama-1.1b-chat-v1.0-bf16"\nCHECKPOINT_SPEC_VERSION = 1\nREFERENCE_TRANSFORMERS_VERSION = "4.43.3"\nREFERENCE_ORACLE_SEMANTICS = (\n    "Transformers CPU F32 greedy generation from the exact pinned checkpoint widened to F32"\n)\nDEFAULT_CANDIDATES', "TinyLlama identity constants")
              old_try = '''    try:\n        suite = json.loads(suite_path.read_text(encoding="utf-8"))\n        provenance = json.loads(provenance_path.read_text(encoding="utf-8"))\n    except (OSError, json.JSONDecodeError):\n        return False\n'''
              new_try = '''    try:\n        suite = json.loads(suite_path.read_text(encoding="utf-8"))\n        provenance = json.loads(provenance_path.read_text(encoding="utf-8"))\n        identity = build_identity(\n            checkpoint_spec_name=CHECKPOINT_SPEC_NAME,\n            checkpoint_spec_version=CHECKPOINT_SPEC_VERSION,\n            source_repo=SOURCE_REPO,\n            source_revision=SOURCE_REVISION,\n            source_model_sha256=SOURCE_MODEL_SHA256,\n            tokenizer_path=tokenizer_path,\n            reference_kind=SUITE_KIND,\n            reference_runtime="transformers",\n            reference_runtime_version=REFERENCE_TRANSFORMERS_VERSION,\n            source_weight_dtype="bfloat16",\n            execution_weight_dtype="f32",\n            oracle_semantics=REFERENCE_ORACLE_SEMANTICS,\n        )\n        validate_documents(identity, {"suite": suite, "provenance": provenance})\n    except (OSError, json.JSONDecodeError, IdentityError):\n        return False\n'''
              runner = replace_once(runner, old_try, new_try, "TinyLlama fixture validation")
              runner_path.write_text(runner, encoding="utf-8")
          PY

      - name: Syntax check patched Python
        run: python3 -m py_compile tools/tokenizer_reference_identity.py tools/smollm2_135m_fixture.py tools/run_tinyllama_massive_campaign.py

      - name: Commit integration patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/smollm2_135m_fixture.py tools/run_tinyllama_massive_campaign.py
          git commit -m "feat(nnml1): bind fixtures to tokenizer identity"
          git push origin HEAD:feat/nnml1-tokenizer-reference-identity-v1
