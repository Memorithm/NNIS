name: Agent maintenance 127

on:
  push:
    branches:
      - agent/sovereignty-roadmap
    paths:
      - .agent/maintenance-trigger-127

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sovereignty-roadmap
      - name: Update roadmap overlays
        run: python3 .agent/update_nnml2_127.py
      - name: Commit roadmap changes
        run: |
          set -euo pipefail
          git add .agent/NNIS_SOVEREIGNTY_ROADMAP.yaml .agent/ML_MATURITY_5_OF_5.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(agent): record NNML2 lifecycle artifact qualification"
          git push origin HEAD:agent/sovereignty-roadmap
