name: Fix PR120 Clippy

on:
  push:
    branches:
      - feat/f16-weight-allocation-accounting

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f16-weight-allocation-accounting
      - name: Apply exact Clippy fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/nnis-model/src/f16_reference_runtime.rs')
          text = path.read_text()
          old = 'if buffer.len() == 0 || buffer.device_ptr() == 0 {'
          new = 'if buffer.is_empty() || buffer.device_ptr() == 0 {'
          if old not in text:
              raise SystemExit('expected Clippy target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git add crates/nnis-model/src/f16_reference_runtime.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(model): satisfy Clippy for F16 allocation accounting"
          git push origin HEAD:feat/f16-weight-allocation-accounting
