name: Commit validated EOS patch

on:
  push:
    branches: [feature/eos-aware-generation]

permissions:
  contents: write

jobs:
  commit:
    if: github.repository == 'Memorithm/NVIDIA-Native-Inference-Stack'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/eos-aware-generation

      - name: Reapply validated source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          lines = Path('.github/workflows/eos-patch.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start + 1:end])) + '\n'
          Path('/tmp/eos_patch.py').write_text(script)
          subprocess.run(['python3', '/tmp/eos_patch.py'], check=True)
          PY
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo test --workspace --all-targets

      - name: Commit code and docs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/nnis-model/src/config.rs \
            crates/nnis-model/src/runtime.rs \
            crates/nnis-model/src/format.rs \
            crates/nnis-cli/src/main.rs \
            tools/tiny_random_llama_fixture.py \
            README.md \
            docs/MODEL_RUNTIME.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat(model): add EOS-aware greedy generation'
            git push origin HEAD:feature/eos-aware-generation
          fi
