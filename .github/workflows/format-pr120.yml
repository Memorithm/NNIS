name: Format PR120

on:
  push:
    branches:
      - feat/f16-weight-allocation-accounting

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f16-weight-allocation-accounting
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add crates/nnis-bench/examples/smollm2_f16_weight_allocation_accounting.rs crates/nnis-model/src/f16_reference_runtime.rs crates/nnis-model/src/weights.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply rustfmt to F16 allocation accounting"
          git push origin HEAD:feat/f16-weight-allocation-accounting
