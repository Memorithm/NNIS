name: Apply F16 failure evidence

on:
  push:
    branches:
      - feat/f16-materialization-failure-evidence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f16-materialization-failure-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply integration
        run: python3 .github/scripts/apply_f16_failure_evidence.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo check --locked -p nnis-model --all-targets
          cargo clippy --locked -p nnis-model --all-targets -- -D warnings
          cargo test --locked -p nnis-model --lib
      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git add crates/nnis-model/src/f16_materialization_memory.rs crates/nnis-model/src/f16_reference_runtime.rs crates/nnis-model/src/lib.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(model): retain failed F16 materialization memory evidence"
          git push origin HEAD:feat/f16-materialization-failure-evidence
