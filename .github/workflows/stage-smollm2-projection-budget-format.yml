name: Stage SmolLM2 projection budget format
on:
  push:
    branches: [perf/smollm2-decode-budget]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/smollm2-decode-budget
      - name: Format and validate example
        run: |
          cargo fmt --all
          cargo check --locked -p nnis-bench --example smollm2_projection_budget
          cargo clippy --locked -p nnis-bench --example smollm2_projection_budget -- -D warnings
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/nnis-bench/examples/smollm2_projection_budget.rs
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style(bench): format SmolLM2 projection budget"
          git push origin HEAD:perf/smollm2-decode-budget
