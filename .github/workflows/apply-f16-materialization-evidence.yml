name: Apply F16 materialization evidence

on:
  push:
    branches:
      - feat/f16-materialization-memory-evidence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f16-materialization-memory-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply integration script
        run: python3 .github/scripts/apply_f16_materialization.py
      - name: Validate integration
        run: |
          cargo fmt --all
          cargo check --locked -p nnis-model --all-targets
          cargo clippy --locked -p nnis-model --all-targets -- -D warnings
          cargo test --locked -p nnis-model --lib
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git add crates/nnis-model/src/lib.rs crates/nnis-model/src/f16_reference_runtime.rs crates/nnis-model/src/f16_materialization_memory.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(model): instrument F16 materialization allocation peak"
          git push origin HEAD:feat/f16-materialization-memory-evidence
