name: Temporary DAL1 format fix

on:
  push:
    branches:
      - feat/dal1-flat-oracle-evidence

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dal1-flat-oracle-evidence
          fetch-depth: 0
      - name: Apply compiler fix and rustfmt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/nnis-model/src/da_luc_evidence.rs')
          text = path.read_text()
          text = text.replace(
              'fn evidence(plan: &NnisDalucCandidatePlan) -> NnisDalucFlatOracleEvidence {',
              'fn fixture(plan: &NnisDalucCandidatePlan) -> NnisDalucFlatOracleEvidence {',
          )
          text = text.replace('evidence(&plan)', 'fixture(&plan)')
          path.write_text(text)
          PY
          rustup component add rustfmt
          cargo fmt --all
          cargo check --workspace --all-targets
          git rm .github/workflows/dal1-format-fix.yml
          git add crates/nnis-model/src/da_luc_evidence.rs crates/nnis-model/src/lib.rs
          git diff --cached --check
      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git commit -m 'fix(dal1): format oracle evidence adapter'
          git push origin HEAD:feat/dal1-flat-oracle-evidence
