name: Stage comparable SmolLM2 request timing
on:
  push:
    branches: [perf/smollm2-e2e-benchmark]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/smollm2-e2e-benchmark
      - name: Patch request-total timing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('crates/nnis-bench/examples/smollm2_e2e.rs'); s=p.read_text()
          reps=[
          ('    session_setup: TimingReport,\n    generation: TimingReport,\n    generated_tokens_per_second_median: f64,\n',
           '    session_setup: TimingReport,\n    generation: TimingReport,\n    request_total: TimingReport,\n    generated_tokens_per_second_generation_median: f64,\n    generated_tokens_per_second_request_median: f64,\n'),
          ('    let mut session_setup_samples_ms = Vec::with_capacity(arguments.config.iterations);\n    let mut generation_samples_ms = Vec::with_capacity(arguments.config.iterations);\n',
           '    let mut session_setup_samples_ms = Vec::with_capacity(arguments.config.iterations);\n    let mut generation_samples_ms = Vec::with_capacity(arguments.config.iterations);\n    let mut request_total_samples_ms = Vec::with_capacity(arguments.config.iterations);\n'),
          ('    for _ in 0..arguments.config.iterations {\n        let setup_start = Instant::now();\n',
           '    for _ in 0..arguments.config.iterations {\n        let request_start = Instant::now();\n        let setup_start = Instant::now();\n'),
          ('        let generation_ms = elapsed_ms(generation_start);\n        if generated.len() != arguments.decode_steps {\n',
           '        let generation_ms = elapsed_ms(generation_start);\n        let request_total_ms = elapsed_ms(request_start);\n        if generated.len() != arguments.decode_steps {\n'),
          ('        session_setup_samples_ms.push(setup_ms);\n        generation_samples_ms.push(generation_ms);\n',
           '        session_setup_samples_ms.push(setup_ms);\n        generation_samples_ms.push(generation_ms);\n        request_total_samples_ms.push(request_total_ms);\n'),
          ('    let session_setup_statistics = summarize_samples_ms(&session_setup_samples_ms)?;\n    let generation_statistics = summarize_samples_ms(&generation_samples_ms)?;\n    if generation_statistics.median_ms <= 0.0 {\n',
           '    let session_setup_statistics = summarize_samples_ms(&session_setup_samples_ms)?;\n    let generation_statistics = summarize_samples_ms(&generation_samples_ms)?;\n    let request_total_statistics = summarize_samples_ms(&request_total_samples_ms)?;\n    if generation_statistics.median_ms <= 0.0 || request_total_statistics.median_ms <= 0.0 {\n'),
          ('    let generated_tokens_per_second_median =\n        arguments.decode_steps as f64 / (generation_statistics.median_ms / 1_000.0);\n',
           '    let generated_tokens_per_second_generation_median =\n        arguments.decode_steps as f64 / (generation_statistics.median_ms / 1_000.0);\n    let generated_tokens_per_second_request_median =\n        arguments.decode_steps as f64 / (request_total_statistics.median_ms / 1_000.0);\n'),
          ('        schema_version: 1,\n','        schema_version: 2,\n'),
          ('        measurement: "host-wall-clock; generate() is synchronized before return; model load and session setup excluded from generation samples",\n',
           '        measurement: "host-wall-clock; request_total includes fresh session setup plus synchronized generate(); generation excludes session setup; model load excluded",\n'),
          ('        generation: TimingReport {\n            statistics: generation_statistics,\n            samples_ms: generation_samples_ms,\n        },\n        generated_tokens_per_second_median,\n',
           '        generation: TimingReport {\n            statistics: generation_statistics,\n            samples_ms: generation_samples_ms,\n        },\n        request_total: TimingReport {\n            statistics: request_total_statistics,\n            samples_ms: request_total_samples_ms,\n        },\n        generated_tokens_per_second_generation_median,\n        generated_tokens_per_second_request_median,\n')]
          for a,b in reps:
              if a not in s: raise SystemExit('Rust marker missing: '+a[:60])
              s=s.replace(a,b,1)
          if 'generated_tokens_per_second_median' in s: raise SystemExit('ambiguous Rust throughput remains')
          p.write_text(s)

          p=Path('tools/bench_smollm2_transformers.py'); s=p.read_text()
          reps=[
          ('    samples_ms: list[float] = []\n','    request_total_samples_ms: list[float] = []\n'),
          ('        samples_ms.append(elapsed_ms)\n','        request_total_samples_ms.append(elapsed_ms)\n'),
          ('    timing = summarize(samples_ms)\n','    request_total_timing = summarize(request_total_samples_ms)\n'),
          ('    median_ms = timing["median_ms"]\n','    request_total_median_ms = request_total_timing["median_ms"]\n'),
          ('    if median_ms <= 0:\n','    if request_total_median_ms <= 0:\n'),
          ('        "schema_version": 1,\n','        "schema_version": 2,\n'),
          ('            "prefill plus fixed-length cached decode included"\n','            "request_total includes prompt/cache setup, prefill and fixed-length cached decode"\n'),
          ('        "generation": {\n            "statistics": timing,\n            "samples_ms": samples_ms,\n        },\n        "generated_tokens_per_second_median": args.decode_steps / (median_ms / 1000.0),\n',
           '        "request_total": {\n            "statistics": request_total_timing,\n            "samples_ms": request_total_samples_ms,\n        },\n        "generated_tokens_per_second_request_median": (\n            args.decode_steps / (request_total_median_ms / 1000.0)\n        ),\n')]
          for a,b in reps:
              if a not in s: raise SystemExit('Python marker missing: '+a[:60])
              s=s.replace(a,b,1)
          if 'generated_tokens_per_second_median' in s: raise SystemExit('ambiguous Python throughput remains')
          p.write_text(s)

          p=Path('docs/SMOLLM2_BENCHMARK.md'); s=p.read_text()
          s=s.replace('The primary comparison is `generation`:', 'The primary backend comparison is `request_total`:',1)
          s=s.replace('- a fresh NNIS `InferenceSession` is created before each timed NNIS sample;\n- NNIS session creation is timed and reported separately;\n- the timed region includes prompt prefill plus fixed-length greedy decode;\n', '- a fresh NNIS `InferenceSession` is created inside each `request_total` sample;\n- NNIS session creation and generation-only time are also reported separately;\n- NNIS `request_total` includes session/cache/workspace setup plus prefill and decode;\n',1)
          s=s.replace('- the Transformers harness uses `use_cache=True`, keeps each argmax token on\n  CUDA, feeds it back without a per-step `.item()`, and synchronizes CUDA only\n  at timing boundaries;\n', '- Transformers `request_total` starts before prompt-tensor creation, includes dynamic\n  KV-cache construction, keeps argmax/token feedback on CUDA, and synchronizes only\n  at timing boundaries;\n',1)
          old='The reported `generated_tokens_per_second_median` is:\n\n```text\ndecode_steps / median_generation_seconds\n```\n\nBecause the timed region also includes prefill, this is an end-to-end generated\nthroughput metric for the exact configured prompt and decode length. It is not\nan isolated steady-state decode-token rate.\n'
          new='The primary throughput is `generated_tokens_per_second_request_median`:\n\n```text\ndecode_steps / median_request_total_seconds\n```\n\nNNIS also reports `generated_tokens_per_second_generation_median` for an already-allocated session; that secondary value must not be compared with Transformers `request_total`. The request metric includes fresh request/cache setup and prefill, so it is not an isolated steady-state decode-token rate.\n'
          if old not in s: raise SystemExit('Docs throughput marker missing')
          s=s.replace(old,new,1)
          s=s.replace('- synchronized generation samples and distribution statistics;\n','- synchronized generation-only samples plus paired fresh-request (`request_total`) samples;\n',1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          cargo fmt --all
          cargo check --locked -p nnis-bench --example smollm2_e2e
          cargo clippy --locked -p nnis-bench --example smollm2_e2e -- -D warnings
          python3 -m py_compile tools/bench_smollm2_transformers.py
          python3 tools/bench_smollm2_transformers.py --help >/dev/null
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/nnis-bench/examples/smollm2_e2e.rs tools/bench_smollm2_transformers.py docs/SMOLLM2_BENCHMARK.md
          git commit -m "bench: compare fresh request totals across backends"
          git push origin HEAD:perf/smollm2-e2e-benchmark
