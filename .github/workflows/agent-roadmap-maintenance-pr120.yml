name: Agent roadmap maintenance PR120

on:
  push:
    branches:
      - agent/sovereignty-roadmap

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sovereignty-roadmap
      - name: Record PR120 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('.agent/NNIS_SOVEREIGNTY_ROADMAP.yaml')
          text = roadmap.read_text()
          marker = 'reference_products:\n'
          entry = (
              '  f16_steady_state_weight_allocation_accounting_v1:\n'
              '    pull_request: 120\n'
              '    exact_head: 0f9851a4ab215c3c7c48159fcbbc4ad4610ad0eb\n'
              '    merge_commit: 50a0a82be55e4ae60867efa483afea1495780cf4\n'
              '    required_CI: CI_361_success_including_Rust_1_77\n'
              '    smollm2_harness: harness_152_success\n'
              '    guarantees:\n'
              '      - existing_WeightAllocationSummaryV1_reused_for_private_resident_F16_weight_graph\n'
              '      - exact_live_DeviceBuffer_u16_owned_bytes_enumerated_from_actual_buffers_not_model_geometry\n'
              '      - pinned_SmolLM2_non_timing_F16_accounting_harness\n'
              '    limits:\n'
              '      - not_physical_GPU_page_residency\n'
              '      - not_process_wide_VRAM\n'
              '      - not_source_F32_or_conversion_temporary_peak\n'
              '      - no_performance_quality_compression_or_live_transition_claim\n'
              '    next: instrument_exact_F16_materialization_allocation_lifetimes_and_peak_owned_bytes\n'
          )
          if 'f16_steady_state_weight_allocation_accounting_v1:' not in text:
              anchor = '  weight_allocation_accounting_v1:\n'
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit('roadmap anchor not found')
              end = text.find('\nreference_products:\n', start)
              if end < 0:
                  raise SystemExit('roadmap insertion end not found')
              text = text[:end] + '\n' + entry + text[end:]
          roadmap.write_text(text)

          ml = Path('.agent/ML_MATURITY_5_OF_5.yaml')
          text = ml.read_text()
          text = text.replace(
              '  main_head: 90aca480b2f3f269f087868286e13aa419846654',
              '  main_head: 50a0a82be55e4ae60867efa483afea1495780cf4',
              1,
          )
          merge_anchor = '      - pr_119_exact_weight_allocation_accounting_v1\n'
          if 'pr_120_F16_steady_state_weight_allocation_accounting_v1' not in text:
              if merge_anchor not in text:
                  raise SystemExit('NNML2 merge anchor not found')
              text = text.replace(
                  merge_anchor,
                  merge_anchor + '      - pr_120_F16_steady_state_weight_allocation_accounting_v1\n',
                  1,
              )
          cap_anchor = '      - physical_page_residency_process_VRAM_allocator_overhead_and_F16_conversion_peak_remain_explicitly_outside_v1\n'
          if 'F16_resident_weight_graph_live_DeviceBuffer_u16_bytes_are_exactly_accounted' not in text:
              if cap_anchor not in text:
                  raise SystemExit('NNML2 capability anchor not found')
              text = text.replace(
                  cap_anchor,
                  cap_anchor
                  + '      - F16_resident_weight_graph_live_DeviceBuffer_u16_bytes_are_exactly_accounted_from_actual_allocations\n'
                  + '      - pinned_SmolLM2_F16_accounting_harness_emits_steady_state_owned_bytes_without_timing_or_generation\n',
                  1,
              )
          boundary_anchor = '    execution_transition_boundary:\n'
          if 'f16_steady_state_allocation_accounting_boundary:' not in text:
              if boundary_anchor not in text:
                  raise SystemExit('NNML2 boundary anchor not found')
              boundary = (
                  '    f16_steady_state_allocation_accounting_boundary:\n'
                  '      contract_version: nnis_model_WeightAllocationSummaryV1\n'
                  '      pull_request: 120\n'
                  '      exact_head: 0f9851a4ab215c3c7c48159fcbbc4ad4610ad0eb\n'
                  '      merge_commit: 50a0a82be55e4ae60867efa483afea1495780cf4\n'
                  '      required_CI: CI_361_success_on_exact_head_including_Rust_1_77\n'
                  '      exact_head_SmolLM2_harness: harness_152_success\n'
                  '      exact_scope: live_DeviceBuffer_u16_bytes_owned_by_resident_F16ModelWeights\n'
                  '      derived_from_model_geometry: false\n'
                  '      physical_page_residency_claimed: false\n'
                  '      process_wide_VRAM_claimed: false\n'
                  '      conversion_peak_claimed: false\n'
                  '      performance_or_quality_claimed: false\n'
              )
              text = text.replace(boundary_anchor, boundary + boundary_anchor, 1)
          ml.write_text(text)
          PY
      - name: Commit roadmap maintenance
        shell: bash
        run: |
          set -euo pipefail
          git add .agent/NNIS_SOVEREIGNTY_ROADMAP.yaml .agent/ML_MATURITY_5_OF_5.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(agent): record F16 steady-state allocation accounting"
          git push origin HEAD:agent/sovereignty-roadmap
