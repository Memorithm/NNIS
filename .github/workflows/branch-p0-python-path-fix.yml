name: Branch P0 Python path fix

on:
  push:
    branches:
      - feat/p0-physical-qualification-bundle-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/p0-physical-qualification-bundle-v1
          fetch-depth: 0

      - name: Preserve virtualenv executable paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/run_p0_physical_qualification_bundle.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'executable = executable.expanduser().resolve()': 'executable = executable.expanduser().absolute()',
              'smollm2_python = args.smollm2_python.expanduser().resolve()': 'smollm2_python = args.smollm2_python.expanduser().absolute()',
              'tinyllama_python = args.tinyllama_python.expanduser().resolve()': 'tinyllama_python = args.tinyllama_python.expanduser().absolute()',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate launcher self-test and syntax
        run: |
          python3 tools/run_p0_physical_qualification_bundle.py --self-test
          python3 -m py_compile tools/run_p0_physical_qualification_bundle.py

      - name: Commit code-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run_p0_physical_qualification_bundle.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(qualification): preserve virtualenv Python paths"
          git push origin HEAD:feat/p0-physical-qualification-bundle-v1
