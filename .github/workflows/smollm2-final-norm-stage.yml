name: Stage SmolLM2 final-norm diagnostic

on:
  push:
    branches: [research/smollm2-final-norm-diagnostic]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach test-only diagnostic module
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/nnis-model/src/runtime.rs")
          text = path.read_text()
          marker = '#[path = "smollm2_diagnostic.rs"]'
          if marker not in text:
              text += '\n#[cfg(test)]\n#[path = "smollm2_diagnostic.rs"]\nmod smollm2_diagnostic;\n'
              path.write_text(text)
          PY
      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test -p nnis-model --lib
      - name: Commit diagnostic wiring
        run: |
          if ! git diff --quiet; then
            git config user.name MEMOPERF
            git config user.email contact@checkupauto.fr
            git add crates/nnis-model/src/runtime.rs
            git commit -m "test(model): wire SmolLM2 final-norm diagnostic"
            git push origin HEAD:research/smollm2-final-norm-diagnostic
          fi
