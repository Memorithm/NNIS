name: Stage F32 project-kn candidate
on:
  push:
    branches: [perf/f32-decode-gemv-candidate]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/f32-decode-gemv-candidate
          fetch-depth: 0
      - name: Add project-kn candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/nnis-kernels/src/gemv.rs')
          s = p.read_text()

          kernel_marker = '''extern "C" __global__ void nnis_gemv_f32(
              const float* matrix,
              const float* vector,
              float* output,
              unsigned long long cols
          ) {
              extern __shared__ float partial[];
              const unsigned int lane = threadIdx.x;
              const unsigned long long row = blockIdx.x;
              const float* row_data = matrix + row * cols;

              float value = 0.0f;
              for (unsigned long long index = lane; index < cols; index += blockDim.x) {
                  value = fmaf(row_data[index], vector[index], value);
              }
              partial[lane] = value;
              __syncthreads();

              for (unsigned int stride = blockDim.x / 2; stride > 0; stride >>= 1) {
                  if (lane < stride) {
                      partial[lane] += partial[lane + stride];
                  }
                  __syncthreads();
              }
              if (lane == 0) {
                  output[row] = partial[0];
              }
          }
          '''
          project_kernel = kernel_marker + '''
          extern "C" __global__ void nnis_project_kn_f32(
              const float* input,
              const float* weight,
              float* output,
              unsigned long long k,
              unsigned long long n
          ) {
              const unsigned long long col =
                  (unsigned long long)blockIdx.x * blockDim.x + threadIdx.x;
              if (col >= n) return;

              float value = 0.0f;
              for (unsigned long long row = 0; row < k; ++row) {
                  value = fmaf(input[row], weight[row * n + col], value);
              }
              output[col] = value;
          }
          '''
          if 'nnis_project_kn_f32' not in s:
              if kernel_marker not in s:
                  raise SystemExit('kernel insertion marker missing')
              s = s.replace(kernel_marker, project_kernel, 1)

          s = s.replace(
              '''pub struct F32Gemv {
              gemv: Kernel,
              block_size: u32,
          }''',
              '''pub struct F32Gemv {
              gemv: Kernel,
              project_kn: Kernel,
              block_size: u32,
          }''',
              1,
          )

          old_load = '''        let gemv = module.get_function("nnis_gemv_f32")?;
                  let attributes = gemv.attributes()?;
                  if block_size > attributes.max_threads_per_block {
                      return Err(NnisError::invalid_input(format!(
                          "gemv block size {block_size} exceeds function limit {}",
                          attributes.max_threads_per_block
                      )));
                  }
                  if shared_memory_bytes as usize > attributes.max_dynamic_shared_memory_bytes as usize {
                      return Err(NnisError::invalid_input(format!(
                          "gemv requires {shared_memory_bytes} shared-memory bytes; function limit is {}",
                          attributes.max_dynamic_shared_memory_bytes
                      )));
                  }
                  Ok(Self { gemv, block_size })'''
          new_load = '''        let gemv = module.get_function("nnis_gemv_f32")?;
                  let project_kn = module.get_function("nnis_project_kn_f32")?;
                  let attributes = gemv.attributes()?;
                  if block_size > attributes.max_threads_per_block {
                      return Err(NnisError::invalid_input(format!(
                          "gemv block size {block_size} exceeds function limit {}",
                          attributes.max_threads_per_block
                      )));
                  }
                  if shared_memory_bytes as usize > attributes.max_dynamic_shared_memory_bytes as usize {
                      return Err(NnisError::invalid_input(format!(
                          "gemv requires {shared_memory_bytes} shared-memory bytes; function limit is {}",
                          attributes.max_dynamic_shared_memory_bytes
                      )));
                  }
                  let project_attributes = project_kn.attributes()?;
                  if block_size > project_attributes.max_threads_per_block {
                      return Err(NnisError::invalid_input(format!(
                          "project-kn block size {block_size} exceeds function limit {}",
                          project_attributes.max_threads_per_block
                      )));
                  }
                  Ok(Self {
                      gemv,
                      project_kn,
                      block_size,
                  })'''
          if 'let project_kn = module.get_function("nnis_project_kn_f32")?' not in s:
              if old_load not in s:
                  raise SystemExit('load insertion marker missing')
              s = s.replace(old_load, new_load, 1)

          method_marker = '''    fn validate_execution(
                  &self,
                  stream: &Stream,
                  matrix: &DeviceBuffer<f32>,
                  vector: &DeviceBuffer<f32>,
                  output: &DeviceBuffer<f32>,
                  rows: usize,
                  cols: usize,
              ) -> Result<()> {'''
          methods = '''    /// Compute `[1,K] × [K,N] -> [1,N]` and wait for completion.
              ///
              /// This orientation matches decoder projection weights as stored by NNIS.
              /// Each output column accumulates `K` with explicit `fmaf` in increasing
              /// index order, matching the current batch-one [`crate::F32Gemm`] path.
              pub fn project_kn(
                  &self,
                  stream: &Stream,
                  input: &DeviceBuffer<f32>,
                  weight: &DeviceBuffer<f32>,
                  output: &DeviceBuffer<f32>,
                  k: usize,
                  n: usize,
              ) -> Result<()> {
                  // SAFETY: all borrows remain live until synchronization below.
                  let enqueue_result =
                      unsafe { self.enqueue_project_kn(stream, input, weight, output, k, n) };
                  match enqueue_result {
                      Ok(()) => stream.synchronize(),
                      Err(error) => {
                          let _ = stream.synchronize();
                          Err(error)
                      }
                  }
              }

              /// Enqueue `[1,K] × [K,N] -> [1,N]` without synchronizing.
              ///
              /// # Safety
              ///
              /// All buffers, the stream, and this kernel must remain alive and
              /// otherwise untouched until the stream completes.
              pub unsafe fn enqueue_project_kn(
                  &self,
                  stream: &Stream,
                  input: &DeviceBuffer<f32>,
                  weight: &DeviceBuffer<f32>,
                  output: &DeviceBuffer<f32>,
                  k: usize,
                  n: usize,
              ) -> Result<()> {
                  self.validate_project_execution(stream, input, weight, output, k, n)?;
                  if n == 0 {
                      return Ok(());
                  }
                  if k == 0 {
                      // SAFETY: the output lifetime obligation is documented above.
                      return unsafe { output.zero_async(stream) };
                  }
                  let k_arg = u64::try_from(k)
                      .map_err(|_| NnisError::invalid_input("project-kn K exceeds u64::MAX"))?;
                  let n_arg = u64::try_from(n)
                      .map_err(|_| NnisError::invalid_input("project-kn N exceeds u64::MAX"))?;
                  let config = LaunchConfig::for_num_elements(n, self.block_size)?;
                  let mut arguments = KernelArgs::with_capacity(5, 3);
                  arguments
                      .push_buffer(input)
                      .push_buffer(weight)
                      .push_buffer(output)
                      .push(k_arg)
                      .push(n_arg);
                  let launch = KernelLaunch::new(&self.project_kn, stream, config);
                  // SAFETY: argument order/widths match `nnis_project_kn_f32`; the
                  // caller owns the asynchronous lifetime obligation.
                  unsafe { launch.launch(&mut arguments) }
              }

              fn validate_project_execution(
                  &self,
                  stream: &Stream,
                  input: &DeviceBuffer<f32>,
                  weight: &DeviceBuffer<f32>,
                  output: &DeviceBuffer<f32>,
                  k: usize,
                  n: usize,
              ) -> Result<()> {
                  let expected_weight = k
                      .checked_mul(n)
                      .ok_or_else(|| NnisError::invalid_input("project-kn shape overflows usize"))?;
                  if input.len() != k {
                      return Err(NnisError::invalid_input(format!(
                          "project-kn input has {} elements; shape requires {k}",
                          input.len()
                      )));
                  }
                  if weight.len() != expected_weight {
                      return Err(NnisError::invalid_input(format!(
                          "project-kn weight has {} elements; shape ({k}, {n}) requires {expected_weight}",
                          weight.len()
                      )));
                  }
                  if output.len() != n {
                      return Err(NnisError::invalid_input(format!(
                          "project-kn output has {} elements; shape requires {n}",
                          output.len()
                      )));
                  }
                  let context = self.project_kn.context();
                  if !Arc::ptr_eq(context, stream.ctx())
                      || !Arc::ptr_eq(context, input.ctx())
                      || !Arc::ptr_eq(context, weight.ctx())
                      || !Arc::ptr_eq(context, output.ctx())
                  {
                      return Err(NnisError::invalid_input(
                          "project-kn stream, buffers, and kernel must share one context",
                      ));
                  }
                  Ok(())
              }

          ''' + method_marker
          if 'pub unsafe fn enqueue_project_kn' not in s:
              if method_marker not in s:
                  raise SystemExit('method insertion marker missing')
              s = s.replace(method_marker, methods, 1)

          p.write_text(s)
          PY
      - name: Format and validate candidate
        run: |
          cargo fmt --all
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p nnis-kernels --lib
          cargo check --locked -p nnis-bench --example smollm2_projection_candidates
      - name: Commit candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/nnis-kernels/src/gemv.rs crates/nnis-bench/examples/smollm2_projection_candidates.rs
          if git diff --cached --quiet; then
            echo "No candidate changes"
            exit 0
          fi
          git commit -m "perf(kernels): add f32 batch-one project-kn candidate"
          git push origin HEAD:perf/f32-decode-gemv-candidate
