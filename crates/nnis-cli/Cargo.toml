[package]
name = "nnis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line generation frontend for NNIS"
publish = false

[[bin]]
name = "nnis"
path = "src/main.rs"

[[bin]]
name = "nnis-hf"
path = "src/bin/nnis-hf.rs"

[[bin]]
name = "nnis-kvlab-backend"
path = "src/bin/nnis-kvlab-backend.rs"

[[bin]]
name = "nnis-kvlab-backend-v4"
path = "src/bin/nnis-kvlab-backend-v4.rs"

[dependencies]
base64 = "=0.13.1"
nnis = { path = "../nnis" }
nnis-model = { path = "../nnis-model" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokenizers = { version = "=0.19.1", default-features = false, features = ["unstable_wasm"] }
