  - missing_quality_evidence
  - incompatible_environment_fingerprint
  - performance_claim_from_isolated_kernel_only
  - novelty_claim_without_prior_art_audit
  - claiming_zero_dequantization_when_scalar_or_register_conversion_occurs
  - claiming_eight_to_sixteen_x_without_measured_effective_bits_per_value

next_action: >-
  Audit DAL1 against the now-merged FLAT-bound DAL0 contract and prefer a narrow
  deterministic adapter/reuse of FLAT-owned representation semantics over a
  duplicate private codec. Keep the existing dense runtime default and make no
  compressed-KV performance or quality claim before later exact-storage,
  correctness, real-model, and hardware gates.
