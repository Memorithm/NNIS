      - sparse_key_residual_correction
      - no_dense_key_materialization_in_candidate_kernel
  - id: DAL3
    name: Asymmetric value path
    status: blocked_on_DAL2
    deliverables:
      - evaluate_groupwise_INT4_INT2_or_other_supported_low_bit_V_candidates
      - sparse_value_residual_path
      - compare_against_codebook_V_before_selecting_a_default_candidate
  - id: DAL4
    name: Dynamic hot cold precision
    status: blocked_on_DAL3
    deliverables:
      - explicit_page_or_segment_precision_tiers
      - deterministic_recency_and_attention_mass_baselines
      - versioned_transition_and_capacity_semantics
  - id: DAL5
    name: Real model qualification
    status: blocked_on_DAL4
    deliverables:
      - same_model_same_prompt_dense_vs_DA_LUC_comparison
      - quality_memory_latency_and_tokens_per_second_reported_together
      - multiple_context_lengths_and_decode_lengths
      - exact_head_green_CI_before_hardware_promotion
  - id: DAL6
    name: PHR-Lite semantic routing research
    status: blocked_until_DAL5_has_a_qualified_non_semantic_baseline
    scope: >-
      PHR-Lite may only propose KV precision, retention, page, or offload tiers.
      It does not replace tokenization, next-token prediction, the LM head, or the
      language-model objective in this program.
    required_controls:
      - recency_only_router
      - attention_mass_router
      - deterministic_random_control
      - same_storage_budget
      - same_quality_and_workload_suite
    promotion_rule: >-
      Do not promote PHR-Lite unless it beats simpler routing controls under the
      same storage and quality budget with reproducible real-model evidence.

