  pinned_release: "v0.10.0"
  pinned_commit: "71dd1bae032e70771265917ec74d3ff4cad07a10"
  secondary_server_reference: TensorRT_LLM
  rule: >-
    TensorRT Edge-LLM becomes the primary NVIDIA runtime to qualify on Jetson Thor
    because NVIDIA explicitly lists Jetson Thor + JetPack 7.0/7.1 + CUDA 13.0 +
    JetPack TensorRT as an officially supported platform. TensorRT-LLM remains a
    server-class/secondary reference and is not accepted as the Thor baseline
    unless a clean, reproducible Jetson-qualified environment is demonstrated.

