  clean_reference_eligible: false
  reasons:
    - editable_install_points_to_local_source_checkout
    - local_source_checkout_is_dirty
    - local_checkout_contains_modified_build_and_runtime_files
    - local_checkout_contains_untracked_stubs_and_bindings
    - declared_package_version_and_effective_source_identity_are_not_a_clean_release_identity
    - tensorrt_llm_import_fails_before_runtime_use_with_PydanticInvalidForJsonSchema
    - python_path_contains_two_TensorRT_distributions_10_15_1_29_and_10_13_3_9

same_model_gate:
  checkpoint: "HuggingFaceTB/SmolLM2-135M"
  pinned_revision: "93efa2f097d58c2a74874c7e644dbc9b0cee75a2"
  requirement: >-
    Do not claim an NNIS vs TensorRT Edge-LLM speedup or parity unless the exact
    pinned SmolLM2 checkpoint is accepted and executed by Edge-LLM with explicitly
    matched tokenizer, prompt, batch, decode length, precision semantics, and Thor
    power/clock regime.
  current_status: unqualified
  note: >-
    SmolLM2 uses LlamaForCausalLM/model_type=llama, but the Edge-LLM supported-model
    tables qualify specific Llama 3.x families. Architecture similarity alone is
    not evidence that this checkpoint is supported.

