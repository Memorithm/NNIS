  secondary_server_reference: TensorRT_LLM
  rule: >-
    TensorRT Edge-LLM is the primary qualified NVIDIA runtime reference on Jetson
    Thor because NVIDIA explicitly lists Jetson Thor + JetPack 7.0/7.1 + CUDA
    13.0 + JetPack TensorRT as an officially supported platform. TensorRT-LLM
    remains a server-class/secondary reference and is not accepted as the Thor
    baseline unless a clean, reproducible Jetson-qualified environment is
    demonstrated.

