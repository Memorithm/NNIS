roadmap:
  - id: R0
    name: Trustworthy evidence substrate
    status: substantially_complete
    next:
      - require fingerprint linkage in every new optimization_campaign
      - prevent_cross_regime_comparisons_from_being_reported_as_speedups
      - retain_exact_head_SHA_and_clean_worktree_provenance

  - id: R1
    name: TensorRT Edge-LLM reference line on Thor
    status: qualified_reference_precision_alignment_pending
    completed:
      - clean_v0_10_0_cpp_runtime_build_on_Thor
      - isolated_python_builder_environment_using_JetPack_TensorRT_10_13_3_9
      - exact_pinned_SmolLM2_source_weight_SHA256_match
      - tokenizer_byte_identity_with_NNIS_fixture
      - direct_fp16_engine_build
      - real_32_token_greedy_decode
      - exact_32_of_32_greedy_trajectory_match_with_qualified_NNIS_R2_artifacts
      - five_process_reference_campaign_under_fixed_MAXN_clocks
      - machine_readable_native_Edge_LLM_latency_throughput_and_unified_memory_profiles
      - NNIS_explicit_resident_F16_projection_plan_promoted_for_MinLatency
    next:
      - publish_reproducible_NNML5_reference_evidence_to_main_via_exact_head_green_PR
      - run_same_regime_direct_NNIS_F16_vs_Edge_LLM_campaign_before_any_cross_runtime_ratio
      - define_comparable_memory_metric_before_any_cross_runtime_memory_claim
      - preserve_TensorRT_LLM_as_secondary_server_reference
    forbid:
      - NNIS_vs_Edge_LLM_speedup_or_slowdown_without_direct_same_regime_cross_runtime_evidence
      - cross_runtime_memory_ratio_from_non_equivalent_memory_metrics
      - calling_exact_greedy_trajectory_bitwise_logit_equivalence

  - id: R2
    name: Kernel-only Elastic optimization
    status: active_parallel_value64_promoted
    parent_plan: E1_1_lm_head_GEMV64_plus_R2_parallel_value64_attention_all_f32
    completed_or_recorded:
      - R2_launch_submission_control_profiled_without_decoder_speedup_extrapolation
      - R2_silu_multiply_fusion_isolated_and_end_to_end_rejected_for_MinLatency
      - R2_cached_attention_parallel_value_isolated_sweep_and_end_to_end_promoted_for_MinLatency
    next:
      - reprofile_the_promoted_R2_parent_before_selecting_another_kernel_candidate
      - preserve_serial_cached_attention_as_correctness_oracle
      - qualify_cross_axis_composition_with_R3_W1_separately_before_calling_it_a_combined_best_plan
    goals:
      - prefer_measured_full_decode_bottlenecks_over_launch_count_proxies
      - prefer_fewer_higher_value_substitutions_over_thousands_of_tiny_launches
      - evaluate_fusion_only_when_it_removes_measurable_work_or_traffic
      - keep_rejected_candidates_as_evidence_not_hidden_failures

  - id: R3
    name: Elastic weight representation
    status: active_W1_promoted
    principle: >-
      Logical weights remain fixed; physical representation may vary per tensor,
      component or layer only through explicit, versioned plans.
    completed:
      - W1_LM_head_BF16_isolated_physical_sweep_on_Thor
      - representation_plan_v1_separate_from_kernel_plan
      - heterogeneous_f32_activation_BF16_LM_head_execution
      - model_format_v1_preserved
      - fingerprint_compatible_end_to_end_ABBA_with_identical_greedy_trajectory
      - W1_explicit_plan_promoted_for_MinLatency_and_MinMemory
    next:
      - retain_W1_as_explicit_plan_not_silent_global_default
      - make_future_representation_candidates_use_the_same_versioned_evidence_contract
      - evaluate_lower_bit_or_structured_representations_only_with_executable_reconstruction_and_layout_contracts
    forbid:
      - global_BF16_switch_as_shortcut
      - unsupported_INT4_or_sub2bit_claims
      - silent_quality_tolerance_relaxation

  - id: R4
    name: ElasticAutoTuner bridge
    status: pending_after_R2_R3_contracts
    architecture: >-
      NNIS exports candidates, hardware/problem fingerprints, measurements and
      correctness evidence. ElasticAutoTuner runs in a separate newer-toolchain
      environment and emits a versioned validated plan. NNIS production runtime
      replays only qualified plans and preserves Rust 1.77 MSRV.
    required_modes:
      - MinLatency
      - MinMemory
      - BalancedLatencyMemory
      - DeterministicOnly
    required_behavior:
