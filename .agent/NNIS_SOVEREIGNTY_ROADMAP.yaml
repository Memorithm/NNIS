agent_operating_protocol:
  must_read_this_file:
    - at_start_of_every_agent_session_on_this_repository
    - before_selecting_the_next_major_task
    - after_any_user_change_to_strategy_or_invariants
    - after_any_physical_benchmark_that_changes_promotion_state
    - before_opening_or_merging_a_performance_or_representation_PR
  must_update_this_file:
    - when_a_candidate_is_promoted_or_rejected
    - when_a_new_invariant_or_sovereignty_constraint_is_added
    - when_the_primary_reference_baseline_changes
    - when_a_roadmap_phase_changes_status
  fail_closed: >-
    If the roadmap cannot be read, an autonomous agent must not make a major
    architectural, performance-promotion, representation-format or merge decision.
    It may perform read-only diagnosis and report that the roadmap is unavailable.
