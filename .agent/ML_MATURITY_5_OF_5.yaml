completion_definition: >-
  NNIS is 5/5 only when it can load representative real models directly,
  execute prefill/decode/sampling/batching fully on supported NVIDIA hardware,
  interoperate with specialized attention/KV products through explicit contracts,
  and publish reproducible quality, latency, throughput and memory evidence.
