contract:
  report: HfSafetensorsPreflightReportV1
  report_schema_version: 1
  cli_schema: nnis.hf-preflight@1
  cli_surface: nnis-hf_validate
  network_access: false
  cuda_context_created: false
  cuda_allocation_performed: false
  model_format_v1_changed: false
  runtime_default_changed: false
  precision_policy_relaxed: false

validated_capabilities:
  - supported_Hugging_Face_config_capability_checked_before_CUDA
  - single_or_indexed_sharded_Safetensors_layout_checked_before_CUDA
  - shard_relative_path_and_existence_validation
  - recognized_decoder_tensor_name_shape_dtype_and_byte_length_validation
  - duplicate_logical_tensor_rejection
  - complete_decoder_graph_validation_with_tied_LM_head_rule
  - tokenizer_parseability_and_maximum_token_id_bounded_by_model_vocab
  - source_admission_distinguished_from_current_direct_F32_execution_readiness
  - versioned_machine_readable_JSON_for_external_orchestration
  - atomic_exact_byte_JSON_artifact_publication_for_external_orchestration

limits:
  - not_general_Hugging_Face_or_SOUP_model_family_support
  - not_FP16_direct_execution_admission
  - not_BNB_4bit_or_other_quantized_representation_admission
  - not_adapter_native_execution
  - not_numerical_equivalence_evidence
  - not_model_quality_evidence
  - not_serving_performance_evidence
  - not_physical_GPU_or_memory_evidence
  - unknown_unrecognized_tensors_are_ignored_consistently_with_current_loader

cross_project_boundary:
  intended_consumers:
    - scirust_hub_or_other_orchestrators
  rule: >-
    External controllers may consume the versioned JSON preflight result to
    reject incompatible artifacts before scheduling GPU execution, but they must
    not reimplement or broaden NNIS model-admission semantics.

