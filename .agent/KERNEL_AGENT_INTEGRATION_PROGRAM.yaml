schema_version: 1
kind: nnis_kernel_agent_integration_program
status: active
last_updated: "2026-09-02"
repository: Memorithm/NNIS
merge_policy: never_merge_this_file_to_main_unless_user_explicitly_requests

mission: >-
  Expose NNIS as a trustworthy native NVIDIA execution and evidence backend for
  Forge kernel search without moving search policy, LLM mutation, evolutionary
  selection or candidate promotion authority into NNIS.

principles:
  - NNIS_owns_runtime_kernel_semantics_reference_paths_and_final_promotion
  - Forge_owns_candidate_search_mutation_and_selection
  - no_PyTorch_runtime_dependency_is_introduced
  - candidate_and_baseline_must_share_explicit_numerical_semantics
  - TF32_mixed_precision_or_relaxed_tolerance_requires_an_explicit_distinct_campaign
  - compile_success_never_substitutes_for_correctness
  - isolated_kernel_measurement_never_substitutes_for_real_model_end_to_end_evidence
  - benchmark_environment_compatibility_remains_fail_closed
  - exact_head_CI_and_real_GPU_evidence_gate_any_NNIS_promotion

integration_contract:
  inputs_from_Forge:
    - versioned_kernel_task
    - candidate_source_and_content_identity
    - explicit_numerical_contract
    - requested_compile_options_with_no_hidden_precision_relaxation
  NNIS_backend_outputs:
    - NVRTC_compile_result_and_artifact_identity
    - kernel_resource_metadata_when_available
    - independent_verification_result_using_NNIS_or_destination_owned_oracle
    - CUDA_event_measurement_report
    - environment_fingerprint_and_exact_git_identity
  forbidden_outputs:
    - self_authorizing_runtime_promotion
    - speedup_claim_without_compatible_baseline_evidence

initial_vertical_slice:
  name: f32_elementwise_AXPBY_like_candidate
  gates:
    - compile_candidate_with_NNIS_JIT
    - launch_through_NNIS_runtime
    - compare_against_independent_host_oracle
    - record_CUDA_event_samples
    - preserve_environment_fingerprint
    - reject_wrong_candidate_before_measurement_selection

phase_evidence:
  NK0:
    nnis_main_commit: a4635547f3e46abd6652f8d319093dabc0baee6f
    forge_contract_main_commit: 01587804d9e321bc89c606b4215850cb202a907f
    finding: >-
      Existing public NNIS interfaces are sufficient for the first adapter:
      nnis-jit exports JitCompiler, CompileOptions, CompiledCode, Module,
      Kernel, KernelLaunch and launch configuration; nnis-rt exports Context,
      Stream, Event and DeviceBuffer; nnis-bench provides CUDA-event reports and
      fail-closed environment compatibility. No new NNIS CUDA API is required
      before the AXPBY-like qualification slice.
  NK1_host_qualification:
    forge_main_commit: 9762e78c8e89f570078a694f0c417932c1fa5fea
    forge_pull_request: 10
    exact_head_ci: 53a4b466d1f62e189dc1791895251e5ac6ab1efe
    pinned_nnis_commit: a4635547f3e46abd6652f8d319093dabc0baee6f
    result: passed
    evidence:
      - adapter_compiles_against_exact_pinned_NNIS
      - adapter_clippy_deny_warnings_passes
      - host_contract_tests_pass
      - strict_f32_TF32_disabled_gate_is_enforced
      - generated_candidate_compilation_uses_NNIS_JIT_NVRTC
      - launch_path_uses_NNIS_Driver_API_abstractions
      - verification_evidence_precedes_measurement_evidence
      - benchmark_translation_uses_NNIS_CUDA_events
      - NNIS_environment_completeness_is_fail_closed
      - axpby_smoke_contains_wrong_and_correct_candidate_hardware_path
  NK1_hardware_qualification:
    result: passed
    run_context_id: ka1-axpby-thor-20260901T062542Z
    forge_main_commit: 9762e78c8e89f570078a694f0c417932c1fa5fea
    pinned_nnis_commit: a4635547f3e46abd6652f8d319093dabc0baee6f
    platform_model: NVIDIA Jetson AGX Thor Developer Kit
    gpu_name: NVIDIA Thor
    host_arch: aarch64
    compute_capability: "11.0"
    multiprocessor_count: 20
    driver_version: "13.0"
    nvrtc_version: "13.0"
    host_kernel_release: 6.8.12-tegra
    power_mode: MAXN
    rejection_evidence:
      candidate_id: 1736353473005638305
      verification_passed: false
      measurement_present: false
    accepted_evidence:
      candidate_id: 14234751339825107857
      artifact_id: 42d804150fabd0f86cc7818b5aee1df79e4243ace10e234e9c4d56d3ea49637d
      verification_passed: true
      max_abs_error: 0.0
      max_rel_error: 0.0
      samples: 50
      median_ms: 0.020608000457286835
      mean_ms: 0.020865280106663706
      p95_ms: 0.02163200080394745
      observed_gigabytes_per_second: 610.5838373829606
    interpretation: >-
      The native Forge-to-NNIS compile, launch, oracle and CUDA-event evidence
      path is qualified on real NVIDIA hardware. This does not establish a
      speedup because no compatible baseline-vs-candidate comparison was part
      of the run.
  NK2_canonical_rmsnorm_discovery:
    result: microbenchmark_inter_run_qualified_but_not_decoder_transferable
    forge_environment_consensus_merge: 11d707e55749ab7bbd7bcd544e157c199bbfd303
    runs:
      - ka5-rmsnorm-matrix-thor-20260901T105650Z
      - ka6-rmsnorm-matrix-repeat-thor-20260901T123709Z
    validated_metadata_records: 256
    environment_compatible: true
    policy_consensus:
      candidate_block_size: 512
      baseline_block_size: 256
      candidate_preferred_shapes: 12
      baseline_preferred_shapes: 0
      inconclusive_shapes: 4
    transfer_blocker: >-
      The Forge campaign measured nnis-kernels F32RmsNorm with scalar gamma,
      while the real decoder uses nnis-model F32DecoderKernels weighted RMSNorm
      with a per-channel weight vector. The generic campaign therefore cannot
      authorize a decoder launch-policy change.
  NK2_weighted_rmsnorm_candidate_surface:
    result: merged_infrastructure_only
    pull_request: 70
    exact_head_ci: 408f62e9cdbd1b71458496c3339af607ec633f8a
    merge_commit: 08b6065e1faa2a5942bb0d6b449cde5dbbad4e5f
    default_runtime_change: false
    model_format_change: false
    semantics: decoder_weighted_f32_rmsnorm_with_per_channel_weights
    runtime_shape_audit:
      current_prefill_execution: token_serial
      current_decode_execution: token_serial
      rows: 1
      cols: config_hidden_size
      qualified_SmolLM2_hidden_size: 576
      weighted_rmsnorm_launches_per_token_for_30_layers: 61
    next_gate: >-
      Forge must compare block 256 versus block 512 on the actual weighted
      1x576 decoder operation using an independent weighted host oracle,
      CUDA-event measurements, fail-closed environment identity and paired
      ordering. No end-to-end plan may be created from the generic RMSNorm
      result.
  NK3_f16_parallel_score_KA17_qualification:
    result: physical_microbenchmark_correctness_gate_passed_not_promoted
    qualification_pull_request: 90
    qualification_exact_head: 6ff87a40810259e8e6299d4c32503a2e91e40b38
    qualification_merge_commit: c6ba55d90fbcc8090e981a6424421590e6c1c35f
    hardware_run: ka17_f16_attention_parallel_score_qualification
    geometry:
      query_heads: 9
      key_value_heads: 3
      head_dim: 64
      kv_rows: "1..=35"
      decode32_generation_kv_rows: "4..=34"
    numerical_contract: F16_query_key_value_storage_F32_score_softmax_value_accumulation_final_F16_output
    correctness:
      fixture_families: 6
      launch_widths: [64, 128, 256, 512]
      cases: 840
      bitwise_equal_cases: 840
      differing_elements: 0
      global_max_absolute_error: 0.0
      global_max_relative_error: 0.0
    predeclared_policy:
      kv_le_3: reference
      kv_4: block_128
      kv_5_through_16: block_256
      kv_17_through_35: block_512
      decode32_policy_slower_rows: 0
      decode32_generation_path_relative_improvement: 0.75058
    post_hoc_observation: >-
      Always using block 512 had a marginally lower isolated generation-path
      sum-of-row-medians than the predeclared policy, about two tenths of one
      percent. This must not be used to retune the policy from the same KA17
      evidence; any alternative policy requires a separately declared and
      independently confirmed campaign.
    claim_boundary: >-
      KA17 closes the synthetic short-context final-F16 correctness gate and
      demonstrates a large isolated attention proxy reduction on this physical
      environment. It is not decoder latency or tokens-per-second evidence and
      does not authorize a runtime default change.
  NK3_f16_parallel_score_KA18_e2e_surface:
    result: physical_e2e_ABBA_passed_awaiting_independent_repeat
    pull_request: 91
    exact_head_ci: 2a5b955cef9784c8300acf1a3b573326e9cf7fcb
    merge_commit: 0ad21de369d9e3d832de5944aef64332d8445662
    default_runtime_change: false
    model_format_change: false
    parent_projection_plan: resident_NK_transposed_projection
    candidate_attention_plan: thor_ka17_parallel_score_candidate
    dispatch_policy: reference_le_3_block128_at_4_block256_5_to_16_block512_17_to_35_reference_above_35
    qualified_model_scope: SmolLM2_135M_geometry_only
    failure_policy: selected_parallel_score_launch_resource_incompatibility_fails_closed
    physical_run:
      run_context_id: ka18-f16-parallel-score-e2e-abba-thor-20260902T185142Z
      reports: 24
      rounds: 6
      ordering: ABBA
      warmups_per_report: 2
      measured_requests_per_report: 7
      exact_greedy_reports: 24
      exact_greedy_tokens_per_report: 32
      environment_compatible_within_campaign: true
      candidate_round_wins: 6
      reference_round_wins: 0
      ties: 0
      rounds_at_or_above_3pct: 6
      generation_stage_gpu:
        median_paired_relative_improvement: 0.202664
        mean_paired_relative_improvement: 0.205562
        min_paired_relative_improvement: 0.198110
        max_paired_relative_improvement: 0.213997
        stdev_paired_relative_improvement_points: 0.006551
        median_AB_relative_improvement: 0.208013
        median_BA_relative_improvement: 0.198601
        median_order_bias_delta_points: 0.009413
        median_reference_process_ms: 252.888033
        median_candidate_process_ms: 201.226512
        aggregate_speedup_ratio: 1.256733
      secondary_wall_metrics:
        generation_wall_median_paired_relative_improvement: 0.186990
        request_total_wall_median_paired_relative_improvement: 0.183811
    interpretation: >-
      The fixed KA17 policy survives the real SmolLM2 decode32 path with the
      exact known greedy trajectory in every warmup/measured report and wins all
      six paired ABBA rounds. The observed order delta is small relative to the
      roughly twenty-percent paired GPU effect and does not reverse any round.
      This is end-to-end evidence for this exact model, short-context trajectory,
      commit and physical environment, not a cross-model or long-context claim.
    next_gate: >-
      Repeat the same frozen policy in a separately identified physical ABBA
      campaign. Cross-campaign comparison must require distinct non-empty run
      context ids while matching all stable hardware/software/power/clock fields,
      the exact commit, model provenance, trajectory, warmup/iteration contract,
      and campaign schema. Only a compatible independent repeat may authorize a
      production-default promotion review.
  NK3_f16_parallel_score_KA19_consensus_verifier:
    result: merged_evidence_tooling_awaiting_independent_physical_repeat
    pull_request: 92
    exact_head_ci: 3871bd4967d50410a0f32086b4cbbfad6cfc81a2
    merge_commit: 30323aca4448aad43c43bfdd1392d416046ce964
    runtime_default_change: false
    kernel_change: false
    verifier: nnis-bench/examples/smollm2_f16_attention_abba_consensus
    evidence_contract:
      campaign_count: 2
      reports_per_campaign: 24
      rounds_per_campaign: 6
      ordering: ABBA
      warmups_per_report: 2
      measured_requests_per_report: 7
      exact_greedy_tokens_per_report: 32
      minimum_paired_effect_for_review: 0.03
      required_candidate_round_wins_per_campaign: 6
      required_positive_order_directions: [AB, BA]
    integrity:
      - timing_medians_recomputed_from_raw_samples
      - declared_medians_must_bit_match_recomputation
      - paired_round_effects_reconstructed_from_raw_reports
      - pinned_model_provenance_and_execution_plan_revalidated
      - run_context_ids_must_be_nonempty_and_distinct
      - exact_runtime_git_commit_must_match_across_campaigns
      - clean_git_checkout_required
      - stable_environment_fields_must_match_fail_closed
      - only_run_context_id_is_normalized_for_cross_campaign_environment_check
    next_gate: >-
      Run KA19 as a separately identified ABBA repeat using exactly runtime
      commit 0ad21de369d9e3d832de5944aef64332d8445662, the same frozen KA17 policy,
      the same pinned SmolLM2 fixture and measurement contract, and a distinct
      run-context id. Then validate KA18 plus KA19 with the verifier merged at
      30323aca4448aad43c43bfdd1392d416046ce964. A successful verifier result
      authorizes only a narrow production-default promotion review for the exact
      qualified SmolLM2 decode32 short-context scope; it is not cross-device,
      cross-model or long-context evidence.

phases:
  - id: NK0
    name: Adapter surface audit
    status: completed
    goals:
      - identify_minimal_public_nnis_jit_nnis_rt_and_nnis_bench_interfaces_needed_by_Forge
      - avoid_new_public_API_when_existing_interfaces_are_sufficient
  - id: NK1
    name: Forge NNIS adapter qualification
    status: completed
    goals:
      - run_first_AXPBY_like_closed_loop_without_PyTorch
      - prove_verification_precedes_measurement
      - prove_incompatible_environment_comparison_fails_closed
      - qualify_the_path_on_real_NVIDIA_hardware
  - id: NK2
    name: Native transformer kernel search
    status: in_progress
    goals:
      - RMSNorm_softmax_GEMV_GEMM_RoPE_attention
      - retain_existing_NNIS_reference_paths_as_oracles
      - require_destination_end_to_end_requalification_before_plan_promotion
  - id: NK3
    name: Attention_and_decode search
    status: in_progress
    goals:
      - expose_measured_bottlenecks_as_search_tasks
      - integrate_FLAT_ATTENTION_only_through_versioned_semantics
      - qualify_winners_on_real_prefill_and_autoregressive_decode

success_definition: >-
  Forge can use NNIS as a native CUDA compilation execution verification and
  measurement backend while NNIS keeps sovereign correctness and promotion
  control and no candidate is promoted from microbenchmark evidence alone.
